<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | MakePlacement</title>
  <meta name="robots" content="noindex, nofollow">

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.10/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    button, input { font-family: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid #3b6fe0; outline-offset: 2px; }
    @media (max-width: 900px) {
      .mp-nav-secondary { display: none; }
    }
    @media (max-width: 760px) {
      .mp-card-grid { grid-template-columns: 1fr !important; }
    }
    #boot-error { display: none; max-width: 760px; margin: 48px auto; padding: 20px; color: #111; }
    #boot-error pre { white-space: pre-wrap; background: #f7f7f7; padding: 12px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error">
    <h2>Something went wrong.</h2>
    <pre id="boot-error-detail"></pre>
  </div>

  <script>
    window.addEventListener("pageshow", function (event) { if (event.persisted) window.location.reload(); });
    window.addEventListener("error", function (event) {
      const box = document.getElementById("boot-error");
      const detail = document.getElementById("boot-error-detail");
      if (box && detail && !document.getElementById("root").hasChildNodes()) {
        box.style.display = "block";
        detail.textContent = event.error ? (event.error.stack || event.error.message) : event.message;
      }
    });
  </script>

  <script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const SUPABASE_URL = "https://cnayvrtkxgqpejhrlakm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- design tokens (identical to the employer/recruiter dashboards) ----------
const T = {
  ink: "#111214", sub: "#6b7075", faint: "#9a9ea3", line: "#e7e7e9", lineSoft: "#f0f0f1",
  paper: "#ffffff", paperDim: "#fafafa", pillBg: "#f2f2f3",
  blue: "#3b6fe0", blueBg: "#eaf1ff", green: "#1a8a4a", greenBg: "#e8f6ec",
  red: "#c0392b", redBg: "#fbeceb", gold: "#a06a1d", goldBg: "#faf1e0",
  sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
};

function money(v) { return v == null || v === "" ? "\u2014" : `$${Number(v).toLocaleString()}`; }
function formatWhen(iso) {
  if (!iso) return "\u2014";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "\u2014";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function shortDate(iso) {
  if (!iso) return "\u2014";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "\u2014";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function fullName(row) { return [row.contact_first_name, row.last_name].filter(Boolean).join(" ") || "\u2014"; }
function externalUrl(url) { if (!url) return ""; return /^https?:\/\//i.test(url) ? url : `https://${url}`; }
const isRejected = (c) => (c.status || "").toLowerCase() === "rejected";
const isPlaced = (c) => (c.status || "").toLowerCase() === "placed";
const isActive = (c) => !isRejected(c) && !isPlaced(c);

function initialOf(name) { return (name || "?").trim().charAt(0).toUpperCase() || "?"; }

// ---------- icons ----------
function Icon({ name, size = 16, style }) {
  const c = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "logout": return <svg {...c}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>;
    case "search": return <svg {...c}><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>;
    case "x": return <svg {...c}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "shield": return <svg {...c}><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z" /><polyline points="9 12 11 14 15 10" /></svg>;
    case "briefcase": return <svg {...c}><rect x="2" y="7" width="20" height="14" rx="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></svg>;
    case "users": return <svg {...c}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>;
    case "mail": return <svg {...c}><rect x="2" y="4" width="20" height="16" rx="2" /><polyline points="22 6 12 13 2 6" /></svg>;
    case "building": return <svg {...c}><rect x="4" y="2" width="16" height="20" rx="1" /><line x1="9" y1="7" x2="9" y2="7.01" /><line x1="15" y1="7" x2="15" y2="7.01" /><line x1="9" y1="11" x2="9" y2="11.01" /><line x1="15" y1="11" x2="15" y2="11.01" /><line x1="9" y1="15" x2="9" y2="15.01" /><line x1="15" y1="15" x2="15" y2="15.01" /></svg>;
    case "chevronDown": return <svg {...c}><polyline points="6 9 12 15 18 9" /></svg>;
    default: return null;
  }
}

// ---------- shared building blocks (identical patterns to the two dashboards) ----------
function Pill({ children, tone, style, ...rest }) {
  const tones = {
    default: { bg: T.pillBg, fg: T.ink }, live: { bg: T.blueBg, fg: T.blue },
    paused: { bg: T.goldBg, fg: T.gold }, filled: { bg: T.greenBg, fg: T.green },
    rejected: { bg: T.redBg, fg: T.red }, placed: { bg: T.greenBg, fg: T.green },
  };
  const t = tones[tone] || tones.default;
  return <span {...rest} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: 600, padding: "4px 10px", borderRadius: 999, background: t.bg, color: t.fg, whiteSpace: "nowrap", ...style }}>{children}</span>;
}

function PrimaryButton(props) {
  return <button {...props} style={{ background: T.ink, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontSize: 13.5, fontWeight: 600, cursor: props.disabled ? "default" : "pointer", opacity: props.disabled ? 0.55 : 1, fontFamily: T.sans, ...props.style }} />;
}

const inputStyle = { width: "100%", boxSizing: "border-box", padding: "10px 13px", fontSize: 13.5, borderRadius: 10, border: `1px solid ${T.line}`, outline: "none", color: T.ink, background: "#fff", fontFamily: T.sans };

function Avatar({ label, size = 38 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: T.ink, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.4, fontWeight: 700, flexShrink: 0 }}>
      {initialOf(label)}
    </div>
  );
}

function EmptyState({ icon, title, body }) {
  return (
    <div style={{ border: `1.5px dashed ${T.line}`, borderRadius: 14, padding: "56px 24px", textAlign: "center" }}>
      <div style={{ width: 44, height: 44, borderRadius: 10, background: T.blueBg, color: T.blue, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px" }}>
        <Icon name={icon} size={20} />
      </div>
      <div style={{ fontSize: 16, fontWeight: 700, color: T.ink, marginBottom: 4 }}>{title}</div>
      {body && <div style={{ fontSize: 13, color: T.sub, maxWidth: 360, margin: "4px auto 0" }}>{body}</div>}
    </div>
  );
}

function SearchBox({ value, onChange, placeholder }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${T.line}`, borderRadius: 10, padding: "11px 14px", marginBottom: 18, maxWidth: 380 }}>
      <Icon name="search" size={16} style={{ color: T.faint }} />
      <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} style={{ border: "none", outline: "none", fontSize: 13.5, flex: 1, fontFamily: T.sans, color: T.ink }} />
    </div>
  );
}

function FilterChip({ label, onClear }) {
  return (
    <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600, color: T.blue, background: T.blueBg, padding: "6px 12px", borderRadius: 999, marginBottom: 16 }}>
      Filtered: {label}
      <button onClick={onClear} style={{ background: "none", border: "none", color: T.blue, cursor: "pointer", display: "flex", padding: 0 }}><Icon name="x" size={12} /></button>
    </div>
  );
}

function SectionHeading({ eyebrow, title, subtitle }) {
  return (
    <div style={{ marginBottom: 20 }}>
      {eyebrow && <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: T.blue, marginBottom: 6 }}>{eyebrow}</div>}
      <div style={{ fontSize: 22, fontWeight: 700, color: T.ink, letterSpacing: "-0.01em" }}>{title}</div>
      {subtitle && <div style={{ fontSize: 13.5, color: T.sub, marginTop: 4 }}>{subtitle}</div>}
    </div>
  );
}

// ---------- data ----------
async function fetchTable(table, opts = {}) {
  let q = supabaseClient.from(table).select(opts.select || "*");
  if (opts.order) q = q.order(opts.order, { ascending: opts.ascending !== false });
  if (opts.limit) q = q.limit(opts.limit);
  const { data, error } = await q;
  if (error) throw new Error(`Failed loading ${table}: ${error.message}`);
  return data || [];
}

// ---------- overview ----------
function OverviewTab({ data, onJump }) {
  const live = data.roles.filter((r) => (r.status || "live").toLowerCase() === "live").length;
  const placedCount = data.candidates.filter(isPlaced).length;
  const activeCount = data.candidates.filter(isActive).length;

  const recent = [
    ...data.messages.slice(0, 12).map((m) => ({
      key: `m-${m.id}`, time: m.created_at, kind: "message",
      text: `${m.sender_type === "company" ? "A company" : "A recruiter"} sent a message on ${data.roleById[m.role_id] ? data.roleById[m.role_id].name : "a role"}`,
      jump: () => onJump("messages"),
    })),
    ...data.candidates.slice(0, 12).map((c) => ({
      key: `c-${c.id}`, time: c.created_at, kind: "candidate",
      text: `${c.name} submitted for ${data.roleById[c.role_id] ? data.roleById[c.role_id].name : "a role"}`,
      jump: () => onJump("candidates", { roleId: c.role_id }),
    })),
  ].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 12);

  return (
    <div>
      <SectionHeading eyebrow="Platform-wide" title="Everything happening on MakePlacement" subtitle="A live view across every company, recruiter, role, and conversation." />

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 32 }}>
        {[
          ["Companies", data.companies.length],
          ["Recruiters", data.recruiters.length],
          ["Live roles", live],
          ["Interviewing", activeCount],
          ["Placed", placedCount],
          ["Messages sent", data.messages.length],
        ].map(([label, value]) => (
          <div key={label} style={{ border: `1px solid ${T.line}`, borderRadius: 14, padding: "18px 20px", flex: 1, minWidth: 150 }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: T.ink }}>{value}</div>
            <div style={{ fontSize: 12.5, color: T.sub, marginTop: 2 }}>{label}</div>
          </div>
        ))}
      </div>

      <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, marginBottom: 12 }}>Recent activity</div>
      {recent.length === 0 ? (
        <EmptyState icon="mail" title="No activity yet" body="Messages and candidate submissions will show up here as they happen." />
      ) : (
        <div style={{ border: `1px solid ${T.line}`, borderRadius: 14, overflow: "hidden" }}>
          {recent.map((r) => (
            <button key={r.key} onClick={r.jump} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", gap: 12, padding: "13px 16px", borderBottom: `1px solid ${T.lineSoft}`, cursor: "pointer", fontSize: 13, background: "#fff", border: "none", textAlign: "left", fontFamily: T.sans }}>
              <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ width: 26, height: 26, borderRadius: "50%", background: r.kind === "message" ? T.blueBg : T.greenBg, color: r.kind === "message" ? T.blue : T.green, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <Icon name={r.kind === "message" ? "mail" : "briefcase"} size={13} />
                </span>
                <span style={{ color: T.ink }}>{r.text}</span>
              </span>
              <span style={{ color: T.faint, whiteSpace: "nowrap", fontSize: 12 }}>{formatWhen(r.time)}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- companies ----------
function CompaniesTab({ data, onJump }) {
  const [q, setQ] = useState("");
  const roleCountByCompany = {};
  data.roles.forEach((r) => { roleCountByCompany[r.company_id] = (roleCountByCompany[r.company_id] || 0) + 1; });

  const rows = data.companies.filter((c) => {
    if (!q) return true;
    return `${c.name || ""} ${fullName(c)} ${c.email || ""}`.toLowerCase().includes(q.toLowerCase());
  });

  return (
    <div>
      <SectionHeading eyebrow={`${data.companies.length} total`} title="Companies" />
      <SearchBox value={q} onChange={setQ} placeholder="Search by company, contact, or email\u2026" />
      {rows.length === 0 ? (
        <EmptyState icon="building" title="No companies found" />
      ) : (
        <div className="mp-card-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(270px, 1fr))", gap: 14 }}>
          {rows.map((c) => (
            <button key={c.id} onClick={() => onJump("roles", { companyId: c.id })} style={{ textAlign: "left", border: `1px solid ${T.line}`, borderRadius: 14, padding: 18, background: "#fff", cursor: "pointer", fontFamily: T.sans }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                <Avatar label={c.name || "C"} />
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 700, color: T.ink, overflow: "hidden", textOverflow: "ellipsis" }}>{c.name || "Unnamed company"}</div>
                  <div style={{ fontSize: 12.5, color: T.sub }}>{fullName(c)}</div>
                </div>
              </div>
              <div style={{ fontSize: 12.5, color: T.sub, marginBottom: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.email || "\u2014"}</div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <Pill tone="live">{roleCountByCompany[c.id] || 0} role{(roleCountByCompany[c.id] || 0) === 1 ? "" : "s"}</Pill>
                <span style={{ fontSize: 11.5, color: T.faint }}>{shortDate(c.created_at)}</span>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- recruiters ----------
function RecruitersTab({ data, onJump }) {
  const [q, setQ] = useState("");
  const candidateCountByRecruiter = {};
  data.candidates.forEach((c) => { if (c.recruiter_id) candidateCountByRecruiter[c.recruiter_id] = (candidateCountByRecruiter[c.recruiter_id] || 0) + 1; });
  const appCountByRecruiter = {};
  data.applications.forEach((a) => { appCountByRecruiter[a.recruiter_id] = (appCountByRecruiter[a.recruiter_id] || 0) + 1; });

  const rows = data.recruiters.filter((r) => {
    if (!q) return true;
    return `${r.firm_name || ""} ${fullName(r)} ${r.email || ""}`.toLowerCase().includes(q.toLowerCase());
  });

  return (
    <div>
      <SectionHeading eyebrow={`${data.recruiters.length} total`} title="Recruiters" />
      <SearchBox value={q} onChange={setQ} placeholder="Search by name, firm, or email\u2026" />
      {rows.length === 0 ? (
        <EmptyState icon="users" title="No recruiters found" />
      ) : (
        <div className="mp-card-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(270px, 1fr))", gap: 14 }}>
          {rows.map((r) => (
            <button key={r.id} onClick={() => onJump("candidates", { recruiterId: r.id })} style={{ textAlign: "left", border: `1px solid ${T.line}`, borderRadius: 14, padding: 18, background: "#fff", cursor: "pointer", fontFamily: T.sans }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                <Avatar label={fullName(r) !== "\u2014" ? fullName(r) : r.firm_name} />
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 700, color: T.ink, overflow: "hidden", textOverflow: "ellipsis" }}>{fullName(r)}</div>
                  <div style={{ fontSize: 12.5, color: T.sub, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.firm_name || "\u2014"}</div>
                </div>
              </div>
              <div style={{ fontSize: 12.5, color: T.sub, marginBottom: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.email || "\u2014"}</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                <Pill>{appCountByRecruiter[r.id] || 0} applied</Pill>
                <Pill tone="live">{candidateCountByRecruiter[r.id] || 0} submitted</Pill>
              </div>
              <div style={{ fontSize: 11.5, color: T.faint }}>{r.years_experience || "\u2014"} \u00b7 signed up {shortDate(r.created_at)}</div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- roles ----------
function RolesTab({ data, filters, onClearFilter, onJump }) {
  const [q, setQ] = useState("");
  const candidateCountByRole = {};
  data.candidates.forEach((c) => { candidateCountByRole[c.role_id] = (candidateCountByRole[c.role_id] || 0) + 1; });

  let rows = data.roles;
  const companyFilterLabel = filters.companyId && data.companyById[filters.companyId] ? data.companyById[filters.companyId].name : null;
  if (filters.companyId) rows = rows.filter((r) => r.company_id === filters.companyId);
  if (q) rows = rows.filter((r) => `${r.name || ""} ${data.companyById[r.company_id] ? data.companyById[r.company_id].name : ""}`.toLowerCase().includes(q.toLowerCase()));

  return (
    <div>
      <SectionHeading eyebrow={`${data.roles.length} total`} title="Roles" />
      {companyFilterLabel && <FilterChip label={companyFilterLabel} onClear={() => onClearFilter("companyId")} />}
      <SearchBox value={q} onChange={setQ} placeholder="Search by role or company\u2026" />
      {rows.length === 0 ? (
        <EmptyState icon="briefcase" title="No roles found" />
      ) : (
        <div className="mp-card-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(270px, 1fr))", gap: 14 }}>
          {rows.map((r) => {
            const status = (r.status || "live").toLowerCase();
            const company = data.companyById[r.company_id];
            return (
              <button key={r.id} onClick={() => onJump("candidates", { roleId: r.id })} style={{ textAlign: "left", border: `1px solid ${T.line}`, borderRadius: 14, padding: 18, background: "#fff", cursor: "pointer", fontFamily: T.sans }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <Pill tone={status}>{status}</Pill>
                </div>
                <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, marginBottom: 3 }}>{r.name}</div>
                <div style={{ fontSize: 12.5, color: T.sub, marginBottom: 10 }}>{company ? company.name : "\u2014"}</div>
                <div style={{ fontSize: 12.5, color: T.sub, marginBottom: 10 }}>{money(r.min_salary)} {"\u2013"} {money(r.max_salary)}</div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <Pill tone="live">{candidateCountByRole[r.id] || 0} candidate{(candidateCountByRole[r.id] || 0) === 1 ? "" : "s"}</Pill>
                  <span style={{ fontSize: 11.5, color: T.faint }}>{shortDate(r.created_at)}</span>
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------- candidates ----------
function CandidateAdminCard({ candidate, roleName, companyName, recruiterName }) {
  const tone = isPlaced(candidate) ? "placed" : isRejected(candidate) ? "rejected" : "live";
  const label = isPlaced(candidate) ? "Placed" : isRejected(candidate) ? "Rejected" : "Interviewing";
  return (
    <div style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 16, marginBottom: 10, background: "#fff" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div>
          <div style={{ fontSize: 14.5, fontWeight: 700, color: T.ink }}>{candidate.name}</div>
          <div style={{ fontSize: 12.5, color: T.sub, marginTop: 2 }}>{roleName} {companyName ? `\u00b7 ${companyName}` : ""}</div>
          <div style={{ fontSize: 12.5, color: T.sub, marginTop: 1 }}>via {recruiterName}</div>
        </div>
        <Pill tone={tone}>{label}</Pill>
      </div>
      <div style={{ display: "flex", gap: 12, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
        {candidate.email && <span style={{ fontSize: 12, color: T.sub }}>{candidate.email}</span>}
        {candidate.linkedin && <a href={externalUrl(candidate.linkedin)} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: T.blue }}>LinkedIn</a>}
        {candidate.resume_url && <a href={externalUrl(candidate.resume_url)} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: T.blue }}>Resume</a>}
        <span style={{ fontSize: 11.5, color: T.faint, marginLeft: "auto" }}>submitted {shortDate(candidate.created_at)}</span>
      </div>
      {candidate.notes && <div style={{ fontSize: 13, color: "#333", marginTop: 10, whiteSpace: "pre-wrap" }}>{candidate.notes}</div>}
    </div>
  );
}

function CandidatesTab({ data, filters, onClearFilter }) {
  const [q, setQ] = useState("");

  let rows = data.candidates;
  if (filters.roleId) rows = rows.filter((c) => c.role_id === filters.roleId);
  if (filters.recruiterId) rows = rows.filter((c) => c.recruiter_id === filters.recruiterId);
  if (q) rows = rows.filter((c) => `${c.name || ""} ${c.email || ""}`.toLowerCase().includes(q.toLowerCase()));

  const filterLabel = filters.roleId && data.roleById[filters.roleId]
    ? data.roleById[filters.roleId].name
    : filters.recruiterId && data.recruiterById[filters.recruiterId]
      ? fullName(data.recruiterById[filters.recruiterId])
      : null;

  return (
    <div>
      <SectionHeading eyebrow={`${data.candidates.length} total`} title="Candidates" />
      {filterLabel && <FilterChip label={filterLabel} onClear={() => onClearFilter(filters.roleId ? "roleId" : "recruiterId")} />}
      <SearchBox value={q} onChange={setQ} placeholder="Search by candidate name or email\u2026" />
      {rows.length === 0 ? (
        <EmptyState icon="users" title="No candidates found" />
      ) : (
        rows.map((c) => {
          const role = data.roleById[c.role_id];
          const company = role ? data.companyById[role.company_id] : null;
          const recruiter = c.recruiter_id ? data.recruiterById[c.recruiter_id] : null;
          return (
            <CandidateAdminCard
              key={c.id}
              candidate={c}
              roleName={role ? role.name : "\u2014"}
              companyName={company ? company.name : ""}
              recruiterName={recruiter ? fullName(recruiter) : "\u2014"}
            />
          );
        })
      )}
    </div>
  );
}

// ---------- messages ----------
function MessagesTab({ data, filters, onClearFilter }) {
  const [q, setQ] = useState("");
  const [expandedKey, setExpandedKey] = useState(null);

  let msgs = data.messages;
  const filterLabel = filters.roleId && data.roleById[filters.roleId] ? data.roleById[filters.roleId].name : null;
  if (filters.roleId) msgs = msgs.filter((m) => m.role_id === filters.roleId);

  const threads = {};
  msgs.forEach((m) => {
    const key = `${m.role_id}:${m.candidate_id || ""}:${m.recruiter_id || ""}`;
    if (!threads[key]) threads[key] = { key, role_id: m.role_id, candidate_id: m.candidate_id, recruiter_id: m.recruiter_id, messages: [] };
    threads[key].messages.push(m);
  });
  let threadList = Object.values(threads).sort((a, b) => new Date(b.messages[b.messages.length - 1].created_at) - new Date(a.messages[a.messages.length - 1].created_at));
  if (q) threadList = threadList.filter((t) => t.messages.some((m) => (m.body || "").toLowerCase().includes(q.toLowerCase())));

  const threadLabel = (t) => {
    if (t.candidate_id) {
      const c = data.candidateById[t.candidate_id];
      return `${c ? c.name : "Candidate"} \u2014 feedback thread`;
    }
    if (t.recruiter_id) {
      const r = data.recruiterById[t.recruiter_id];
      return `Direct: ${r ? fullName(r) : "Recruiter"}`;
    }
    return "Bench broadcast";
  };

  return (
    <div>
      <SectionHeading eyebrow={`${data.messages.length} total`} title="Messages" subtitle="Every conversation across every role, all in one feed." />
      {filterLabel && <FilterChip label={filterLabel} onClear={() => onClearFilter("roleId")} />}
      <SearchBox value={q} onChange={setQ} placeholder="Search message text\u2026" />

      {threadList.length === 0 ? (
        <EmptyState icon="mail" title="No messages found" />
      ) : (
        threadList.map((t) => {
          const role = data.roleById[t.role_id];
          const company = role ? data.companyById[role.company_id] : null;
          const open = expandedKey === t.key;
          const last = t.messages[t.messages.length - 1];
          return (
            <div key={t.key} style={{ border: `1px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
              <button onClick={() => setExpandedKey(open ? null : t.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", width: "100%", gap: 12, background: "none", border: "none", cursor: "pointer", textAlign: "left", fontFamily: T.sans, padding: 0 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: T.ink }}>{threadLabel(t)}</div>
                  <div style={{ fontSize: 12, color: T.sub, marginTop: 2 }}>{role ? role.name : "Role"} {company ? `\u00b7 ${company.name}` : ""}</div>
                  {!open && <div style={{ fontSize: 12.5, color: T.sub, marginTop: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{last.body}</div>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                  <span style={{ fontSize: 11, color: T.faint, whiteSpace: "nowrap" }}>{formatWhen(last.created_at)}</span>
                  <Icon name="chevronDown" size={14} style={{ color: T.faint, transform: open ? "rotate(180deg)" : "none" }} />
                </div>
              </button>
              {open && (
                <div style={{ marginTop: 14, borderTop: `1px solid ${T.lineSoft}`, paddingTop: 14 }}>
                  {t.messages.map((m) => {
                    const senderRecruiter = m.recruiter_id ? data.recruiterById[m.recruiter_id] : null;
                    return (
                      <div key={m.id} style={{ padding: "8px 0", borderBottom: `1px solid ${T.lineSoft}` }}>
                        <div style={{ fontSize: 13, color: "#333", whiteSpace: "pre-wrap" }}>{m.body}</div>
                        <div style={{ fontSize: 11, color: T.faint, marginTop: 3 }}>
                          {m.sender_type === "company" ? (company ? company.name : "Company") : (senderRecruiter ? fullName(senderRecruiter) : "Recruiter")} {"\u00b7"} {formatWhen(m.created_at)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

// ---------- login ----------
function Login({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [debug, setDebug] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setSubmitting(true);
    setError("");
    setDebug(null);
    const { data, error: signInErr } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
    if (signInErr) {
      setError("Incorrect email or password.");
      setSubmitting(false);
      return;
    }
    const authedEmail = data.session.user.email;
    const { data: adminRow, error: adminErr } = await supabaseClient.from("admins").select("id, email").ilike("email", authedEmail).maybeSingle();
    if (!adminErr && adminRow) {
      onSignedIn(data.session);
      return;
    }
    await supabaseClient.auth.signOut();
    setError("This account isn't authorized for admin access.");
    setDebug({ typedEmail: email.trim(), authenticatedEmail: authedEmail, queryError: adminErr ? { message: adminErr.message, code: adminErr.code } : null, queryResult: adminRow });
    setSubmitting(false);
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#fff" }}>
      <form onSubmit={submit} style={{ width: "100%", maxWidth: 340, padding: 24, border: `1px solid ${T.line}`, borderRadius: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
          <div style={{ width: 26, height: 26, borderRadius: 7, background: T.ink, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon name="shield" size={14} style={{ color: "#fff" }} />
          </div>
          <div style={{ fontSize: 16, fontWeight: 700, color: T.ink }}>Admin sign in</div>
        </div>
        <input style={{ ...inputStyle, marginBottom: 10 }} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} required />
        <input style={{ ...inputStyle, marginBottom: 14 }} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} required />
        {error && <div style={{ color: T.red, fontSize: 12.5, marginBottom: 12 }}>{error}</div>}
        {debug && (
          <pre style={{ fontSize: 10.5, background: T.paperDim, padding: 10, borderRadius: 8, overflow: "auto", marginBottom: 12, color: "#333" }}>
            {JSON.stringify(debug, null, 2)}
          </pre>
        )}
        <PrimaryButton type="submit" disabled={submitting} style={{ width: "100%" }}>{submitting ? "Signing in\u2026" : "Sign in"}</PrimaryButton>
      </form>
    </div>
  );
}

// ---------- top nav (matches the employer/recruiter dashboards) ----------
function Logomark() {
  return (
    <div style={{ width: 26, height: 26, borderRadius: 7, background: T.ink, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round">
        <line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="14" y2="17" />
      </svg>
    </div>
  );
}

const TABS = [
  { key: "overview", label: "Overview" },
  { key: "companies", label: "Companies" },
  { key: "recruiters", label: "Recruiters" },
  { key: "roles", label: "Roles" },
  { key: "candidates", label: "Candidates" },
  { key: "messages", label: "Messages" },
];

function TopNav({ tab, onTabChange, onLogout }) {
  const [menuOpen, setMenuOpen] = useState(false);
  return (
    <div style={{ borderBottom: `1px solid ${T.line}`, background: "#fff" }}>
      <div style={{ maxWidth: 1320, margin: "0 auto", padding: "0 28px", height: 64, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 30 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Logomark />
            <span style={{ fontSize: 16.5, fontWeight: 700, color: T.ink, letterSpacing: "-0.01em" }}>MakePlacement</span>
            <span style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: T.sub, background: T.pillBg, padding: "3px 8px", borderRadius: 999 }}>Admin</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 22 }} className="mp-nav-secondary">
            {TABS.map((t) => (
              <button
                key={t.key}
                onClick={() => onTabChange(t.key)}
                style={{
                  background: "none", border: "none", padding: "4px 0", fontSize: 13.5, fontWeight: tab === t.key ? 700 : 500,
                  color: tab === t.key ? T.ink : T.sub, cursor: "pointer",
                  borderBottom: tab === t.key ? `2px solid ${T.ink}` : "2px solid transparent", fontFamily: T.sans,
                }}
              >
                {t.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ position: "relative" }}>
          <button onClick={() => setMenuOpen((o) => !o)} style={{ width: 32, height: 32, borderRadius: "50%", background: T.ink, color: "#fff", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="shield" size={15} />
          </button>
          {menuOpen && (
            <div style={{ position: "absolute", right: 0, top: 40, background: "#fff", border: `1px solid ${T.line}`, borderRadius: 10, boxShadow: "0 8px 24px rgba(0,0,0,0.08)", minWidth: 150, overflow: "hidden", zIndex: 20 }}>
              <button onClick={onLogout} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left", padding: "10px 14px", fontSize: 13, color: T.ink, background: "none", border: "none", cursor: "pointer", fontFamily: T.sans }}>
                <Icon name="logout" size={14} /> Log out
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- main ----------
function AdminApp() {
  const [session, setSession] = useState(undefined);
  const [authorized, setAuthorized] = useState(false);
  const [tab, setTab] = useState("overview");
  const [filters, setFilters] = useState({});
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const checkAdmin = async (sess) => {
    const { data: adminRow } = await supabaseClient.from("admins").select("id").ilike("email", sess.user.email).maybeSingle();
    return !!adminRow;
  };

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { setSession(null); return; }
      const ok = await checkAdmin(session);
      if (!ok) { await supabaseClient.auth.signOut(); setSession(null); return; }
      setSession(session);
      setAuthorized(true);
    });
  }, []);

  const loadAll = async () => {
    setLoading(true);
    setError("");
    try {
      const [companies, recruiters, roles, candidates, messages, applications] = await Promise.all([
        fetchTable("companies", { order: "created_at" }),
        fetchTable("recruiters", { order: "created_at" }),
        fetchTable("roles", { order: "created_at" }),
        fetchTable("candidates", { order: "created_at" }),
        fetchTable("messages", { order: "created_at", limit: 1000 }),
        fetchTable("role_applications"),
      ]);
      const companyById = {}; companies.forEach((c) => (companyById[c.id] = c));
      const recruiterById = {}; recruiters.forEach((r) => (recruiterById[r.id] = r));
      const roleById = {}; roles.forEach((r) => (roleById[r.id] = r));
      const candidateById = {}; candidates.forEach((c) => (candidateById[c.id] = c));
      setData({ companies, recruiters, roles, candidates, messages: messages.reverse(), applications, companyById, recruiterById, roleById, candidateById });
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { if (authorized) loadAll(); }, [authorized]);

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    setSession(null);
    setAuthorized(false);
  };

  const jump = (nextTab, nextFilters) => { setTab(nextTab); setFilters(nextFilters || {}); };
  const clearFilter = (key) => setFilters((f) => { const next = { ...f }; delete next[key]; return next; });

  if (session === undefined) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: T.sub, fontSize: 13 }}>{"loading\u2026"}</div>;
  if (!session || !authorized) return <Login onSignedIn={(s) => { setSession(s); setAuthorized(true); }} />;

  return (
    <div style={{ minHeight: "100vh", background: "#fff", color: T.ink, fontFamily: T.sans }}>
      <TopNav tab={tab} onTabChange={jump} onLogout={handleLogout} />
      <div style={{ maxWidth: 1320, margin: "0 auto", padding: "32px 28px 100px" }}>
        {loading || !data ? (
          <div style={{ fontSize: 13, color: T.sub }}>{"Loading everything\u2026"}</div>
        ) : error ? (
          <div style={{ fontSize: 13, color: T.red }}>{error}</div>
        ) : (
          <>
            {tab === "overview" && <OverviewTab data={data} onJump={jump} />}
            {tab === "companies" && <CompaniesTab data={data} onJump={jump} />}
            {tab === "recruiters" && <RecruitersTab data={data} onJump={jump} />}
            {tab === "roles" && <RolesTab data={data} filters={filters} onClearFilter={clearFilter} onJump={jump} />}
            {tab === "candidates" && <CandidatesTab data={data} filters={filters} onClearFilter={clearFilter} />}
            {tab === "messages" && <MessagesTab data={data} filters={filters} onClearFilter={clearFilter} />}
          </>
        )}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AdminApp />);
  </script>
</body>
