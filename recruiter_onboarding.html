<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruiter onboarding | MakePlacement</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #ffffff;
    color: #17171a;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .progress {
    height: 3px;
    background: #eee;
  }
  .progress-fill {
    height: 100%;
    background: #17171a;
    transition: width .2s;
  }

  .content {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
    padding: 56px 24px 40px;
  }

  .step-count {
    font-size: 13px;
    color: #9a9a9a;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }

  .subtitle {
    font-size: 14.5px;
    color: #777;
    margin-bottom: 36px;
  }

  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1px solid #e4e4e8;
    border-radius: 12px;
    padding: 16px 18px;
    font-family: inherit;
    font-size: 15px;
    color: #17171a;
    cursor: pointer;
    margin-bottom: 10px;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover { border-color: #b8b8c0; }
  .option.selected {
    border-color: #17171a;
    background: #17171a;
    color: #fff;
  }

  .helper {
    font-size: 13px;
    color: #9a9a9a;
    margin: -6px 0 20px;
  }

  .explainer {
    background: #f7f7f5;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 22px 24px;
    font-size: 14.5px;
    line-height: 1.6;
    color: #333;
    margin-bottom: 24px;
  }
  .explainer b { font-weight: 600; }

  .ack {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .ack input { margin-top: 3px; }

  .review-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
    font-size: 14.5px;
  }
  .review-row:last-child { border-bottom: none; }
  .review-label { color: #9a9a9a; }
  .review-value { color: #17171a; font-weight: 500; text-align: right; max-width: 60%; }

  footer {
    border-top: 1px solid #eee;
    padding: 18px 24px;
  }
  .footer-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .back-link {
    font-size: 14px;
    color: #17171a;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
  }
  .back-link.disabled { color: #ccc; cursor: default; text-decoration: none; }

  .next-btn {
    background: #17171a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .next-btn:disabled {
    background: #e5e5e5;
    color: #aaa;
    cursor: default;
  }

  .center-msg {
    max-width: 480px;
    margin: 160px auto;
    text-align: center;
    color: #777;
    font-size: 14.5px;
  }
</style>
</head>
<body>
  <div id="root">
    <div class="center-msg">Loading…</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cnayvrtkxgqpejhrlakm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOGIN_URL = 'index.html';
    const RECRUITER_DASHBOARD_URL = 'recruiter_dashboard.html';

    const INDUSTRIES = [
      'Technology / Software',
      'Finance',
      'Healthcare',
      'Sales',
      'Legal',
      'Consumer / Retail',
      'Manufacturing / Industrial',
      'Other',
    ];

    const YEARS_OPTIONS = ['Less than 1 year', '1–3 years', '3–5 years', '5–10 years', '10+ years'];

    const state = {
      session: null,
      recruiterId: null,
      stepIndex: 0,
      data: {
        industries: [],
        executivePlacements: null,   // true | false
        yearsExperience: null,       // string
        contingencyExperience: null, // true | false
        contingencyAck: false,
      },
      submitting: false,
      submitError: '',
    };

    const steps = ['industries', 'executive', 'years', 'contingency', 'review'];

    function render() {
      const root = document.getElementById('root');
      root.innerHTML = '';
      root.appendChild(buildPage());
    }

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === 'className') node.className = v;
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v !== undefined && v !== null) node.setAttribute(k, v);
      });
      (Array.isArray(children) ? children : [children]).forEach((c) => {
        if (c === null || c === undefined) return;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
      return node;
    }

    function canProceed(stepKey) {
      const d = state.data;
      if (stepKey === 'industries') return d.industries.length > 0;
      if (stepKey === 'executive') return d.executivePlacements !== null;
      if (stepKey === 'years') return d.yearsExperience !== null;
      if (stepKey === 'contingency') {
        if (d.contingencyExperience === null) return false;
        if (d.contingencyExperience === false) return d.contingencyAck === true;
        return true;
      }
      return true;
    }

    function buildOptionStep({ title, subtitle, options, selected, onSelect, multi }) {
      const wrap = el('div');
      wrap.appendChild(el('h1', {}, title));
      if (subtitle) wrap.appendChild(el('div', { className: 'subtitle' }, subtitle));
      options.forEach((opt) => {
        const isSelected = multi ? selected.includes(opt) : selected === opt;
        const btn = el(
          'button',
          {
            className: 'option' + (isSelected ? ' selected' : ''),
            type: 'button',
            onClick: () => onSelect(opt),
          },
          opt
        );
        wrap.appendChild(btn);
      });
      return wrap;
    }

    function buildIndustriesStep() {
      return buildOptionStep({
        title: 'What industries have you placed in?',
        subtitle: 'Select all that apply — this is how we match you to relevant roles.',
        options: INDUSTRIES,
        selected: state.data.industries,
        multi: true,
        onSelect: (opt) => {
          const set = new Set(state.data.industries);
          set.has(opt) ? set.delete(opt) : set.add(opt);
          state.data.industries = [...set];
          render();
        },
      });
    }

    function buildExecutiveStep() {
      return buildOptionStep({
        title: 'Have you made executive placements before?',
        subtitle: 'Executive searches (VP+) run differently than individual-contributor hiring.',
        options: ['Yes', 'No'],
        selected: state.data.executivePlacements === null ? null : state.data.executivePlacements ? 'Yes' : 'No',
        onSelect: (opt) => {
          state.data.executivePlacements = opt === 'Yes';
          render();
        },
      });
    }

    function buildYearsStep() {
      return buildOptionStep({
        title: 'How many years of recruiting experience do you have?',
        options: YEARS_OPTIONS,
        selected: state.data.yearsExperience,
        onSelect: (opt) => {
          state.data.yearsExperience = opt;
          render();
        },
      });
    }

    function buildContingencyStep() {
      const wrap = el('div');
      wrap.appendChild(el('h1', {}, 'Have you done contingency hiring before?'));
      wrap.appendChild(
        el(
          'div',
          { className: 'subtitle' },
          'Contingency means you\u2019re only paid if your candidate gets placed \u2014 no retainer, no guarantee.'
        )
      );

      ['Yes', 'No'].forEach((opt) => {
        const isSelected =
          state.data.contingencyExperience === null
            ? false
            : (state.data.contingencyExperience ? 'Yes' : 'No') === opt;
        wrap.appendChild(
          el(
            'button',
            {
              className: 'option' + (isSelected ? ' selected' : ''),
              type: 'button',
              onClick: () => {
                state.data.contingencyExperience = opt === 'Yes';
                if (opt === 'Yes') state.data.contingencyAck = true;
                else state.data.contingencyAck = false;
                render();
              },
            },
            opt
          )
        );
      });

      if (state.data.contingencyExperience === false) {
        const explainer = el('div', { className: 'explainer' }, [
          el('div', {}, [
            el('b', {}, 'How contingency hiring works here: '),
            document.createTextNode(
              'You only get paid when a candidate you submit is hired for the role. There\u2019s no upfront fee and no guaranteed payout \u2014 you\u2019re competing with other recruiters working the same role, and only a successful placement earns a fee.'
            ),
          ]),
        ]);
        wrap.appendChild(explainer);

        const ackLabel = el('label', { className: 'ack' });
        const checkbox = el('input', { type: 'checkbox' });
        checkbox.checked = state.data.contingencyAck;
        checkbox.addEventListener('change', (e) => {
          state.data.contingencyAck = e.target.checked;
          render();
        });
        ackLabel.appendChild(checkbox);
        ackLabel.appendChild(document.createTextNode('I understand and want to proceed on this basis.'));
        wrap.appendChild(ackLabel);
      }

      return wrap;
    }

    function buildReviewStep() {
      const d = state.data;
      const wrap = el('div');
      wrap.appendChild(el('h1', {}, 'Review your profile'));
      wrap.appendChild(el('div', { className: 'subtitle' }, 'This is what clients see when deciding whether to approve you for a role.'));

      const rows = [
        ['Industries', d.industries.join(', ')],
        ['Executive placements', d.executivePlacements ? 'Yes' : 'No'],
        ['Years of experience', d.yearsExperience],
        ['Contingency hiring', d.contingencyExperience ? 'Has done it before' : 'New to contingency, acknowledged terms'],
      ];

      rows.forEach(([label, value]) => {
        wrap.appendChild(
          el('div', { className: 'review-row' }, [
            el('div', { className: 'review-label' }, label),
            el('div', { className: 'review-value' }, value),
          ])
        );
      });

      if (state.submitError) {
        wrap.appendChild(el('div', { style: 'color:#b42318;font-size:13px;margin-top:16px;' }, state.submitError));
      }

      return wrap;
    }

    function buildStepContent() {
      const key = steps[state.stepIndex];
      if (key === 'industries') return buildIndustriesStep();
      if (key === 'executive') return buildExecutiveStep();
      if (key === 'years') return buildYearsStep();
      if (key === 'contingency') return buildContingencyStep();
      return buildReviewStep();
    }

    async function submitProfile() {
      state.submitting = true;
      state.submitError = '';
      render();
      try {
        const { error } = await supabaseClient
          .from('recruiters')
          .update({
            industries: state.data.industries,
            executive_placements: state.data.executivePlacements,
            years_experience: state.data.yearsExperience,
            contingency_experience: state.data.contingencyExperience,
            contingency_ack: state.data.contingencyAck,
          })
          .eq('id', state.recruiterId);
        if (error) throw new Error(error.message);
        window.location.href = RECRUITER_DASHBOARD_URL;
      } catch (err) {
        state.submitting = false;
        state.submitError = err.message || 'Something went wrong saving your profile.';
        render();
      }
    }

    function buildPage() {
      const key = steps[state.stepIndex];
      const isLast = state.stepIndex === steps.length - 1;
      const pct = ((state.stepIndex + 1) / steps.length) * 100;

      const wrap = el('div', { className: 'wrap' });

      const progress = el('div', { className: 'progress' });
      progress.appendChild(el('div', { className: 'progress-fill', style: `width:${pct}%` }));
      wrap.appendChild(progress);

      const content = el('div', { className: 'content' });
      content.appendChild(el('div', { className: 'step-count' }, `${state.stepIndex + 1}/${steps.length}`));
      content.appendChild(buildStepContent());
      wrap.appendChild(content);

      const footer = el('footer');
      const footerInner = el('div', { className: 'footer-inner' });

      const backBtn = el(
        'button',
        {
          className: 'back-link' + (state.stepIndex === 0 ? ' disabled' : ''),
          type: 'button',
          onClick: () => {
            if (state.stepIndex > 0) {
              state.stepIndex -= 1;
              render();
            }
          },
        },
        'Back'
      );
      footerInner.appendChild(backBtn);

      if (!isLast) {
        const nextBtn = el(
          'button',
          {
            className: 'next-btn',
            type: 'button',
            disabled: !canProceed(key) ? 'true' : undefined,
            onClick: () => {
              if (!canProceed(key)) return;
              state.stepIndex += 1;
              render();
            },
          },
          'Next'
        );
        if (!canProceed(key)) nextBtn.disabled = true;
        footerInner.appendChild(nextBtn);
      } else {
        const submitBtn = el(
          'button',
          {
            className: 'next-btn',
            type: 'button',
            onClick: submitProfile,
          },
          state.submitting ? 'Saving…' : 'Finish'
        );
        submitBtn.disabled = state.submitting;
        footerInner.appendChild(submitBtn);
      }

      footer.appendChild(footerInner);
      wrap.appendChild(footer);

      return wrap;
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = LOGIN_URL;
        return;
      }
      state.session = session;

      const { data: recruiter, error } = await supabaseClient
        .from('recruiters')
        .select('id')
        .eq('auth_user_id', session.user.id)
        .maybeSingle();

      if (error || !recruiter) {
        document.getElementById('root').innerHTML =
          '<div class="center-msg">We couldn\'t find your recruiter profile. Please sign up again.</div>';
        return;
      }

      state.recruiterId = recruiter.id;
      render();
    }

    init();
  </script>
</body>
</html>
