<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruiter onboarding | makeplacement</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;1,400&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #ffffff;
    color: #17171a;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid #eee;
  }
  .topbar a {
    font-family: 'Newsreader', serif;
    font-size: 18px;
    font-weight: 500;
    color: #17171a;
    text-decoration: none;
  }
  .topbar button {
    background: none;
    border: none;
    font-size: 13.5px;
    color: #17171a;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
  }

  .progress {
    height: 3px;
    background: #eee;
  }
  .progress-fill {
    height: 100%;
    background: #17171a;
    transition: width .2s;
  }

  .content {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
    padding: 56px 24px 40px;
  }

  .step-count {
    font-size: 13px;
    color: #9a9a9a;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }

  h2 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1.25;
    letter-spacing: -0.005em;
    margin: 36px 0 6px;
  }
  h2:first-of-type { margin-top: 0; }

  .subtitle {
    font-size: 14.5px;
    color: #777;
    margin-bottom: 20px;
  }

  .field-label {
    font-size: 15px;
    font-weight: 600;
    color: #17171a;
    margin-bottom: 10px;
  }
  .field-label .opt {
    font-weight: 400;
    color: #9a9a9a;
  }

  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #ddd;
    outline: none;
    color: #17171a;
    background: #fff;
    font-family: inherit;
    margin-bottom: 26px;
  }
  input[type="text"]:focus { border-color: #4b6bfb; }

  .tag-input-box {
    width: 100%;
    box-sizing: border-box;
    min-height: 48px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 26px;
    cursor: text;
  }
  .tag-input-box:focus-within { border-color: #4b6bfb; }
  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f0f0f2;
    color: #17171a;
    font-size: 13.5px;
    font-weight: 500;
    padding: 6px 8px 6px 12px;
    border-radius: 999px;
  }
  .tag-pill button {
    background: none;
    border: none;
    color: #9a9a9a;
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
    line-height: 1;
  }
  .tag-input-box input {
    flex: 1;
    min-width: 120px;
    border: none;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    padding: 6px 4px;
  }

  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1px solid #e4e4e8;
    border-radius: 12px;
    padding: 16px 18px;
    font-family: inherit;
    font-size: 15px;
    color: #17171a;
    cursor: pointer;
    margin-bottom: 10px;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover { border-color: #b8b8c0; }
  .option.selected {
    border-color: #17171a;
    background: #17171a;
    color: #fff;
  }

  .helper {
    font-size: 13px;
    color: #9a9a9a;
    margin: -6px 0 20px;
  }

  .explainer {
    background: #f7f7f5;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 22px 24px;
    font-size: 14.5px;
    line-height: 1.6;
    color: #333;
    margin-bottom: 24px;
  }
  .explainer b { font-weight: 600; }

  .ack {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .ack input { margin-top: 3px; }

  .review-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
    font-size: 14.5px;
  }
  .review-row:last-child { border-bottom: none; }
  .review-label { color: #9a9a9a; }
  .review-value { color: #17171a; font-weight: 500; text-align: right; max-width: 60%; }

  footer {
    border-top: 1px solid #eee;
    padding: 18px 24px;
  }
  .footer-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .back-link {
    font-size: 14px;
    color: #17171a;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
  }
  .back-link.disabled { color: #ccc; cursor: default; text-decoration: none; }

  .next-btn {
    background: #17171a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .next-btn:disabled {
    background: #e5e5e5;
    color: #aaa;
    cursor: default;
  }

  .center-msg {
    max-width: 480px;
    margin: 160px auto;
    text-align: center;
    color: #777;
    font-size: 14.5px;
  }
</style>
</head>
<body>
  <div id="root">
    <div class="center-msg">Loading…</div>
  </div>

  <script>
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) window.location.reload();
    });
  </script>

  <script>
    const SUPABASE_URL = 'https://cnayvrtkxgqpejhrlakm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOGIN_URL = 'index.html';
    const RECRUITER_DASHBOARD_URL = 'recruiter_dashboard.html';

    const YEARS_OPTIONS = ['Less than 1 year', '1–3 years', '3–5 years', '5–10 years', '10+ years'];

    const state = {
      session: null,
      recruiterId: null,
      recruiterVerified: null,
      contactFirstName: '',
      stepIndex: 0,
      data: {
        firmName: '',
        yearsExperience: null,
        industries: [],
        locations: [],
        phone: '',
        executivePlacements: null,   // true | false
        executiveLevel: null,        // 'C-suite' | 'VPs/SVPs' | 'Directors/Heads/GM'
        contingencyExperience: null, // true | false
        contingencyAck: false,
        termsAccepted: false,
      },
      industryDraft: '',
      locationDraft: '',
      submitting: false,
      submitError: '',
      submitted: false,
      draftRestored: false,
      hasPassword: false,
      pwValue: '',
      pwConfirm: '',
      pwShow: false,
      pwSkipped: false,
      pwSaving: false,
      pwSaved: false,
      pwError: '',
      attemptedNext: false,
    };

    function reqMark() {
      return el('span', { style: 'color:#d64545;' }, ' *');
    }

    // Wraps a field's content in a container with `id` (used to scroll to
    // it) and, once the user has tried to advance past this step with it
    // unfilled, shows `message` underneath instead of silently blocking
    // the Next/Finish button.
    function fieldWrap(id, ok, message, contentEls) {
      const wrap = el('div', { id });
      (Array.isArray(contentEls) ? contentEls : [contentEls]).forEach((c) => wrap.appendChild(c));
      if (state.attemptedNext && !ok) {
        wrap.appendChild(el('div', { style: 'font-size:12.5px;color:#b42318;margin:-18px 0 20px;' }, message));
      }
      return wrap;
    }

    const steps = ['firm', 'experience', 'review'];

    function draftKey() {
      return `mp_recruiter_draft_${state.session.user.id}`;
    }

    // Mirrors onboarding.html's rule: only a draft with actual progress
    // in it is worth restoring/flagging -- not a freshly-initialized one.
    function hasMeaningfulDraft(data, stepIndex) {
      if (!data) return false;
      if (stepIndex > 0) return true;
      if (typeof data.firmName === 'string' && data.firmName.trim().length > 0) return true;
      if (data.yearsExperience) return true;
      if (Array.isArray(data.industries) && data.industries.length > 0) return true;
      if (typeof data.phone === 'string' && data.phone.trim().length > 0) return true;
      return false;
    }

    function saveDraft() {
      if (!state.session || !state.recruiterId || state.submitted) return;
      localStorage.setItem(draftKey(), JSON.stringify({ data: state.data, stepIndex: state.stepIndex }));
    }

    // A recruiter who signed in through a magic link has no password yet --
    // state.hasPassword mirrors user_metadata.password_set, which is only
    // ever set once they add one. Offered, never required, so a slow or
    // broken password save can never stand between someone and their
    // already-saved profile.
    function buildSetPasswordPrompt() {
      const wrap = el('div', { style: 'text-align:left;border:1px solid #ececec;border-radius:16px;padding:22px;margin-top:24px;background:#f7f7f5;box-shadow:0 4px 16px rgba(20,20,25,0.04);' });
      wrap.appendChild(el('div', { style: 'font-size:15px;font-weight:600;margin-bottom:4px;color:#17171a;' }, 'Add a password (optional)'));
      wrap.appendChild(
        el(
          'div',
          { style: 'font-size:13px;color:#777;margin-bottom:16px;' },
          "You signed in with an email link. Add a password if you'd rather log in that way next time, or skip and keep using email links."
        )
      );

      const row = el('div', { style: 'display:flex;gap:8px;margin-bottom:8px;' });
      const pwInput = el('input', { type: state.pwShow ? 'text' : 'password', placeholder: 'New password', style: 'flex:1;margin-bottom:0;' });
      pwInput.value = state.pwValue;
      pwInput.addEventListener('input', (e) => { state.pwValue = e.target.value; });
      row.appendChild(pwInput);
      row.appendChild(
        el(
          'button',
          {
            type: 'button',
            style: 'border:1px solid #eee;background:#fff;color:#555;border-radius:8px;padding:0 14px;cursor:pointer;font-size:13px;',
            onClick: () => { state.pwShow = !state.pwShow; render(); },
          },
          state.pwShow ? 'Hide' : 'Show'
        )
      );
      wrap.appendChild(row);

      const confirmInput = el('input', { type: state.pwShow ? 'text' : 'password', placeholder: 'Confirm password', style: 'margin-bottom:8px;' });
      confirmInput.value = state.pwConfirm;
      confirmInput.addEventListener('input', (e) => { state.pwConfirm = e.target.value; });
      wrap.appendChild(confirmInput);

      if (state.pwError) {
        wrap.appendChild(el('div', { style: 'font-size:12.5px;color:#b42318;margin-bottom:8px;' }, state.pwError));
      }

      const actions = el('div', { style: 'display:flex;gap:16px;align-items:center;margin-top:8px;' });
      const saveBtn = el('button', { type: 'button', className: 'next-btn', onClick: savePassword }, state.pwSaving ? 'Saving…' : 'Save password');
      saveBtn.disabled = state.pwSaving;
      actions.appendChild(saveBtn);
      actions.appendChild(
        el(
          'button',
          {
            type: 'button',
            style: 'background:none;border:none;color:#777;font-size:13px;text-decoration:underline;cursor:pointer;',
            onClick: () => { state.pwSkipped = true; render(); },
          },
          'Skip for now'
        )
      );
      wrap.appendChild(actions);

      return wrap;
    }

    async function savePassword() {
      if (state.pwValue.length < 8) {
        state.pwError = 'Must be at least 8 characters.';
        render();
        return;
      }
      if (state.pwValue !== state.pwConfirm) {
        state.pwError = "Passwords don't match.";
        render();
        return;
      }
      state.pwSaving = true;
      state.pwError = '';
      render();
      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: state.pwValue,
          data: { password_set: true },
        });
        if (error) throw error;
        state.pwSaving = false;
        state.pwSaved = true;
        state.hasPassword = true;
        render();
      } catch (err) {
        state.pwSaving = false;
        state.pwError = err.message || 'Something went wrong saving your password.';
        render();
      }
    }

    function buildSubmittedScreen() {
      const wrap = el('div', { className: 'wrap' });
      wrap.appendChild(buildTopBar());
      const box = el('div', { style: 'max-width:480px;margin:120px auto;text-align:center;padding:0 24px;' });
      box.appendChild(el('div', { style: 'font-size:22px;font-weight:600;margin-bottom:8px;color:#17171a;' }, "You're on the waitlist"));
      box.appendChild(
        el(
          'div',
          { style: 'font-size:14.5px;color:#777;margin-bottom:24px;line-height:1.5;' },
          "Thanks! We're at capacity on new recruiters right now, so our admin team will review your profile and reach out as soon as a spot opens up. Keep an eye on your email."
        )
      );
      if (state.recruiterVerified) {
        box.appendChild(
          el(
            'a',
            { href: RECRUITER_DASHBOARD_URL, className: 'next-btn', style: 'display:inline-block;text-decoration:none;' },
            'Go to dashboard'
          )
        );
      }
      if (!state.hasPassword && !state.pwSkipped && !state.pwSaved) {
        box.appendChild(buildSetPasswordPrompt());
      }
      if (state.pwSaved) {
        box.appendChild(
          el('div', { style: 'font-size:13px;color:#2a7a3b;margin-top:20px;' }, 'Password saved. You can log in with your email and password next time.')
        );
      }
      wrap.appendChild(box);
      return wrap;
    }

    function render() {
      const root = document.getElementById('root');
      root.innerHTML = '';
      root.appendChild(state.submitted ? buildSubmittedScreen() : buildPage());
      saveDraft();
    }

    window.addEventListener('pagehide', saveDraft);
    window.addEventListener('visibilitychange', saveDraft);

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === 'className') node.className = v;
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v !== undefined && v !== null) node.setAttribute(k, v);
      });
      (Array.isArray(children) ? children : [children]).forEach((c) => {
        if (c === null || c === undefined) return;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
      return node;
    }

    function canProceed(stepKey) {
      const d = state.data;
      if (stepKey === 'firm') {
        return d.firmName.trim().length > 0 && d.yearsExperience !== null && d.industries.length > 0 && d.phone.trim().length > 0;
      }
      if (stepKey === 'experience') {
        if (d.executivePlacements === null) return false;
        if (d.executivePlacements === true && !d.executiveLevel) return false;
        if (d.contingencyExperience === null) return false;
        if (d.contingencyExperience === false) return d.contingencyAck === true;
        return true;
      }
      if (stepKey === 'review') {
        return d.termsAccepted === true;
      }
      return true;
    }

    // Mirrors canProceed's checks in order, but returns the id of the
    // first unmet one instead of a plain bool -- used to scroll a user
    // straight to whatever they missed when they try to advance anyway.
    function firstInvalidFieldId(stepKey) {
      const d = state.data;
      if (stepKey === 'firm') {
        if (!(d.firmName.trim().length > 0)) return 'field-firm-name';
        if (d.yearsExperience === null) return 'field-years';
        if (!(d.industries.length > 0)) return 'field-industries';
        if (!(d.phone.trim().length > 0)) return 'field-phone';
        return null;
      }
      if (stepKey === 'experience') {
        if (d.executivePlacements === null) return 'field-exec-placements';
        if (d.executivePlacements === true && !d.executiveLevel) return 'field-exec-level';
        if (d.contingencyExperience === null) return 'field-contingency';
        if (d.contingencyExperience === false && d.contingencyAck !== true) return 'field-contingency-ack';
        return null;
      }
      if (stepKey === 'review') {
        if (d.termsAccepted !== true) return 'field-terms';
        return null;
      }
      return null;
    }

    // ---- Page 1: firm name, years experience, industries (tag input), phone ----
    function buildFirmStep() {
      const wrap = el('div');
      if (state.contactFirstName) {
        wrap.appendChild(el('div', { className: 'subtitle', style: 'margin-bottom:4px;' }, `Hi ${state.contactFirstName},`));
      }
      wrap.appendChild(el('h1', {}, 'Tell us about your firm'));
      wrap.appendChild(el('div', { className: 'subtitle' }, "This is how clients will get to know you before your first submission."));

      const firmLabel = el('div', { className: 'field-label' }, ['Search firm name', reqMark()]);
      const firmInput = el('input', { type: 'text', placeholder: 'e.g. Rivera Search Partners' });
      firmInput.value = state.data.firmName;
      firmInput.addEventListener('input', (e) => { state.data.firmName = e.target.value; });
      firmInput.addEventListener('blur', render);
      wrap.appendChild(fieldWrap('field-firm-name', state.data.firmName.trim().length > 0, 'Please fill this in.', [firmLabel, firmInput]));

      const yearsHeading = el('h2', {}, ['How long have you been recruiting?', reqMark()]);
      const yearsOptions = YEARS_OPTIONS.map((opt) =>
        el(
          'button',
          {
            className: 'option' + (state.data.yearsExperience === opt ? ' selected' : ''),
            type: 'button',
            onClick: () => {
              state.data.yearsExperience = opt;
              render();
            },
          },
          opt
        )
      );
      wrap.appendChild(fieldWrap('field-years', state.data.yearsExperience !== null, 'Please select one.', [yearsHeading, ...yearsOptions]));

      const industriesHeading = el('h2', {}, ['What industries do you recruit in the most?', reqMark()]);
      const industriesSubtitle = el('div', { className: 'subtitle', style: 'margin-bottom:10px;' }, 'Type an industry and press Enter to add it. One is enough to get started.');
      wrap.appendChild(fieldWrap('field-industries', state.data.industries.length > 0, 'Please add at least one industry.', [industriesHeading, industriesSubtitle, buildIndustryTagInput()]));

      const locationsHeading = el('h2', {}, 'Where have you made the most placements?');
      const locationsSubtitle = el('div', { className: 'subtitle', style: 'margin-bottom:10px;' }, "Cities, states, or regions -- this is how we tell where your network and relationships are strongest. Type one and press Enter to add it.");
      wrap.appendChild(el('div', {}, [locationsHeading, locationsSubtitle, buildLocationTagInput()]));

      const phoneLabel = el('div', { className: 'field-label' }, ['Phone number', reqMark()]);
      const phoneInput = el('input', { type: 'text', placeholder: 'e.g. (555) 123-4567' });
      phoneInput.value = state.data.phone;
      phoneInput.addEventListener('input', (e) => { state.data.phone = e.target.value; });
      wrap.appendChild(fieldWrap('field-phone', state.data.phone.trim().length > 0, 'Please fill this in.', [phoneLabel, phoneInput]));

      return wrap;
    }

    function buildIndustryTagInput() {
      const box = el('div', { className: 'tag-input-box' });

      state.data.industries.forEach((industry, i) => {
        const pill = el('span', { className: 'tag-pill' }, [
          document.createTextNode(industry),
          el(
            'button',
            {
              type: 'button',
              onClick: (e) => {
                e.stopPropagation();
                state.data.industries = state.data.industries.filter((_, idx) => idx !== i);
                render();
              },
            },
            '✕'
          ),
        ]);
        box.appendChild(pill);
      });

      const input = el('input', { type: 'text', placeholder: state.data.industries.length ? '' : 'e.g. Manufacturing' });
      input.value = state.industryDraft;
      input.addEventListener('input', (e) => { state.industryDraft = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = state.industryDraft.trim();
          if (val && !state.data.industries.includes(val)) {
            state.data.industries = [...state.data.industries, val];
          }
          state.industryDraft = '';
          render();
        } else if (e.key === 'Backspace' && !state.industryDraft && state.data.industries.length) {
          state.data.industries = state.data.industries.slice(0, -1);
          render();
        }
      });
      box.appendChild(input);
      box.addEventListener('click', () => input.focus());

      return box;
    }

    function buildLocationTagInput() {
      const box = el('div', { className: 'tag-input-box' });

      state.data.locations.forEach((location, i) => {
        const pill = el('span', { className: 'tag-pill' }, [
          document.createTextNode(location),
          el(
            'button',
            {
              type: 'button',
              onClick: (e) => {
                e.stopPropagation();
                state.data.locations = state.data.locations.filter((_, idx) => idx !== i);
                render();
              },
            },
            '✕'
          ),
        ]);
        box.appendChild(pill);
      });

      const input = el('input', { type: 'text', placeholder: state.data.locations.length ? '' : 'e.g. Austin, TX' });
      input.value = state.locationDraft;
      input.addEventListener('input', (e) => { state.locationDraft = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = state.locationDraft.trim();
          if (val && !state.data.locations.includes(val)) {
            state.data.locations = [...state.data.locations, val];
          }
          state.locationDraft = '';
          render();
        } else if (e.key === 'Backspace' && !state.locationDraft && state.data.locations.length) {
          state.data.locations = state.data.locations.slice(0, -1);
          render();
        }
      });
      box.appendChild(input);
      box.addEventListener('click', () => input.focus());

      return box;
    }

    // ---- Page 2: executive placements + contingency (same page) ----
    function buildExperienceStep() {
      const wrap = el('div');
      wrap.appendChild(el('h1', {}, 'Your placement experience'));

      const execHeading = el('h2', {}, ['Have you made an executive placement before?', reqMark()]);
      const execSubtitle = el(
        'div',
        { className: 'subtitle' },
        'This helps us match you to the right level of roles on the platform.'
      );
      const execOptions = ['Yes', 'No'].map((opt) => {
        const isSelected =
          state.data.executivePlacements === null
            ? false
            : (state.data.executivePlacements ? 'Yes' : 'No') === opt;
        return el(
          'button',
          {
            className: 'option' + (isSelected ? ' selected' : ''),
            type: 'button',
            onClick: () => {
              state.data.executivePlacements = opt === 'Yes';
              if (opt !== 'Yes') state.data.executiveLevel = null;
              render();
            },
          },
          opt
        );
      });
      wrap.appendChild(fieldWrap('field-exec-placements', state.data.executivePlacements !== null, 'Please select one.', [execHeading, execSubtitle, ...execOptions]));

      if (state.data.executivePlacements === true) {
        const levelHeading = el('h2', {}, ['Which executive level have you placed the most?', reqMark()]);
        const levelOptions = ['C-suite', 'VPs/SVPs', 'Directors/Heads/GM'].map((opt) =>
          el(
            'button',
            {
              className: 'option' + (state.data.executiveLevel === opt ? ' selected' : ''),
              type: 'button',
              onClick: () => {
                state.data.executiveLevel = opt;
                render();
              },
            },
            opt
          )
        );
        wrap.appendChild(fieldWrap('field-exec-level', !!state.data.executiveLevel, 'Please select one.', [levelHeading, ...levelOptions]));
      }

      const contingencyHeading = el('h2', {}, ['Have you done contingency hiring before?', reqMark()]);
      const contingencySubtitle = el(
        'div',
        { className: 'subtitle' },
        'Contingency means you\u2019re only paid if your candidate gets placed. No retainer, no guarantee.'
      );
      const contingencyOptions = ['Yes', 'No'].map((opt) => {
        const isSelected =
          state.data.contingencyExperience === null
            ? false
            : (state.data.contingencyExperience ? 'Yes' : 'No') === opt;
        return el(
          'button',
          {
            className: 'option' + (isSelected ? ' selected' : ''),
            type: 'button',
            onClick: () => {
              state.data.contingencyExperience = opt === 'Yes';
              if (opt === 'Yes') state.data.contingencyAck = true;
              else state.data.contingencyAck = false;
              render();
            },
          },
          opt
        );
      });
      wrap.appendChild(fieldWrap('field-contingency', state.data.contingencyExperience !== null, 'Please select one.', [contingencyHeading, contingencySubtitle, ...contingencyOptions]));

      if (state.data.contingencyExperience === false) {
        const explainer = el('div', { className: 'explainer' }, [
          el('div', {}, [
            el('b', {}, 'How contingency hiring works here: '),
            document.createTextNode(
              'You only get paid when a candidate you submit is hired for the role. There\u2019s no upfront fee and no guaranteed payout. You\u2019re competing with other recruiters working the same role, and only a successful placement earns a fee.'
            ),
          ]),
        ]);

        const ackLabel = el('label', { className: 'ack', style: 'margin-bottom:0;' });
        const checkbox = el('input', { type: 'checkbox' });
        checkbox.checked = state.data.contingencyAck;
        checkbox.addEventListener('change', (e) => {
          state.data.contingencyAck = e.target.checked;
          render();
        });
        ackLabel.appendChild(checkbox);
        ackLabel.appendChild(document.createTextNode('I understand and want to proceed on this basis.' ));
        ackLabel.appendChild(reqMark());
        wrap.appendChild(fieldWrap('field-contingency-ack', state.data.contingencyAck === true, 'You must check this box to continue.', [explainer, ackLabel]));
      }

      return wrap;
    }

    function buildReviewStep() {
      const d = state.data;
      const wrap = el('div');
      wrap.appendChild(el('h1', {}, 'Review your profile'));

      const rows = [
        ['Search firm', d.firmName],
        ['Years of experience', d.yearsExperience],
        ['Industries', d.industries.join(', ')],
        ['Locations', d.locations.length ? d.locations.join(', ') : 'N/A'],
        ['Phone', d.phone || 'N/A'],
        ['Executive placements', d.executivePlacements ? 'Yes' : 'No'],
      ];

      if (d.executivePlacements) {
        rows.push(['Most placed level', d.executiveLevel || 'N/A']);
      }

      rows.push(['Contingency hiring', d.contingencyExperience ? 'Has done it before' : 'New to contingency, acknowledged terms']);

      rows.forEach(([label, value]) => {
        wrap.appendChild(
          el('div', { className: 'review-row' }, [
            el('div', { className: 'review-label' }, label),
            el('div', { className: 'review-value' }, value),
          ])
        );
      });

      const consentLabel = el(
        'label',
        { style: 'display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#444;cursor:pointer;margin-top:24px;padding-top:18px;border-top:1px solid #eee;' },
        [
          el('input', {
            type: 'checkbox',
            style: 'margin-top:2px;flex-shrink:0;',
            checked: d.termsAccepted ? 'checked' : undefined,
            onChange: (e) => {
              state.data.termsAccepted = e.target.checked;
              render();
            },
          }),
          el('span', {}, [
            'By agreeing, you acknowledge that you have read and understood, and agree to makeplacement’s ',
            el('a', { href: 'terms.html', target: '_blank', rel: 'noreferrer', style: 'text-decoration:underline;color:inherit;' }, 'Terms of Use'),
            ', ',
            el('a', { href: 'privacy.html', target: '_blank', rel: 'noreferrer', style: 'text-decoration:underline;color:inherit;' }, 'Privacy Policy'),
            ', and ',
            el('a', { href: 'recruiting-agreement.html', target: '_blank', rel: 'noreferrer', style: 'text-decoration:underline;color:inherit;' }, 'Recruiting Agreement'),
            '.',
          ]),
        ]
      );
      wrap.appendChild(fieldWrap('field-terms', d.termsAccepted === true, 'You must agree to continue.', [consentLabel]));

      if (state.submitError) {
        wrap.appendChild(el('div', { style: 'color:#b42318;font-size:13px;margin-top:16px;' }, state.submitError));
      }

      return wrap;
    }

    function buildStepContent() {
      const key = steps[state.stepIndex];
      if (key === 'firm') return buildFirmStep();
      if (key === 'experience') return buildExperienceStep();
      return buildReviewStep();
    }

    async function submitProfile() {
      state.submitting = true;
      state.submitError = '';
      render();
      try {
        const { error } = await supabaseClient
          .from('recruiters')
          .update({
            firm_name: state.data.firmName,
            years_experience: state.data.yearsExperience,
            industries: state.data.industries,
            locations: state.data.locations,
            phone: state.data.phone || null,
            executive_placements: state.data.executivePlacements,
            executive_level: state.data.executivePlacements ? state.data.executiveLevel : null,
            contingency_experience: state.data.contingencyExperience,
            contingency_ack: state.data.contingencyAck,
            terms_accepted_at: new Date().toISOString(),
          })
          .eq('id', state.recruiterId);
        if (error) throw new Error(error.message);
        state.submitting = false;
        state.submitted = true;
        localStorage.removeItem(draftKey());
        render();
      } catch (err) {
        state.submitting = false;
        state.submitError = err.message || 'Something went wrong saving your profile.';
        render();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = LOGIN_URL;
    }

    function buildTopBar() {
      const bar = el('div', { className: 'topbar' });
      bar.appendChild(el('a', { href: LOGIN_URL }, 'makeplacement'));
      bar.appendChild(el('button', { type: 'button', onClick: handleLogout }, 'Log out'));
      return bar;
    }

    function buildPage() {
      const key = steps[state.stepIndex];
      const isLast = state.stepIndex === steps.length - 1;
      const pct = ((state.stepIndex + 1) / steps.length) * 100;

      const wrap = el('div', { className: 'wrap' });

      wrap.appendChild(buildTopBar());

      const progress = el('div', { className: 'progress' });
      progress.appendChild(el('div', { className: 'progress-fill', style: `width:${pct}%` }));
      wrap.appendChild(progress);

      const content = el('div', { className: 'content' });
      if (state.draftRestored) {
        content.appendChild(
          el('div', { style: 'font-size:13px;color:#555;background:#f7f7f5;border:1px solid #eee;border-radius:8px;padding:10px 14px;margin-bottom:20px;' }, 'Picking up where you left off.')
        );
      }
      content.appendChild(el('div', { className: 'step-count' }, `${state.stepIndex + 1}/${steps.length}`));
      content.appendChild(buildStepContent());
      wrap.appendChild(content);

      const footer = el('footer');
      const footerInner = el('div', { className: 'footer-inner' });

      const backBtn = el(
        'button',
        {
          className: 'back-link' + (state.stepIndex === 0 ? ' disabled' : ''),
          type: 'button',
          onClick: () => {
            if (state.stepIndex > 0) {
              state.stepIndex -= 1;
              state.attemptedNext = false;
              render();
            }
          },
        },
        'Back'
      );
      footerInner.appendChild(backBtn);

      // Clicking Next/Finish while something's missing doesn't just sit
      // there disabled -- it scrolls straight to the first thing that
      // needs attention and explains why, rather than leaving the user to
      // hunt for it themselves.
      function scrollToFirstInvalid(stepKey) {
        const targetId = firstInvalidFieldId(stepKey);
        if (!targetId) return;
        const targetEl = document.getElementById(targetId);
        if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      if (!isLast) {
        const nextBtn = el(
          'button',
          {
            className: 'next-btn',
            type: 'button',
            onClick: () => {
              if (canProceed(key)) {
                state.stepIndex += 1;
                state.attemptedNext = false;
                render();
                return;
              }
              state.attemptedNext = true;
              render();
              scrollToFirstInvalid(key);
            },
          },
          'Next'
        );
        if (!canProceed(key)) {
          nextBtn.style.background = '#e5e5e5';
          nextBtn.style.color = '#aaa';
        }
        footerInner.appendChild(nextBtn);
      } else {
        const submitBtn = el(
          'button',
          {
            className: 'next-btn',
            type: 'button',
            onClick: () => {
              if (state.submitting) return;
              if (canProceed('review')) {
                submitProfile();
                return;
              }
              state.attemptedNext = true;
              render();
              scrollToFirstInvalid('review');
            },
          },
          state.submitting ? 'Saving…' : 'Finish'
        );
        if (!canProceed('review')) {
          submitBtn.style.background = '#e5e5e5';
          submitBtn.style.color = '#aaa';
        }
        footerInner.appendChild(submitBtn);
      }

      footer.appendChild(footerInner);
      wrap.appendChild(footer);

      return wrap;
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = LOGIN_URL;
        return;
      }
      state.session = session;
      state.hasPassword = !!(session.user.user_metadata && session.user.user_metadata.password_set);

      const lookupRecruiter = () =>
        supabaseClient
          .from('recruiters')
          .select('id, verified, years_experience, contact_first_name')
          .eq('auth_user_id', session.user.id)
          .maybeSingle();

      let { data: recruiter, error } = await lookupRecruiter();

      // A freshly-loaded session can occasionally not have its auth token
      // fully attached to outgoing requests yet, making this come back
      // empty even though the row genuinely exists. A single 700ms retry
      // wasn't always enough margin, so this backs off across a few tries
      // before concluding anything's actually wrong.
      for (const delay of [600, 1200, 1800]) {
        if (error || recruiter) break;
        await new Promise((resolve) => setTimeout(resolve, delay));
        ({ data: recruiter, error } = await lookupRecruiter());
      }

      // No row yet (and no real fetch error) but this session was created
      // via the recruiter magic link (its metadata still carries
      // pending_signup) -- the row that index.html's completeSignup()
      // normally creates before redirecting here just hasn't landed, for
      // any reason (that redirect never ran, a transient insert failure,
      // etc). Rather than strand the user on an error screen, create it
      // here so onboarding can proceed -- same behavior onboarding.html
      // already has for companies.
      const metaPending = session.user.user_metadata && session.user.user_metadata.pending_signup;
      if (!error && !recruiter && metaPending && metaPending.type === 'search_firm') {
        const base = (metaPending.firstName || 'recruiter').toLowerCase().replace(/[^a-z0-9]/g, '') || 'recruiter';
        const referralCode = `${base}-${Math.random().toString(36).slice(2, 6)}`;
        const { error: insertErr } = await supabaseClient.from('recruiters').insert([{
          auth_user_id: session.user.id,
          contact_first_name: metaPending.firstName,
          last_name: metaPending.lastName,
          email: metaPending.email,
          referral_code: referralCode,
          referred_by_code: metaPending.referredByCode || null,
        }]);
        if (!insertErr || insertErr.code === '23505') {
          ({ data: recruiter, error } = await lookupRecruiter());
        }
      }

      if (error || !recruiter) {
        document.getElementById('root').innerHTML =
          '<div class="center-msg">We\'re having trouble loading your profile. Please refresh the page. If this keeps happening, log out and log back in.</div>';
        return;
      }

      state.recruiterId = recruiter.id;
      state.recruiterVerified = recruiter.verified;
      state.contactFirstName =
        recruiter.contact_first_name ||
        (session.user.user_metadata && session.user.user_metadata.pending_signup && session.user.user_metadata.pending_signup.firstName) ||
        '';

      // Already completed this wizard before (years_experience is only
      // set once it's submitted) -- nothing left to do here. A verified
      // recruiter has no reason to be on this page; an unverified one
      // should see the same pending screen they saw right after
      // submitting, not be made to redo the whole wizard on a reload.
      if (recruiter.years_experience) {
        if (recruiter.verified) {
          window.location.replace(RECRUITER_DASHBOARD_URL);
          return;
        }
        state.submitted = true;
        render();
        return;
      }

      const savedDraft = localStorage.getItem(draftKey());
      if (savedDraft) {
        try {
          const parsed = JSON.parse(savedDraft);
          if (parsed && parsed.data && hasMeaningfulDraft(parsed.data, parsed.stepIndex || 0)) {
            state.data = { ...state.data, ...parsed.data };
            state.stepIndex = parsed.stepIndex || 0;
            state.draftRestored = true;
          }
        } catch (err) {
          // corrupt draft -- ignore, start fresh
        }
      }

      render();
    }

    init();
  </script>
</body>
</html>
