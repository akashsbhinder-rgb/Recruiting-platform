<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your interest | MakePlacement</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="site.webmanifest">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #ffffff;
    --fg: #17171a;
    --muted: #6b7075;
    --faint: #9a9ea3;
    --border: #e4e4e8;
    --link: #4b6bfb;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    max-width: 420px;
    text-align: center;
  }

  .logomark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }

  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }

  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 8px;
  }

  .icon { font-size: 34px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="card" id="content">
  <div class="logomark">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="14" y2="17" />
    </svg>
  </div>
  <div class="icon">…</div>
  <h1>Confirming…</h1>
  <p>One moment.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://cnayvrtkxgqpejhrlakm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT";

  const content = document.getElementById("content");

  function render(icon, title, body) {
    content.innerHTML = `
      <div class="logomark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="14" y2="17" />
        </svg>
      </div>
      <div class="icon">${icon}</div>
      <h1>${title}</h1>
      <p>${body}</p>
    `;
  }

  const token = new URLSearchParams(window.location.search).get("token");

  if (!token) {
    render("⚠️", "Missing confirmation link", "This link looks incomplete. Please use the exact link from your email.");
  } else {
    fetch(`${SUPABASE_URL}/functions/v1/confirm-candidate`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ token }),
    })
      .then((res) => res.json())
      .then((body) => {
        if (!body.ok) {
          render("⚠️", "Something went wrong", body.error || "Please try again or contact the recruiter who submitted you.");
          return;
        }
        if (body.alreadyConfirmed) {
          render("✅", "Already confirmed", `You've already confirmed your interest in the ${body.roleName} role at ${body.companyName}.`);
          return;
        }
        render("✅", "You're confirmed!", `Thanks for confirming — ${body.companyName} can now review you for the ${body.roleName} role.`);
      })
      .catch(() => {
        render("⚠️", "Something went wrong", "Please try again in a moment, or contact the recruiter who submitted you.");
      });
  }
</script>

</body>
</html>
