  <script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ---------- Supabase config ----------
const SUPABASE_URL = "https://cnayvrtkxgqpejhrlakm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOGIN_URL = "index.html";

// Every insert below runs through supabaseClient, which automatically
// attaches the signed-in user's access token -- this is what makes the
// RLS policies (auth.uid() = ...) recognize who's writing the data.
async function sbInsertRows(table, rows, opts = {}) {
  if (Array.isArray(rows) && rows.length === 0) return [];
  const query = supabaseClient.from(table).insert(rows);
  const { data, error } = opts.returnRep ? await query.select() : await query;
  if (error) throw new Error(`Failed writing to ${table}: ${error.message}`);
  return opts.returnRep ? data : null;
}

// Looks up the company row already created on the landing page for this
// signed-in user, instead of creating a new one on every role posted.
async function getMyCompany(session) {
  const { data, error } = await supabaseClient
    .from("companies")
    .select("*")
    .eq("auth_user_id", session.user.id)
    .maybeSingle();

  if (error) throw new Error(`Failed loading company: ${error.message}`);
  if (data) return data;

  // Fallback: shouldn't normally happen since the landing page creates
  // this row, but keeps onboarding usable if someone lands here directly.
  const [created] = await sbInsertRows(
    "companies",
    [{ auth_user_id: session.user.id, name: "Unnamed company" }],
    { returnRep: true }
  );
  return created;
}

async function submitRoleToSupabase(data, session) {
  const company = await getMyCompany(session);

  // Company name is collected here on page one, not at signup -- keep
  // the companies row in sync with whatever they entered.
  const { error: nameErr } = await supabaseClient
    .from("companies")
    .update({ name: data.companyName })
    .eq("id", company.id);
  if (nameErr) throw new Error(`Failed saving company name: ${nameErr.message}`);

  const [role] = await sbInsertRows(
    "roles",
    [
      {
        company_id: company.id,
        name: data.roleName,
        description: data.roleDescription,
        min_salary: Number(data.minSalary),
        max_salary: Number(data.maxSalary),
        hiring_goals: data.hiringGoals || null,
        recruiting_advice: data.recruitingAdvice,
        hm_intro: data.hmIntro,
        welcome_message: data.welcomeMessage || null,
        status: "live",
      },
    ],
    { returnRep: true }
  );

  await Promise.all([
    sbInsertRows(
      "role_stages",
      data.stages.filter(isFilled).map((name, i) => ({ role_id: role.id, name, position: i }))
    ),
    sbInsertRows(
      "role_qualities",
      data.idealQualities.filter(isFilled).map((quality) => ({ role_id: role.id, quality }))
    ),
    sbInsertRows(
      "role_candidate_references",
      data.idealCandidates
        .filter((c) => isFilled(c.note) || isFilled(c.linkedin))
        .map((c) => ({ role_id: role.id, note: c.note || null, linkedin: c.linkedin || null }))
    ),
    sbInsertRows(
      "role_traits_to_avoid",
      data.traitsToAvoid.filter(isFilled).map((trait) => ({ role_id: role.id, trait }))
    ),
    sbInsertRows(
      "role_questions",
      data.questions.filter(isFilled).map((question) => ({ role_id: role.id, question }))
    ),
  ]);

  return { company, role };
}

const inputStyle = {

function TextInput(props) {

}
function TextArea(props) {
  return (
    <textarea
      {...props}
      style={{ ...inputStyle, minHeight: 120, resize: "vertical", ...props.style }}

}

    <div>
      {suggestions && (
        <button
          type="button"
          onClick={() => setShowSug((s) => !s)}
          style={{
            display: "inline-flex",
            alignItems: "center",
            gap: 6,
            fontSize: 13,
            fontWeight: 500,
            padding: "7px 12px",
            borderRadius: 7,
            border: "1px solid #111",
            background: "#fff",
            cursor: "pointer",
            marginBottom: 12,
          }}
        >
          Suggestions ✨
        </button>
      )}
      {showSug && (
        <div
          style={{
            fontSize: 13,
            color: "#555",
            background: "#f7f7f5",
            border: "1px solid #eee",
            borderRadius: 8,
            padding: 12,
            marginBottom: 10,
          }}
        >
          {suggestions.map((s, i) => (
            <div
              key={i}
              onClick={() => {
                onChange(value ? value + "\n" + s : s);
                setShowSug(false);
              }}
              style={{ cursor: "pointer", padding: "4px 0" }}
            >
              + {s}
            </div>
          ))}
        </div>
      )}
      <div
        style={{
          border: "1px solid #ddd",
          borderRadius: 8,
          overflow: "hidden",
          background: "#fff",
        }}
      >
        <div
          style={{
            display: "flex",
            gap: 14,
            padding: "9px 14px",
            borderBottom: "1px solid #eee",
            background: "#fafaf9",
            color: "#9a9a9a",
            fontSize: 13,
            fontFamily: "serif",
          }}
        >
          <b>B</b>
          <i>I</i>
          <u>U</u>
          <span>⛓</span>
          <span>≣</span>
          <span>≡</span>
        </div>
        <textarea
          value={value}
          onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder}
          style={{
            width: "100%",
            boxSizing: "border-box",
            minHeight: 150,
            padding: 14,
            border: "none",
            outline: "none",
            fontSize: 14,
            resize: "vertical",

}

function StringList({ items, onChange, placeholder, addLabel }) {
  const set = (i, v) => {
    const next = [...items];
    next[i] = v;
    onChange(next);
  };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const add = () => onChange([...items, ""]);
  return (
    <div>
      {items.map((val, i) => (
        <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <TextInput
            value={val}
            placeholder={placeholder}
            onChange={(e) => set(i, e.target.value)}
          />
          {items.length > 1 && (
            <button type="button" onClick={() => remove(i)} style={removeBtnStyle}>
              ✕
            </button>
          )}
        </div>
      ))}
      <button type="button" onClick={add} style={addBtnStyle}>
        + {addLabel}
      </button>
    </div>
  );
}

const removeBtnStyle = {
  border: "1px solid #eee",
  background: "#fff",
  color: "#999",
  borderRadius: 8,
  width: 40,
  cursor: "pointer",
  fontSize: 13,
};
const addBtnStyle = {
  fontSize: 13,
  fontWeight: 500,
  color: "#111",
  background: "none",
  border: "1px dashed #ccc",
  borderRadius: 8,
  padding: "8px 14px",
  cursor: "pointer",
};

function CandidateList({ items, onChange }) {
  const set = (i, patch) => {
    const next = [...items];
    next[i] = { ...next[i], ...patch };
    onChange(next);
  };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const add = () => onChange([...items, emptyCandidate()]);
  return (
    <div>
      {items.map((c, i) => (
        <div
          key={c.id}
          style={{ border: "1px solid #eee", borderRadius: 10, padding: 12, marginBottom: 10 }}
        >
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <TextInput
              value={c.note}
              placeholder="Why is this person a fit? e.g. Analyst at a top VC fund"
              onChange={(e) => set(i, { note: e.target.value })}
            />
            {items.length > 1 && (
              <button type="button" onClick={() => remove(i)} style={removeBtnStyle}>
                ✕
              </button>
            )}
          </div>
          <TextInput
            value={c.linkedin}
            placeholder="linkedin.com/in/..."
            onChange={(e) => set(i, { linkedin: e.target.value })}
          />
        </div>
      ))}
      <button type="button" onClick={add} style={addBtnStyle}>
        + Add a profile to reference
      </button>
    </div>
  );
}

function StageList({ items, onChange }) {
  const set = (i, v) => {
    const next = [...items];
    next[i] = v;
    onChange(next);
  };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const add = () => onChange([...items, ""]);
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    const next = [...items];
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  };
  return (
    <div>
      {items.map((val, i) => (
        <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
          <span style={{ fontSize: 13, color: "#aaa", width: 18 }}>{i + 1}</span>
          <TextInput
            value={val}
            placeholder="e.g. Onsite interview"
            onChange={(e) => set(i, e.target.value)}
          />
          <button type="button" onClick={() => move(i, -1)} style={removeBtnStyle}>
            ↑
          </button>
          <button type="button" onClick={() => move(i, 1)} style={removeBtnStyle}>
            ↓
          </button>
          {items.length > 1 && (
            <button type="button" onClick={() => remove(i)} style={removeBtnStyle}>
              ✕
            </button>
          )}
        </div>
      ))}
      <button type="button" onClick={add} style={addBtnStyle}>
        + Add stage
      </button>
    </div>
  );
}

const steps = [
  { key: "basics", title: "Let's start with the basics", subtitle: "Basic information about this role we need to get started" },
  { key: "candidates", title: "Ideal candidates", subtitle: "Tell recruiters exactly who to look for" },
  { key: "recruiter", title: "Helping the recruiter", subtitle: "Give recruiters the context they need to represent this role well" },
  { key: "questions", title: "Candidate questions", subtitle: "Optional — key things you want recruiters to ask before submitting a candidate" },
  { key: "review", title: "Recruiter dashboard preview", subtitle: "This is what recruiters will see for this role" },
];

function isFilled(v) {
  return typeof v === "string" && v.trim().length > 0;
}
function countFilled(list) {
  return list.filter(isFilled).length;
}
function anyFilled(list) {
  return countFilled(list) > 0;
}

function validateStep(key, data) {
  switch (key) {
    case "basics":
      return (
        isFilled(data.companyName) &&
        isFilled(data.roleName) &&
        isFilled(data.roleDescription) &&
        isFilled(data.minSalary) &&
        isFilled(data.maxSalary) &&
        anyFilled(data.stages)
      );
    case "candidates":
      return countFilled(data.idealQualities) >= 3;
    case "recruiter":
      return isFilled(data.recruitingAdvice) && isFilled(data.hmIntro);
    default:
      return true;
  }
}

function ReviewSection({ label, children }) {

}

  const money = (v) => (v ? `$${Number(v).toLocaleString()}` : "—");

    <div>
      <div style={{ border: "1px solid #eee", borderRadius: 12, padding: 24, background: "#fafaf9" }}>
        <div style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>
          {data.roleName || "Untitled role"}
        </div>
        <div style={{ fontSize: 14, color: "#777", marginBottom: 20 }}>
          {money(data.minSalary)} – {money(data.maxSalary)}
          {data.hiringGoals ? ` · Target: ${data.hiringGoals}` : ""}

        <ReviewSection label="Role description">
          <div style={{ fontSize: 14, whiteSpace: "pre-wrap", color: "#333" }}>
            {data.roleDescription || "—"}
          </div>
        </ReviewSection>

        <ReviewSection label="Ideal candidate qualities">
          <ul style={{ margin: 0, paddingLeft: 18, fontSize: 14, color: "#333" }}>
            {data.idealQualities.filter(isFilled).map((q, i) => (
              <li key={i}>{q}</li>
            ))}
          </ul>
        </ReviewSection>

        {data.idealCandidates.some((c) => isFilled(c.note) || isFilled(c.linkedin)) && (
          <ReviewSection label="Profiles referenced">
            {data.idealCandidates
              .filter((c) => isFilled(c.note) || isFilled(c.linkedin))
              .map((c) => (
                <div key={c.id} style={{ fontSize: 14, marginBottom: 6 }}>
                  <div style={{ color: "#333" }}>{c.note}</div>
                  {c.linkedin && <div style={{ color: "#777", fontSize: 13 }}>{c.linkedin}</div>}
                </div>
              ))}
          </ReviewSection>
        )}

        {anyFilled(data.traitsToAvoid) && (
          <ReviewSection label="Traits to avoid">
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 14, color: "#333" }}>
              {data.traitsToAvoid.filter(isFilled).map((t, i) => (
                <li key={i}>{t}</li>
              ))}
            </ul>
          </ReviewSection>
        )}

        <ReviewSection label="Interview stages">
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {data.stages.filter(isFilled).map((s, i) => (
              <span
                key={i}
                style={{
                  fontSize: 13,
                  padding: "6px 12px",
                  borderRadius: 20,
                  background: "#fff",
                  border: "1px solid #ddd",
                }}
              >
                {i + 1}. {s}
              </span>
            ))}
          </div>
        </ReviewSection>

        {anyFilled(data.questions) && (
          <ReviewSection label="Candidate questions">
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 14, color: "#333" }}>
              {data.questions.filter(isFilled).map((q, i) => (
                <li key={i}>{q}</li>
              ))}
            </ul>
          </ReviewSection>
        )}

        {(isFilled(data.recruitingAdvice) || isFilled(data.hmIntro) || isFilled(data.welcomeMessage)) && (
          <ReviewSection label="Notes for recruiters">
            {isFilled(data.recruitingAdvice) && (
              <div style={{ fontSize: 14, marginBottom: 10 }}>
                <b style={{ fontWeight: 600 }}>Recruiting advice:</b> {data.recruitingAdvice}
              </div>
            )}
            {isFilled(data.hmIntro) && (
              <div style={{ fontSize: 14, marginBottom: 10 }}>
                <b style={{ fontWeight: 600 }}>Hiring manager intro:</b> {data.hmIntro}
              </div>
            )}
            {isFilled(data.welcomeMessage) && (
              <div style={{ fontSize: 14 }}>
                <b style={{ fontWeight: 600 }}>Welcome message:</b> {data.welcomeMessage}
              </div>
            )}
          </ReviewSection>
        )}
      </div>

      <div style={{ display: "flex", gap: 16, marginTop: 16, flexWrap: "wrap" }}>
        {["basics", "candidates", "recruiter", "questions"].map((k) => (
          <button
            key={k}
            onClick={() => goTo(k)}
            style={{
              fontSize: 13,
              color: "#111",
              background: "none",
              border: "none",
              textDecoration: "underline",
              cursor: "pointer",
              padding: 0,
            }}
          >
            Edit {steps.find((s) => s.key === k).title.toLowerCase()}
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------- main ----------
function EmployerOnboarding() {
  const [data, setData] = useState(initialData);
  const [stepIndex, setStepIndex] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");

  // undefined = still checking, null = no session, object = signed in
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) {
        window.location.href = LOGIN_URL;
        return;
      }
      setSession(session);

      const { data: existingCompany } = await supabaseClient
        .from("companies")
        .select("name")
        .eq("auth_user_id", session.user.id)
        .maybeSingle();

      if (existingCompany && existingCompany.name) {
        set({ companyName: existingCompany.name });
      }
    });
  }, []);

  const handleSubmitRole = async () => {
    setSubmitting(true);
    setSubmitError("");
    try {
      await submitRoleToSupabase(data, session);
      setSubmitted(true);
    } catch (err) {
      setSubmitError(err.message || "Something went wrong submitting this role.");
    } finally {
      setSubmitting(false);
    }
  };

  const step = steps[stepIndex];
  const set = (patch) => setData((d) => ({ ...d, ...patch }));
  const goTo = (key) => setStepIndex(steps.findIndex((s) => s.key === key));

  const canNext = validateStep(step.key, data);
  const isLast = stepIndex === steps.length - 1;

  if (session === undefined) {
    return (
      <div style={pageWrap}>
        <TopBar />
        <div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: "#777" }}>
          Checking your account…
        </div>
      </div>
    );
  }

  if (submitted) {
    return (
      <div style={pageWrap}>
        <TopBar />
        <div style={{ maxWidth: 520, margin: "120px auto", textAlign: "center" }}>
          <div style={{ fontSize: 22, fontWeight: 600, marginBottom: 8 }}>Role submitted</div>
          <div style={{ fontSize: 14, color: "#777", marginBottom: 20 }}>
            {data.roleName || "This role"} is now live for recruiters to view.
          </div>
          <button
            onClick={() => setSubmitted(false)}
            style={{ ...nextBtnStyle, background: "#fff", color: "#111", border: "1px solid #111" }}
          >
            Back to review
          </button>
          <a
            href="dashboard.html"
            style={{
              ...nextBtnStyle,
              display: "inline-block",
              marginLeft: 10,
              textDecoration: "none",
            }}
          >
            Go to dashboard
          </a>
        </div>
      </div>
    );
  }

  return (
    <div style={pageWrap}>
      <TopBar />
      <div style={{ height: 3, background: "#eee" }}>
        <div
          style={{
            height: "100%",
            background: "#111",
            width: `${((stepIndex + 1) / steps.length) * 100}%`,
            transition: "width .2s",
          }}
        />
      </div>

      <div style={{ maxWidth: 620, margin: "0 auto", padding: "48px 24px 120px" }}>
        <div style={{ fontSize: 13, color: "#9a9a9a", marginBottom: 8 }}>
          {stepIndex + 1}/{steps.length}
        </div>
        <div style={{ fontSize: 24, fontWeight: 600, marginBottom: 6 }}>{step.title}</div>
        <div style={{ fontSize: 14.5, color: "#777", marginBottom: 32 }}>{step.subtitle}</div>

        {step.key === "basics" && (
          <>
            <Field label="Company name" required>
              <TextInput
                value={data.companyName}
                placeholder="e.g. Acme Inc."
                onChange={(e) => set({ companyName: e.target.value })}
              />
            </Field>
            <Field label="Role name" required>
              <TextInput
                value={data.roleName}
                placeholder="e.g. Software Engineer"
                onChange={(e) => set({ roleName: e.target.value })}
              />
            </Field>
            <Field label="Role description" required hint="A short overview of the role and what it entails">
              <RichBox
                value={data.roleDescription}
                onChange={(v) => set({ roleDescription: v })}
                placeholder="Our mission, who we're looking for, why this role matters..."
                suggestions={[
                  "Our Mission",
                  "Who we are looking for",
                  "Our Value Proposition to You",
                  "You Might Be A Great Fit If...",
                ]}
              />
            </Field>
            <div style={{ display: "flex", gap: 16 }}>
              <div style={{ flex: 1 }}>
                <Field label="Minimum salary" required hint="Must be a number, eg. 90000">
                  <TextInput
                    type="number"
                    value={data.minSalary}
                    placeholder="Ex. 90000"
                    onChange={(e) => set({ minSalary: e.target.value })}
                  />
                </Field>
              </div>
              <div style={{ flex: 1 }}>
                <Field label="Maximum salary" required hint="Must be a number, eg. 130000">
                  <TextInput
                    type="number"
                    value={data.maxSalary}
                    placeholder="Ex. 130000"
                    onChange={(e) => set({ maxSalary: e.target.value })}
                  />
                </Field>
              </div>
            </div>
            <Field
              label="Interview stages"
              required
              hint="List your stages in order, e.g. Recruiter screen, Hiring manager call, Onsite, Offer"
            >
              <StageList items={data.stages} onChange={(v) => set({ stages: v })} />
            </Field>
            <Field label="Hiring goals" hint="When do you want to have this role filled by?">
              <TextInput
                value={data.hiringGoals}
                placeholder="Ex. Within 2 weeks"
                onChange={(e) => set({ hiringGoals: e.target.value })}
              />
            </Field>
          </>
        )}

        {step.key === "candidates" && (
          <>
            <Field
              label="Ideal candidate qualities"
              required
              hint="Requires at least 3. Be as specific as possible — this is only visible to recruiters, so feel free to be fully transparent about your bar."
            >
              <StringList
                items={data.idealQualities}
                onChange={(v) => set({ idealQualities: v })}
                placeholder="e.g. 3-4 years experience at a top startup"
                addLabel="Add quality"
              />
            </Field>
            <Field
              label="Profiles you might reference"
              hint="Optional — examples of people who'd be a great fit, with LinkedIn and why"
            >
              <CandidateList items={data.idealCandidates} onChange={(v) => set({ idealCandidates: v })} />
            </Field>
            <Field label="Traits to avoid" hint="Optional, but the more descriptive, the better we can filter candidates">
              <StringList
                items={data.traitsToAvoid}
                onChange={(v) => set({ traitsToAvoid: v })}
                placeholder="e.g. Job hoppers with 5+ jobs in 3 years"
                addLabel="Add trait to avoid"
              />
            </Field>
          </>
        )}

        {step.key === "recruiter" && (
          <>
            <Field
              label="Recruiting advice"
              required
              hint="How to pitch this role, archetypes to look for, how often you'll be in touch"
            >
              <TextArea
                value={data.recruitingAdvice}
                onChange={(e) => set({ recruitingAdvice: e.target.value })}
                placeholder="What should recruiters know before they start sourcing?"
              />
            </Field>
            <Field label="Hiring manager introduction" required hint="A short, personal intro to you and your team">
              <TextArea
                value={data.hmIntro}
                onChange={(e) => set({ hmIntro: e.target.value })}
                placeholder="Tell recruiters a bit about yourself and your team"
              />
            </Field>
            <Field label="Welcome message template" hint="Sent to recruiters when they're approved for this role">
              <RichBox
                value={data.welcomeMessage}
                onChange={(v) => set({ welcomeMessage: v })}
                placeholder="Welcome! We're excited to have you recruiting for..."
                suggestions={[
                  "Welcome! We're excited to have you working on this role.",
                  "Thanks for joining — here's what success looks like for us.",
                ]}
              />
            </Field>
          </>
        )}

        {step.key === "questions" && (
          <Field label="Candidate questions" hint="Optional — keep it under 5 questions to streamline recruiter outreach">
            <StringList
              items={data.questions}
              onChange={(v) => set({ questions: v })}
              placeholder="e.g. Do you have security clearance?"
              addLabel="Add question"
            />
          </Field>
        )}

        {step.key === "review" && <Review data={data} goTo={goTo} />}
      </div>

      <div style={footerStyle}>
        <div style={{ maxWidth: 620, margin: "0 auto", display: "flex", justifyContent: "space-between" }}>
          <button
            onClick={() => (stepIndex > 0 ? setStepIndex(stepIndex - 1) : null)}
            style={{
              background: "none",
              border: "none",
              fontSize: 14,
              color: stepIndex === 0 ? "#ccc" : "#111",
              cursor: stepIndex === 0 ? "default" : "pointer",
              textDecoration: "underline",
            }}
          >
            Back
          </button>
          {!isLast ? (
            <button
              onClick={() => canNext && setStepIndex(stepIndex + 1)}
              disabled={!canNext}
              style={{
                ...nextBtnStyle,
                background: canNext ? "#111" : "#e5e5e5",
                color: canNext ? "#fff" : "#aaa",
                cursor: canNext ? "pointer" : "default",
              }}
            >
              Next
            </button>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              {submitError && (
                <div style={{ color: "#b42318", fontSize: 13, maxWidth: 320 }}>
                  {submitError}
                </div>
              )}
              <button
                onClick={handleSubmitRole}
                disabled={submitting}
                style={{
                  ...nextBtnStyle,
                  opacity: submitting ? 0.65 : 1,
                  cursor: submitting ? "wait" : "pointer",
                }}
              >
                {submitting ? "Submitting…" : "Submit role"}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const pageWrap = {
  minHeight: "100vh",
  background: "#fff",
  fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  color: "#111",
};

const footerStyle = {
  position: "sticky",
  bottom: 0,
  background: "#fff",
  borderTop: "1px solid #eee",
  padding: "18px 24px",
};

const nextBtnStyle = {
  background: "#111",
  color: "#fff",
  border: "none",
  borderRadius: 8,
  padding: "11px 22px",
  fontSize: 14,
  fontWeight: 500,
  cursor: "pointer",
};

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<EmployerOnboarding />);
  </script>
</body>
</html>
