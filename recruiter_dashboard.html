<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | MakePlacement</title>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.10/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --ink: #14181c;
      --paper: #fafbf9;
      --paper-dim: #f1f3f1;
      --steel: #dbdfe0;
      --steel-dim: #868d91;
      --blueprint: #1f3a5f;
      --blueprint-bg: #e8eef3;
      --earn: #2b6e4f;
      --earn-bg: #e7f1eb;
      --alert: #a23b2e;
      --alert-bg: #f8eae8;
      --gold: #9c7a3f;
      --gold-bg: #f4eee0;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    html, body, #root { margin: 0; min-height: 100%; }
    body { background: var(--paper); }
    ::selection { background: var(--blueprint); color: var(--paper); }

    #boot-error {
      display: none;
      max-width: 760px;
      margin: 48px auto;
      padding: 20px;
      font-family: var(--font-sans);
      color: var(--ink);
    }
    #boot-error pre {
      white-space: pre-wrap;
      background: #f7f7f7;
      padding: 12px;
      border-radius: 4px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error">
    <h2>We couldn't load the dashboard.</h2>
    <p>Please refresh the page. If the problem continues, contact support.</p>
    <pre id="boot-error-detail"></pre>
  </div>

  <script>
    window.addEventListener("error", function (event) {
      const box = document.getElementById("boot-error");
      const detail = document.getElementById("boot-error-detail");
      if (box && detail && !document.getElementById("root").hasChildNodes()) {
        box.style.display = "block";
        detail.textContent = event.error ? (event.error.stack || event.error.message) : event.message;
      }
    });
  </script>

  <script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ---------- Supabase config ----------
const SUPABASE_URL = "https://cnayvrtkxgqpejhrlakm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOGIN_URL = "index.html";
const RECRUITER_ONBOARDING_URL = "recruiter_onboarding.html";

// ---------- design tokens (mirrors the :root CSS vars above) ----------
const T = {
  ink: "#14181c",
  paper: "#fafbf9",
  paperDim: "#f1f3f1",
  steel: "#dbdfe0",
  steelDim: "#868d91",
  blueprint: "#1f3a5f",
  blueprintBg: "#e8eef3",
  earn: "#2b6e4f",
  earnBg: "#e7f1eb",
  alert: "#a23b2e",
  alertBg: "#f8eae8",
  gold: "#9c7a3f",
  goldBg: "#f4eee0",
  serif: "'Newsreader', Georgia, serif",
  sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
  mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
};

const isRejected = (c) => (c.status || "").toLowerCase() === "rejected";
const isPlaced = (c) => (c.status || "").toLowerCase() === "placed";
const isActive = (c) => !isRejected(c) && !isPlaced(c);

function money(v) {
  return v == null || v === "" ? "—" : `$${Number(v).toLocaleString()}`;
}

// Platform economics: company pays a fee on the placed salary, and the
// recruiter earns a share of that fee. Not stored anywhere yet -- these
// are fixed constants until per-role/per-company fee terms exist.
const PLATFORM_FEE_PCT = 0.25;
const RECRUITER_SHARE_PCT = 0.70;

function estimateEarnings(minSalary, maxSalary) {
  if (minSalary == null || maxSalary == null) return null;
  const low = Number(minSalary) * PLATFORM_FEE_PCT * RECRUITER_SHARE_PCT;
  const high = Number(maxSalary) * PLATFORM_FEE_PCT * RECRUITER_SHARE_PCT;
  if (!isFinite(low) || !isFinite(high)) return null;
  return { low, high };
}

// ---------- data ----------
async function getMyRecruiter(session) {
  const { data, error } = await supabaseClient
    .from("recruiters")
    .select("*")
    .eq("auth_user_id", session.user.id)
    .maybeSingle();
  if (error) throw new Error(`Failed loading your profile: ${error.message}`);
  return data;
}

async function fetchLiveRoles() {
  const { data, error } = await supabaseClient
    .from("roles")
    .select("*")
    .eq("status", "live")
    .order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  return data || [];
}

async function fetchCompaniesByIds(companyIds) {
  if (companyIds.length === 0) return {};
  const { data, error } = await supabaseClient.from("companies").select("id, name").in("id", companyIds);
  if (error) throw new Error(`Failed loading companies: ${error.message}`);
  const map = {};
  (data || []).forEach((c) => (map[c.id] = c.name));
  return map;
}

async function fetchRoleDetail(roleId) {
  const [stagesRes, qualitiesRes, traitsRes, referencesRes] = await Promise.all([
    supabaseClient.from("role_stages").select("*").eq("role_id", roleId).order("position"),
    supabaseClient.from("role_qualities").select("*").eq("role_id", roleId),
    supabaseClient.from("role_traits_to_avoid").select("*").eq("role_id", roleId),
    supabaseClient.from("role_candidate_references").select("*").eq("role_id", roleId),
  ]);
  if (stagesRes.error) throw new Error(`Failed loading stages: ${stagesRes.error.message}`);
  if (qualitiesRes.error) throw new Error(`Failed loading qualities: ${qualitiesRes.error.message}`);
  if (traitsRes.error) throw new Error(`Failed loading traits: ${traitsRes.error.message}`);
  if (referencesRes.error) throw new Error(`Failed loading references: ${referencesRes.error.message}`);
  return {
    stages: stagesRes.data || [],
    qualities: qualitiesRes.data || [],
    traits: traitsRes.data || [],
    references: referencesRes.data || [],
  };
}

async function submitCandidate(roleId, recruiterId, firstStageId, form) {
  const { error } = await supabaseClient.from("candidates").insert([
    {
      role_id: roleId,
      recruiter_id: recruiterId,
      name: form.name,
      email: form.email || null,
      linkedin: form.linkedin || null,
      resume_url: form.resumeUrl || null,
      notes: form.notes || null,
      stage_id: firstStageId || null,
      status: "active",
    },
  ]);
  if (error) throw new Error(`Failed submitting candidate: ${error.message}`);
}

async function fetchMyCandidates(recruiterId) {
  const { data, error } = await supabaseClient
    .from("candidates")
    .select("*")
    .eq("recruiter_id", recruiterId)
    .order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading your candidates: ${error.message}`);
  return data || [];
}

async function fetchMessagesForRoles(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .in("role_id", roleIds)
    .order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading messages: ${error.message}`);
  return data || [];
}

function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function Mono({ children, style }) {
  return <span style={{ fontFamily: T.mono, ...style }}>{children}</span>;
}

// ---------- structural chrome ----------

          alignItems: "center",
          justifyContent: "space-between",
          flexWrap: "wrap",
          gap: 12,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 26, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
            <a href={LOGIN_URL} style={{ fontFamily: T.serif, fontSize: 19, fontWeight: 500, color: T.paper, textDecoration: "none", letterSpacing: "-0.01em" }}>
              MakePlacement
            </a>
            <span
              style={{
                fontFamily: T.mono,
                fontSize: 10.5,
                letterSpacing: "0.08em",
                color: "#a8c6a8",
                border: "1px solid #3a5a3f",

              }}
            >

            </span>
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            {[
              ["browse", "Browse roles"],
              ["mine", "My candidates"],
            ].map(([key, label]) => (

                style={{

                  background: tab === key ? "#fff" : "transparent",

              </button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 18 }}>
          {recruiterLabel && <div style={{ fontSize: 13, color: "#a8afb5" }}>{recruiterLabel}</div>}
          <a href={RECRUITER_ONBOARDING_URL} style={{ fontSize: 13, color: T.paper, textDecoration: "underline" }}>
            Edit profile
          </a>
          <button
            onClick={onLogout}
            style={{ background: "none", border: "none", fontSize: 13, color: T.paper, textDecoration: "underline", cursor: "pointer", fontFamily: T.sans, padding: 0 }}
          >
            Log out
          </button>
        </div>
      </div>
    </div>
  );
}

function Eyebrow({ children }) {
  return (
    <div
      style={{
        fontFamily: T.mono,
        fontSize: 11,
        fontWeight: 600,
        letterSpacing: "0.09em",
        textTransform: "uppercase",
        color: T.blueprint,
        marginBottom: 8,
      }}
    >
      {children}
    </div>
  );
}

function SectionHeader({ eyebrow, title }) {
  return (
    <div style={{ marginBottom: 26 }}>
      <Eyebrow>{eyebrow}</Eyebrow>
      <div style={{ fontFamily: T.serif, fontSize: 30, fontWeight: 500, letterSpacing: "-0.015em", color: T.ink }}>{title}</div>
    </div>
  );
}

function PrimaryButton(props) {
  return (
    <button
      {...props}
      style={{
        background: T.ink,
        color: T.paper,
        border: "none",
        borderRadius: 3,
        padding: "10px 18px",
        fontSize: 13.5,
        fontWeight: 600,
        cursor: props.disabled ? "default" : "pointer",
        opacity: props.disabled ? 0.6 : 1,
        fontFamily: T.sans,
        ...props.style,
      }}
    />
  );
}

const inputStyle = {
  width: "100%",
  boxSizing: "border-box",
  padding: "10px 13px",
  fontSize: 13.5,
  borderRadius: 3,
  border: `1px solid ${T.steel}`,
  outline: "none",
  color: T.ink,
  background: "#fff",
  fontFamily: T.sans,
  marginBottom: 12,
};

function Tag({ children, tone = "default" }) {
  const tones = {
    default: { fg: T.steelDim, border: T.steel, bg: "transparent" },
    live: { fg: T.blueprint, border: T.blueprint, bg: T.blueprintBg },
    rejected: { fg: T.alert, border: T.alert, bg: T.alertBg },
    placed: { fg: T.earn, border: T.earn, bg: T.earnBg },
  };
  const t = tones[tone] || tones.default;
  return (
    <span
      style={{
        fontFamily: T.mono,
        fontSize: 10.5,
        fontWeight: 600,
        letterSpacing: "0.05em",
        textTransform: "uppercase",
        padding: "3px 8px",
        borderRadius: 3,
        border: `1px solid ${t.border}`,
        background: t.bg,
        color: t.fg,
        whiteSpace: "nowrap",
      }}
    >
      {children}
    </span>
  );
}

function LedgerCard({ accent = T.steel, children, style }) {
  return (
    <div
      style={{
        border: `1px solid ${T.steel}`,
        borderLeft: `4px solid ${accent}`,
        borderRadius: 3,
        background: "#fff",
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function EmptyFrame({ title, body }) {
  return (
    <div
      style={{
        border: `1.5px dashed ${T.steel}`,
        borderRadius: 4,
        padding: "56px 24px",
        textAlign: "center",
        maxWidth: 420,
        margin: "40px auto",
      }}
    >
      <div style={{ fontFamily: T.serif, fontSize: 20, color: T.ink, marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 13.5, color: T.steelDim }}>{body}</div>
    </div>
  );
}

function MessageFeed({ messages, emptyLabel }) {
  if (messages.length === 0) {
    return <div style={{ fontSize: 12, color: "#c4c4c4", fontStyle: "italic" }}>{emptyLabel}</div>;
  }
  return (
    <div>
      {messages.map((m) => (
        <div key={m.id} style={{ padding: "7px 0", borderBottom: `1px solid ${T.paperDim}` }}>
          <div style={{ fontSize: 12.5, color: "#333", whiteSpace: "pre-wrap" }}>{m.body}</div>
          <div style={{ fontFamily: T.mono, fontSize: 10.5, color: T.steelDim, marginTop: 2 }}>{formatWhen(m.created_at)}</div>
        </div>
      ))}
    </div>
  );
}

function RoleUpdatesBanner({ messages }) {
  const [open, setOpen] = useState(messages.length > 0 && messages.length <= 2);
  if (messages.length === 0) return null;
  return (
    <LedgerCard accent={T.blueprint} style={{ padding: "10px 14px", marginBottom: 10 }}>
      <div
        onClick={() => setOpen((o) => !o)}
        style={{ fontSize: 12.5, fontWeight: 600, cursor: "pointer", display: "flex", justifyContent: "space-between" }}
      >
        <span>Updates from company ({messages.length})</span>
        <span style={{ color: T.steelDim }}>{open ? "Hide" : "Show"}</span>
      </div>
      {open && (
        <div style={{ marginTop: 8 }}>
          <MessageFeed messages={messages} emptyLabel="" />
        </div>
      )}
    </LedgerCard>
  );
}

// ---------- submit candidate form ----------
function SubmitCandidateForm({ role, firstStageId, recruiterId, onSubmitted }) {
  const [form, setForm] = useState({ name: "", email: "", linkedin: "", resumeUrl: "", notes: "" });
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const set = (patch) => setForm((f) => ({ ...f, ...patch }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) {
      setError("Candidate name is required.");
      return;
    }
    setSubmitting(true);
    setError("");
    try {
      await submitCandidate(role.id, recruiterId, firstStageId, form);
      setDone(true);
      onSubmitted && onSubmitted();
    } catch (err) {
      setError(err.message || "Something went wrong submitting this candidate.");
    } finally {
      setSubmitting(false);
    }
  };

  if (done) {
    return (
      <div style={{ padding: "16px 0" }}>
        <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>Candidate submitted</div>
        <div style={{ fontSize: 13, color: T.steelDim, marginBottom: 12 }}>
          {form.name} has been added to {role.name}'s pipeline.
        </div>
        <button
          onClick={() => {
            setForm({ name: "", email: "", linkedin: "", resumeUrl: "", notes: "" });
            setDone(false);
          }}
          style={{ fontSize: 13, color: T.ink, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", padding: 0, fontFamily: T.sans }}
        >
          Submit another candidate
        </button>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit}>
      <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 10 }}>Submit a candidate</div>
      <input
        style={inputStyle}
        placeholder="Candidate full name *"
        value={form.name}
        onChange={(e) => set({ name: e.target.value })}
      />
      <input
        style={inputStyle}
        placeholder="Email (optional)"
        value={form.email}
        onChange={(e) => set({ email: e.target.value })}
      />
      <input
        style={inputStyle}
        placeholder="linkedin.com/in/... (optional)"
        value={form.linkedin}
        onChange={(e) => set({ linkedin: e.target.value })}
      />
      <input
        style={inputStyle}
        placeholder="Resume link (optional)"
        value={form.resumeUrl}
        onChange={(e) => set({ resumeUrl: e.target.value })}
      />
      <textarea
        style={{ ...inputStyle, minHeight: 70, resize: "vertical" }}
        placeholder="Why this candidate is a fit (optional)"
        value={form.notes}
        onChange={(e) => set({ notes: e.target.value })}
      />
      {error && <div style={{ color: T.alert, fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
      <PrimaryButton type="submit" disabled={submitting}>
        {submitting ? "Submitting…" : "Submit candidate"}
      </PrimaryButton>
    </form>
  );
}

// ---------- role card + detail ----------
function RoleCard({ role, companyName, expanded, onToggle, detail, recruiterId }) {
  const earnings = estimateEarnings(role.min_salary, role.max_salary);
  return (
    <LedgerCard accent={T.blueprint} style={{ marginBottom: 12, overflow: "hidden" }}>
      <div
        onClick={onToggle}
        style={{ padding: "18px 20px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 16, flexWrap: "wrap" }}
      >
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
            <div style={{ fontFamily: T.serif, fontSize: 18, fontWeight: 500 }}>{role.name}</div>
            <Tag tone="live">live</Tag>
          </div>
          <div style={{ fontSize: 13, color: T.steelDim, marginBottom: 10 }}>
            {companyName || "Company"} · <Mono>{money(role.min_salary)} – {money(role.max_salary)}</Mono>
            {role.hiring_goals ? ` · Target: ${role.hiring_goals}` : ""}
          </div>
          {earnings && (
            <div
              style={{
                display: "inline-flex",
                alignItems: "center",
                gap: 6,
                fontFamily: T.mono,
                fontSize: 12,
                fontWeight: 600,
                color: T.earn,
                background: T.earnBg,
                padding: "5px 10px",
                borderRadius: 3,
                border: `1px solid ${T.earn}`,
              }}
            >
              est. earnings {money(Math.round(earnings.low))} – {money(Math.round(earnings.high))}
            </div>
          )}
        </div>
        <div style={{ fontSize: 13, color: T.ink, textDecoration: "underline", whiteSpace: "nowrap" }}>
          {expanded ? "Hide details" : "View details"}
        </div>
      </div>

      {expanded && (
        <div style={{ padding: "0 20px 24px", borderTop: `1px solid ${T.paperDim}` }}>
          {!detail ? (
            <div style={{ fontSize: 13, color: T.steelDim, paddingTop: 16 }}>Loading role details…</div>
          ) : (
            <div style={{ paddingTop: 18, display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 28 }}>
              <div>
                {role.description && (
                  <div style={{ marginBottom: 20 }}>
                    <div style={sectionLabelStyle}>About this role</div>
                    <div style={{ fontSize: 13.5, color: "#333", whiteSpace: "pre-wrap" }}>{role.description}</div>
                  </div>
                )}

                {detail.qualities.length > 0 && (
                  <div style={{ marginBottom: 20 }}>
                    <div style={sectionLabelStyle}>Ideal candidate qualities</div>
                    <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, color: "#333" }}>
                      {detail.qualities.map((q) => (
                        <li key={q.id}>{q.quality}</li>
                      ))}
                    </ul>
                  </div>
                )}

                {detail.traits.length > 0 && (
                  <div style={{ marginBottom: 20 }}>
                    <div style={sectionLabelStyle}>Traits to avoid</div>
                    <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, color: "#333" }}>
                      {detail.traits.map((t) => (
                        <li key={t.id}>{t.trait}</li>
                      ))}
                    </ul>
                  </div>
                )}

                {detail.references.length > 0 && (
                  <div style={{ marginBottom: 20 }}>
                    <div style={sectionLabelStyle}>Profiles referenced</div>
                    {detail.references.map((r) => (
                      <div key={r.id} style={{ fontSize: 13.5, marginBottom: 6 }}>
                        <div style={{ color: "#333" }}>{r.note}</div>
                        {r.linkedin && <div style={{ color: T.steelDim, fontSize: 12.5 }}>{r.linkedin}</div>}
                      </div>
                    ))}
                  </div>
                )}

                {role.recruiting_advice && (
                  <div style={{ marginBottom: 20 }}>
                    <div style={sectionLabelStyle}>Recruiting advice</div>
                    <div style={{ fontSize: 13.5, color: "#333", whiteSpace: "pre-wrap" }}>{role.recruiting_advice}</div>
                  </div>
                )}

                {role.hm_intro && (
                  <div style={{ marginBottom: 20 }}>
                    <div style={sectionLabelStyle}>Hiring manager intro</div>
                    <div style={{ fontSize: 13.5, color: "#333", whiteSpace: "pre-wrap" }}>{role.hm_intro}</div>
                  </div>
                )}

                {detail.stages.length > 0 && (
                  <div>
                    <div style={sectionLabelStyle}>Interview stages</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {detail.stages.map((s, i) => (
                        <span key={s.id} style={{ fontFamily: T.mono, fontSize: 12, padding: "5px 10px", borderRadius: 3, border: `1px solid ${T.steel}` }}>
                          {i + 1}. {s.name}
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              <div style={{ background: T.paperDim, border: `1px solid ${T.steel}`, borderRadius: 3, padding: 16, alignSelf: "start" }}>
                <SubmitCandidateForm
                  role={role}
                  firstStageId={detail.stages[0] ? detail.stages[0].id : null}
                  recruiterId={recruiterId}
                />
              </div>
            </div>
          )}
        </div>
      )}
    </LedgerCard>
  );
}

const sectionLabelStyle = {
  fontFamily: T.mono,
  fontSize: 11,
  fontWeight: 700,
  letterSpacing: "0.05em",
  color: T.steelDim,
  textTransform: "uppercase",
  marginBottom: 6,
};

// ---------- browse roles ----------
function BrowseRoles({ recruiterId }) {
  const [roles, setRoles] = useState([]);
  const [companyMap, setCompanyMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  const [detailCache, setDetailCache] = useState({});

  useEffect(() => {
    (async () => {
      try {
        const r = await fetchLiveRoles();
        setRoles(r);
        setCompanyMap(await fetchCompaniesByIds([...new Set(r.map((x) => x.company_id))]));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const toggle = async (roleId) => {
    if (expandedId === roleId) {
      setExpandedId(null);
      return;
    }
    setExpandedId(roleId);
    if (!detailCache[roleId]) {
      try {
        const d = await fetchRoleDetail(roleId);
        setDetailCache((prev) => ({ ...prev, [roleId]: d }));
      } catch (err) {
        setError(err.message);
      }
    }
  };

  if (loading) return <div style={{ color: T.steelDim, fontSize: 13, fontFamily: T.mono }}>loading roles…</div>;
  if (error) return <div style={{ color: T.alert, fontSize: 14 }}>{error}</div>;

  return (
    <div>
      <SectionHeader eyebrow={`${roles.length} open role${roles.length === 1 ? "" : "s"}`} title="Live roles" />
      {roles.length === 0 ? (
        <EmptyFrame title="No live roles right now" body="Check back soon — new roles show up here as clients post them." />
      ) : (
        roles.map((role) => (
          <RoleCard
            key={role.id}
            role={role}
            companyName={companyMap[role.company_id]}
            expanded={expandedId === role.id}
            onToggle={() => toggle(role.id)}
            detail={detailCache[role.id]}
            recruiterId={recruiterId}
          />
        ))
      )}
    </div>
  );
}

// ---------- my candidates ----------
function MyCandidateCard({ candidate, stageName, feedbackMessages }) {
  const accent = isPlaced(candidate) ? T.earn : isRejected(candidate) ? T.alert : T.steel;
  return (
    <LedgerCard accent={accent} style={{ padding: 16, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div style={{ fontSize: 14.5, fontWeight: 600 }}>{candidate.name}</div>
        {isRejected(candidate) && <Tag tone="rejected">Rejected</Tag>}
        {isPlaced(candidate) && <Tag tone="placed">Placed</Tag>}
        {isActive(candidate) && <Tag>{stageName || "In review"}</Tag>}
      </div>
      <div style={{ fontFamily: T.mono, fontSize: 11, color: "#c4c4c4", marginTop: 8 }}>
        submitted {new Date(candidate.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" })}
      </div>
      {feedbackMessages.length > 0 && (
        <div style={{ marginTop: 10, borderTop: `1px solid ${T.paperDim}`, paddingTop: 10 }}>
          <div style={{ fontFamily: T.mono, fontSize: 11, fontWeight: 600, color: T.steelDim, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.04em" }}>
            Feedback from company ({feedbackMessages.length})
          </div>
          <MessageFeed messages={feedbackMessages} emptyLabel="" />
        </div>
      )}
    </LedgerCard>
  );
}

function RoleGroup({ role, companyName, candidates, stageMap, messages }) {
  const roleMessages = messages.filter((m) => m.role_id === role.id);
  const broadcasts = roleMessages.filter((m) => !m.candidate_id);
  const messagesForCandidate = (candidateId) => roleMessages.filter((m) => m.candidate_id === candidateId);

  return (
    <div style={{ marginBottom: 30 }}>
      <div style={{ fontFamily: T.serif, fontSize: 17, fontWeight: 500, marginBottom: 2 }}>{role.name}</div>
      <div style={{ fontSize: 12.5, color: T.steelDim, marginBottom: 10 }}>{companyName}</div>
      <RoleUpdatesBanner messages={broadcasts} />
      {candidates.map((c) => (
        <MyCandidateCard
          key={c.id}
          candidate={c}
          stageName={stageMap[c.stage_id]}
          feedbackMessages={messagesForCandidate(c.id)}
        />
      ))}
    </div>
  );
}

function MyCandidates({ recruiterId }) {
  const [candidates, setCandidates] = useState([]);
  const [roleMap, setRoleMap] = useState({});
  const [companyMap, setCompanyMap] = useState({});
  const [stageMap, setStageMap] = useState({});
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const cands = await fetchMyCandidates(recruiterId);
        setCandidates(cands);

        const roleIds = [...new Set(cands.map((c) => c.role_id))];
        const stageIds = [...new Set(cands.map((c) => c.stage_id).filter(Boolean))];

        const [rolesRes, stagesRes, msgs] = await Promise.all([
          roleIds.length
            ? supabaseClient.from("roles").select("id, name, company_id").in("id", roleIds)
            : Promise.resolve({ data: [] }),
          stageIds.length
            ? supabaseClient.from("role_stages").select("id, name").in("id", stageIds)
            : Promise.resolve({ data: [] }),
          fetchMessagesForRoles(roleIds),
        ]);

        const rMap = {};
        (rolesRes.data || []).forEach((r) => (rMap[r.id] = r));
        setRoleMap(rMap);

        const sMap = {};
        (stagesRes.data || []).forEach((s) => (sMap[s.id] = s.name));
        setStageMap(sMap);

        setMessages(msgs);

        const companyIds = [...new Set(Object.values(rMap).map((r) => r.company_id))];
        setCompanyMap(await fetchCompaniesByIds(companyIds));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, [recruiterId]);

  if (loading) return <div style={{ color: T.steelDim, fontSize: 13, fontFamily: T.mono }}>loading your candidates…</div>;
  if (error) return <div style={{ color: T.alert, fontSize: 14 }}>{error}</div>;

  const candidatesByRole = {};
  candidates.forEach((c) => {
    (candidatesByRole[c.role_id] = candidatesByRole[c.role_id] || []).push(c);
  });

  return (
    <div>
      <SectionHeader eyebrow={`${candidates.length} submitted`} title="My candidates" />
      {candidates.length === 0 ? (
        <EmptyFrame title="No candidates submitted yet" body="Browse live roles to submit your first candidate." />
      ) : (
        Object.keys(candidatesByRole).map((roleId) => {
          const role = roleMap[roleId];
          if (!role) return null;
          return (
            <RoleGroup
              key={roleId}
              role={role}
              companyName={companyMap[role.company_id]}
              candidates={candidatesByRole[roleId]}
              stageMap={stageMap}
              messages={messages}
            />
          );
        })
      )}
    </div>
  );
}

// ---------- main ----------
function RecruiterDashboard() {
  const [session, setSession] = useState(undefined);
  const [recruiter, setRecruiter] = useState(null);
  const [tab, setTab] = useState("browse");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) {
        window.location.href = LOGIN_URL;
        return;
      }
      setSession(session);
      try {
        const r = await getMyRecruiter(session);
        if (!r) {
          window.location.href = LOGIN_URL;
          return;
        }
        setRecruiter(r);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    });
  }, []);

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    window.location.href = LOGIN_URL;
  };

  if (session === undefined || loading) {
    return (
      <div style={pageWrap}>
        <div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.steelDim, fontFamily: T.mono, fontSize: 13 }}>loading…</div>
      </div>
    );
  }

  if (error) {
    return (
      <div style={pageWrap}>
        <div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.alert }}>{error}</div>
      </div>
    );
  }

  return (
    <div style={pageWrap}>
      <TopBar
        recruiterLabel={recruiter.firm_name || ""}
        tab={tab}
        onTabChange={setTab}
        onLogout={handleLogout}
      />
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "40px 28px 100px" }}>
        {tab === "browse" && <BrowseRoles recruiterId={recruiter.id} />}
        {tab === "mine" && <MyCandidates recruiterId={recruiter.id} />}
      </div>
    </div>
  );
}

const pageWrap = {
  minHeight: "100vh",
  background: T.paper,
  fontFamily: T.sans,
  color: T.ink,
};

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RecruiterDashboard />);
  </script>
</body>
