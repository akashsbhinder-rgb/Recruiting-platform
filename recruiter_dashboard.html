<body>
  <div id="root"></div>
  <div id="boot-error">
    <h2>We couldn't load the dashboard.</h2>
    <p>Please refresh the page. If the problem continues, contact support.</p>
    <pre id="boot-error-detail"></pre>
  </div>

  <script>
    window.addEventListener("error", function (event) {
      const box = document.getElementById("boot-error");
      const detail = document.getElementById("boot-error-detail");
      if (box && detail && !document.getElementById("root").hasChildNodes()) {
        box.style.display = "block";
        detail.textContent = event.error ? (event.error.stack || event.error.message) : event.message;

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Supabase config ----------
const SUPABASE_URL = "https://cnayvrtkxgqpejhrlakm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOGIN_URL = "index.html";
const RECRUITER_ONBOARDING_URL = "recruiter_onboarding.html";

const isRejected = (c) => (c.status || "").toLowerCase() === "rejected";
const isPlaced = (c) => (c.status || "").toLowerCase() === "placed";
const isActive = (c) => !isRejected(c) && !isPlaced(c);

function money(v) {
  return v == null || v === "" ? "—" : `$${Number(v).toLocaleString()}`;
}

// Platform economics: company pays a fee on the placed salary, and the
// recruiter earns a share of that fee. Not stored anywhere yet -- these
// are fixed constants until per-role/per-company fee terms exist.
const PLATFORM_FEE_PCT = 0.25;
const RECRUITER_SHARE_PCT = 0.70;

function estimateEarnings(minSalary, maxSalary) {
  if (minSalary == null || maxSalary == null) return null;
  const low = Number(minSalary) * PLATFORM_FEE_PCT * RECRUITER_SHARE_PCT;
  const high = Number(maxSalary) * PLATFORM_FEE_PCT * RECRUITER_SHARE_PCT;
  if (!isFinite(low) || !isFinite(high)) return null;
  return { low, high };
}

function feePct() {
  // Effective take-home as a % of salary, mirroring the "17.5% first year
  // salary + bonus" line shown on role cards.
  return `${Math.round(PLATFORM_FEE_PCT * 1000) / 10}%`;
}

// ---------- data ----------
async function getMyRecruiter(session) {
  const { data, error } = await supabaseClient
    .from("recruiters")
    .select("*")
    .eq("auth_user_id", session.user.id)
    .maybeSingle();
  if (error) throw new Error(`Failed loading your profile: ${error.message}`);
  return data;
}

async function fetchLiveRoles() {
  const { data, error } = await supabaseClient
    .from("roles")
    .select("*")
    .eq("status", "live")
    .order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  return data || [];
}

async function fetchCompaniesByIds(companyIds) {
  if (companyIds.length === 0) return {};
  const { data, error } = await supabaseClient.from("companies").select("id, name").in("id", companyIds);
  if (error) throw new Error(`Failed loading companies: ${error.message}`);
  const map = {};
  (data || []).forEach((c) => (map[c.id] = c.name));
  return map;
}

async function fetchRoleDetail(roleId) {
  const [stagesRes, qualitiesRes, traitsRes, referencesRes] = await Promise.all([
    supabaseClient.from("role_stages").select("*").eq("role_id", roleId).order("position"),
    supabaseClient.from("role_qualities").select("*").eq("role_id", roleId),
    supabaseClient.from("role_traits_to_avoid").select("*").eq("role_id", roleId),
    supabaseClient.from("role_candidate_references").select("*").eq("role_id", roleId),
  ]);
  if (stagesRes.error) throw new Error(`Failed loading stages: ${stagesRes.error.message}`);
  if (qualitiesRes.error) throw new Error(`Failed loading qualities: ${qualitiesRes.error.message}`);
  if (traitsRes.error) throw new Error(`Failed loading traits: ${traitsRes.error.message}`);
  if (referencesRes.error) throw new Error(`Failed loading references: ${referencesRes.error.message}`);
  return {
    stages: stagesRes.data || [],
    qualities: qualitiesRes.data || [],
    traits: traitsRes.data || [],
    references: referencesRes.data || [],
  };
}

async function submitCandidate(roleId, recruiterId, firstStageId, form) {
  const { error } = await supabaseClient.from("candidates").insert([
    {
      role_id: roleId,
      recruiter_id: recruiterId,
      name: form.name,
      email: form.email || null,
      linkedin: form.linkedin || null,
      resume_url: form.resumeUrl || null,
      notes: form.notes || null,
      stage_id: firstStageId || null,
      status: "active",
    },
  ]);
  if (error) throw new Error(`Failed submitting candidate: ${error.message}`);
}

async function fetchMyCandidates(recruiterId) {
  const { data, error } = await supabaseClient
    .from("candidates")
    .select("*")
    .eq("recruiter_id", recruiterId)
    .order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading your candidates: ${error.message}`);
  return data || [];
}

async function fetchMessagesForRoles(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .in("role_id", roleIds)
    .order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading messages: ${error.message}`);
  return data || [];
}

function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

// ---------- little visual helpers ----------

// Deterministic gradient per company, so cards feel photographic/branded
// without needing real uploaded images.
const GRADIENTS = [
  ["#bcd4ff", "#eef2ff"],
  ["#ffd6c2", "#fff3e6"],
  ["#c9f0d8", "#eefbf2"],
  ["#f4d3ee", "#fbeaf8"],
  ["#d6d0ff", "#f0edff"],
  ["#ffe1a8", "#fff6e3"],
  ["#c6ecf0", "#eafbfd"],
];
function gradientFor(seed) {
  let h = 0;
  for (let i = 0; i < (seed || "").length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const [a, b] = GRADIENTS[h % GRADIENTS.length];
  const angle = 120 + (h % 90);
  return `linear-gradient(${angle}deg, ${a}, ${b})`;
}
function initialsFor(name) {
  if (!name) return "•";
  return name.trim().charAt(0).toUpperCase();
}

}
function IconHeart({ size = 17, filled }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? "#e0524a" : "none"}>
      <path
        d="M12 20.2s-7.6-4.6-9.9-9.2C.6 7.4 2.6 4 6.3 4c2 0 3.6 1.1 4.7 2.6C12.1 5.1 13.7 4 15.7 4c3.7 0 5.7 3.4 4.2 7-2.3 4.6-9.9 9.2-9.9 9.2z"
        stroke={filled ? "#e0524a" : "var(--muted)"}
        strokeWidth="1.7"
        strokeLinejoin="round"
      />
    </svg>
  );
}

function Pill({ children, tone = "default", small }) {
  const tones = {
    default: { fg: "var(--muted)", border: "var(--border)", bg: "transparent" },
    live: { fg: "var(--green)", border: "var(--green)", bg: "var(--green-soft)" },
    rejected: { fg: "var(--red)", border: "var(--red)", bg: "var(--red-soft)" },
    placed: { fg: "var(--green)", border: "var(--green)", bg: "var(--green-soft)" },
    paused: { fg: "var(--amber)", border: "var(--amber)", bg: "var(--amber-soft)" },
  };
  const t = tones[tone] || tones.default;
  return (
    <span
      style={{
        fontSize: small ? 11 : 12,
        fontWeight: 600,
        padding: small ? "3px 8px" : "4px 10px",
        borderRadius: 999,
        border: `1px solid ${t.border}`,
        background: t.bg,
        color: t.fg,
        whiteSpace: "nowrap",
        display: "inline-flex",
        alignItems: "center",
        gap: 4,
      }}
    >
      {children}
    </span>
  );
}

const inputStyle = {

// ---------- role card (browse grid) ----------

// ---------- role detail (slide-over) ----------
function MessageFeed({ messages, emptyLabel }) {
  if (messages.length === 0) {
    return <div style={{ fontSize: 12.5, color: "var(--muted-2)", fontStyle: "italic" }}>{emptyLabel}</div>;
  }
  return (
    <div>
      {messages.map((m) => (
        <div key={m.id} style={{ padding: "8px 0", borderBottom: "1px solid var(--wash)" }}>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)", whiteSpace: "pre-wrap" }}>{m.body}</div>
          <div style={{ fontSize: 11, color: "var(--muted-2)", marginTop: 2 }}>{formatWhen(m.created_at)}</div>
        </div>
      ))}
    </div>
  );
}

function SubmitCandidateForm({ role, firstStageId, recruiterId, onSubmitted }) {
  const [form, setForm] = useState({ name: "", email: "", linkedin: "", resumeUrl: "", notes: "" });
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const set = (patch) => setForm((f) => ({ ...f, ...patch }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) {
      setError("Candidate name is required.");
      return;
    }
    setSubmitting(true);
    setError("");
    try {
      await submitCandidate(role.id, recruiterId, firstStageId, form);
      setDone(true);
      onSubmitted && onSubmitted();
    } catch (err) {
      setError(err.message || "Something went wrong submitting this candidate.");
    } finally {
      setSubmitting(false);
    }
  };

  if (done) {
    return (
      <div>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>Candidate submitted</div>
        <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 14 }}>
          {form.name} has been added to {role.name}'s pipeline.
        </div>
        <SecondaryButton
          onClick={() => {
            setForm({ name: "", email: "", linkedin: "", resumeUrl: "", notes: "" });
            setDone(false);
          }}
        >
          Submit another candidate
        </SecondaryButton>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit}>
      <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Submit a candidate</div>
      <input style={inputStyle} placeholder="Candidate full name *" value={form.name} onChange={(e) => set({ name: e.target.value })} />
      <input style={inputStyle} placeholder="Email (optional)" value={form.email} onChange={(e) => set({ email: e.target.value })} />
      <input style={inputStyle} placeholder="linkedin.com/in/... (optional)" value={form.linkedin} onChange={(e) => set({ linkedin: e.target.value })} />
      <input style={inputStyle} placeholder="Resume link (optional)" value={form.resumeUrl} onChange={(e) => set({ resumeUrl: e.target.value })} />
      <textarea
        style={{ ...inputStyle, minHeight: 70, resize: "vertical" }}
        placeholder="Why this candidate is a fit (optional)"
        value={form.notes}
        onChange={(e) => set({ notes: e.target.value })}
      />
      {error && <div style={{ color: "var(--red)", fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
      <PrimaryButton type="submit" disabled={submitting} style={{ width: "100%" }}>
        {submitting ? "Submitting…" : "Submit candidate"}
      </PrimaryButton>
    </form>
  );
}

const sectionLabelStyle = {
  fontSize: 11,
  fontWeight: 700,
  letterSpacing: "0.04em",
  color: "var(--muted)",
  textTransform: "uppercase",
  marginBottom: 7,
};

      <div

          width: "min(760px, 100%)",
          height: "100%",
          background: "#fff",
          boxShadow: "var(--shadow-pop)",

// ---------- browse roles ----------
function BrowseRoles({ recruiterId }) {
  const [roles, setRoles] = useState([]);
  const [companyMap, setCompanyMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [query, setQuery] = useState("");
  const [openId, setOpenId] = useState(null);
  const [detailCache, setDetailCache] = useState({});
  const [favorites, setFavorites] = useState({});

  useEffect(() => {
    (async () => {
      try {
        const r = await fetchLiveRoles();
        setRoles(r);
        setCompanyMap(await fetchCompaniesByIds([...new Set(r.map((x) => x.company_id))]));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const openRole = async (roleId) => {
    setOpenId(roleId);
    if (!detailCache[roleId]) {
      try {
        const d = await fetchRoleDetail(roleId);
        setDetailCache((prev) => ({ ...prev, [roleId]: d }));
      } catch (err) {
        setError(err.message);
      }
    }
  };

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return roles;
    return roles.filter((r) => {
      const company = (companyMap[r.company_id] || "").toLowerCase();
      return r.name.toLowerCase().includes(q) || company.includes(q);
    });
  }, [roles, companyMap, query]);

  if (loading) return <div style={{ color: "var(--muted)", fontSize: 13 }}>Loading roles…</div>;
  if (error) return <div style={{ color: "var(--red)", fontSize: 14 }}>{error}</div>;

  const openRoleObj = roles.find((r) => r.id === openId);

  return (
    <div>
      <PageHeader
        title="Browse roles"
        subtitle="Live searches you can submit candidates to right now."
        action={<div style={{ fontSize: 13.5, color: "var(--muted)" }}>{filtered.length} role{filtered.length === 1 ? "" : "s"}</div>}
      />

      <SearchBar value={query} onChange={setQuery} placeholder="Search roles, companies, and more…" />

      {roles.length === 0 && (
        <EmptyState
          icon={<IconBriefcase />}
          title="No live roles right now"
          body="Check back soon — new roles show up here as clients post them."
        />
      )}

      {roles.length > 0 && filtered.length === 0 && (
        <EmptyState
          icon={<IconSearch color="var(--blue)" size={20} />}
          title="No roles match your search"
          body="Try a different company name or role title."
          actions={<SecondaryButton onClick={() => setQuery("")}>Clear search</SecondaryButton>}
        />
      )}

      {filtered.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))", gap: 16 }}>
          {filtered.map((role) => (
            <RoleCard
              key={role.id}
              role={role}
              companyName={companyMap[role.company_id]}
              onOpen={() => openRole(role.id)}
              favorited={!!favorites[role.id]}
              onToggleFavorite={() => setFavorites((f) => ({ ...f, [role.id]: !f[role.id] }))}
            />
          ))}
        </div>
      )}

      {openRoleObj && (
        <RoleDetailPanel
          role={openRoleObj}
          companyName={companyMap[openRoleObj.company_id]}
          detail={detailCache[openRoleObj.id]}
          recruiterId={recruiterId}
          onClose={() => setOpenId(null)}
        />
      )}
    </div>
  );
}

// ---------- my candidates ----------
function RoleUpdatesBanner({ messages }) {
  const [open, setOpen] = useState(messages.length > 0 && messages.length <= 2);
  if (messages.length === 0) return null;
  return (
    <div style={{ border: "1px solid var(--border)", borderLeft: "3px solid var(--blue)", borderRadius: 8, padding: "10px 14px", marginBottom: 10, background: "var(--blue-soft)" }}>
      <div onClick={() => setOpen((o) => !o)} style={{ fontSize: 12.5, fontWeight: 700, cursor: "pointer", display: "flex", justifyContent: "space-between", color: "var(--ink)" }}>
        <span>Updates from company ({messages.length})</span>
        <span style={{ color: "var(--muted)" }}>{open ? "Hide" : "Show"}</span>
      </div>
      {open && <div style={{ marginTop: 8 }}><MessageFeed messages={messages} emptyLabel="" /></div>}
    </div>
  );
}

function MyCandidateCard({ candidate, stageName, feedbackMessages }) {
  return (
    <div style={{ border: "1px solid var(--border)", borderRadius: 12, padding: 16, marginBottom: 10, background: "#fff" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div style={{ fontSize: 14.5, fontWeight: 700 }}>{candidate.name}</div>
        {isRejected(candidate) && <Pill tone="rejected">Rejected</Pill>}
        {isPlaced(candidate) && <Pill tone="placed">Placed</Pill>}
        {isActive(candidate) && <Pill>{stageName || "In review"}</Pill>}
      </div>
      <div style={{ fontSize: 11.5, color: "var(--muted-2)", marginTop: 8 }}>
        submitted {new Date(candidate.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" })}
      </div>
      {feedbackMessages.length > 0 && (
        <div style={{ marginTop: 10, borderTop: "1px solid var(--wash)", paddingTop: 10 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "var(--muted)", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.04em" }}>
            Feedback from company ({feedbackMessages.length})
          </div>
          <MessageFeed messages={feedbackMessages} emptyLabel="" />
        </div>
      )}
    </div>
  );
}

function RoleGroup({ role, companyName, candidates, stageMap, messages }) {
  const roleMessages = messages.filter((m) => m.role_id === role.id);
  const broadcasts = roleMessages.filter((m) => !m.candidate_id);
  const messagesForCandidate = (candidateId) => roleMessages.filter((m) => m.candidate_id === candidateId);

  return (
    <div style={{ marginBottom: 30 }}>
      <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 2 }}>{role.name}</div>
      <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10 }}>{companyName}</div>
      <RoleUpdatesBanner messages={broadcasts} />
      {candidates.map((c) => (
        <MyCandidateCard key={c.id} candidate={c} stageName={stageMap[c.stage_id]} feedbackMessages={messagesForCandidate(c.id)} />
      ))}
    </div>
  );
}

function MyCandidates({ recruiterId, onBrowse }) {
  const [candidates, setCandidates] = useState([]);
  const [roleMap, setRoleMap] = useState({});
  const [companyMap, setCompanyMap] = useState({});
  const [stageMap, setStageMap] = useState({});
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const cands = await fetchMyCandidates(recruiterId);
        setCandidates(cands);

        const roleIds = [...new Set(cands.map((c) => c.role_id))];
        const stageIds = [...new Set(cands.map((c) => c.stage_id).filter(Boolean))];

        const [rolesRes, stagesRes, msgs] = await Promise.all([
          roleIds.length ? supabaseClient.from("roles").select("id, name, company_id").in("id", roleIds) : Promise.resolve({ data: [] }),
          stageIds.length ? supabaseClient.from("role_stages").select("id, name").in("id", stageIds) : Promise.resolve({ data: [] }),
          fetchMessagesForRoles(roleIds),
        ]);

        const rMap = {};
        (rolesRes.data || []).forEach((r) => (rMap[r.id] = r));
        setRoleMap(rMap);

        const sMap = {};
        (stagesRes.data || []).forEach((s) => (sMap[s.id] = s.name));
        setStageMap(sMap);

        setMessages(msgs);

        const companyIds = [...new Set(Object.values(rMap).map((r) => r.company_id))];
        setCompanyMap(await fetchCompaniesByIds(companyIds));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, [recruiterId]);

  if (loading) return <div style={{ color: "var(--muted)", fontSize: 13 }}>Loading your candidates…</div>;
  if (error) return <div style={{ color: "var(--red)", fontSize: 14 }}>{error}</div>;

  const candidatesByRole = {};
  candidates.forEach((c) => {
    (candidatesByRole[c.role_id] = candidatesByRole[c.role_id] || []).push(c);
  });

  return (
    <div>
      <PageHeader title="My candidates" subtitle="Everyone you've submitted, grouped by role." />
      {candidates.length === 0 ? (
        <EmptyState
          icon={<IconCalendar />}
          title="No candidates submitted yet"
          body="Kickstart your pipeline with roles that match your expertise."
          actions={<SecondaryButton onClick={onBrowse}>Browse roles</SecondaryButton>}
        />
      ) : (
        Object.keys(candidatesByRole).map((roleId) => {
          const role = roleMap[roleId];
          if (!role) return null;
          return (
            <RoleGroup
              key={roleId}
              role={role}
              companyName={companyMap[role.company_id]}
              candidates={candidatesByRole[roleId]}
              stageMap={stageMap}
              messages={messages}
            />
          );
        })
      )}
    </div>
  );
}

// ---------- main ----------
function RecruiterDashboard() {
  const [session, setSession] = useState(undefined);
  const [recruiter, setRecruiter] = useState(null);
  const [tab, setTab] = useState("browse");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) {
        window.location.href = LOGIN_URL;
        return;
      }
      setSession(session);
      try {
        const r = await getMyRecruiter(session);
        if (!r) {
          window.location.href = LOGIN_URL;
          return;
        }
        setRecruiter(r);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    });
  }, []);

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    window.location.href = LOGIN_URL;
  };

  if (session === undefined || loading) {
    return (
      <div style={pageWrap}>
        <div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: "var(--muted)", fontSize: 13.5 }}>Loading…</div>
      </div>
    );
  }

  if (error) {
    return (
      <div style={pageWrap}>
        <div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: "var(--red)" }}>{error}</div>
      </div>
    );
  }

  return (
    <div style={pageWrap}>
      <TopNav recruiterLabel={recruiter.firm_name || ""} tab={tab} onTabChange={setTab} onLogout={handleLogout} />
      <div style={{ maxWidth: 1240, margin: "0 auto", padding: "36px 28px 100px" }}>
        {tab === "browse" && <BrowseRoles recruiterId={recruiter.id} />}
        {tab === "mine" && <MyCandidates recruiterId={recruiter.id} onBrowse={() => setTab("browse")} />}
      </div>
    </div>
  );
}

const pageWrap = {
  minHeight: "100vh",
  background: "var(--paper)",
  fontFamily: "var(--font-sans)",
  color: "var(--ink)",
};

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RecruiterDashboard />);
  </script>
</body>
