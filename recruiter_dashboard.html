function StripeConnectBanner({ recruiter, session }) {
  const [hasPlacement, setHasPlacement] = useState(false);
  const [connecting, setConnecting] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { count } = await supabaseClient
        .from("placements")
        .select("id", { count: "exact", head: true })
        .eq("recruiter_id", recruiter.id);
      if (!cancelled) setHasPlacement(!!count && count > 0);
    })();
    return () => { cancelled = true; };
  }, [recruiter.id]);

  if (!hasPlacement || recruiter.stripe_onboarding_complete) return null;

  const connect = async () => {
    setConnecting(true);
    setError("");
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-stripe-connect-account`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${session.access_token}`,
          apikey: SUPABASE_ANON_KEY,
        },
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Something went wrong.");
      window.location.href = body.url;
    } catch (err) {
      setError(err.message);
      setConnecting(false);
    }
  };

  return (
    <div style={{ background: T.blueBg, color: T.blue, padding: "10px 20px", fontSize: 13, fontWeight: 600, textAlign: "center", display: "flex", justifyContent: "center", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
      <span>You have a placement! Connect Stripe to get paid on your 30/60/90-day payout schedule.</span>
      <button onClick={connect} disabled={connecting} style={{ background: T.blue, color: "#fff", border: "none", borderRadius: 999, padding: "5px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
        {connecting ? "Connecting…" : "Connect Stripe"}
      </button>
      {error && <span style={{ color: T.red }}>{error}</span>}
    </div>
  );
}

const isRejected = (c) => (c.status || "").toLowerCase() === "rejected";
const isPlaced = (c) => (c.status || "").toLowerCase() === "placed";
const isActive = (c) => !isRejected(c) && !isPlaced(c);

function money(v) {
  return v == null || v === "" ? "\u2014" : `$${Number(v).toLocaleString()}`;
}

function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function isRecent(iso, days = 7) {
  if (!iso) return false;
  return Date.now() - new Date(iso).getTime() < days * 24 * 60 * 60 * 1000;
}

function estimateEarnings(minSalary, maxSalary, commissionPct) {
  if (minSalary == null || maxSalary == null || commissionPct == null) return null;
  const pct = Number(commissionPct) / 100;
  const low = Number(minSalary) * pct;
  const high = Number(maxSalary) * pct;
  if (!isFinite(low) || !isFinite(high)) return null;
  return { low, high };
}

const COVER_GRADIENTS = [
  ["#cfeaf6", "#e8dcf7"],
  ["#ffe4d2", "#ffd3dd"],
  ["#d8f3e0", "#d3e9ff"],
  ["#fdecb2", "#f8cdd3"],
  ["#dde3ff", "#f2dbff"],
  ["#d4f1ea", "#eef8d2"],
];

function gradientFor(name) {
  const s = String(name || "?");
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return COVER_GRADIENTS[hash % COVER_GRADIENTS.length];
}

    case "heart":

    case "logout":

    case "dollar":

  const tones = {
    default: { bg: active ? T.ink : T.pillBg, fg: active ? "#fff" : T.ink },
    live: { bg: T.blueBg, fg: T.blue },
    rejected: { bg: T.redBg, fg: T.red },
    placed: { bg: T.greenBg, fg: T.green },
    gold: { bg: "#faf1e0", fg: "#a06a1d" },
  };
  const t = tones[tone] || tones.default;
  return (
    <span {...rest} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12.5, fontWeight: 600, padding: "5px 11px", borderRadius: 999, background: t.bg, color: muted ? T.faint : t.fg, whiteSpace: "nowrap", ...style }}>

}

function ReferAndEarn({ recruiter, session }) {
  const [code, setCode] = useState(recruiter.referral_code || null);
  const [stats, setStats] = useState(null);
  const [error, setError] = useState("");
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        let activeCode = recruiter.referral_code;
        if (!activeCode) {
          // Recruiter signed up before this feature existed -- give them a
          // code now, the first time they open this tab.
          activeCode = makeReferralCode(recruiter.contact_first_name);
          const { error: saveErr } = await supabaseClient
            .from("recruiters")
            .update({ referral_code: activeCode })
            .eq("id", recruiter.id);
          if (saveErr) throw new Error(saveErr.message);
        }
        if (cancelled) return;
        setCode(activeCode);
        const s = await fetchReferralStats(recruiter.id, activeCode);
        if (!cancelled) setStats(s);
      } catch (err) {
        if (!cancelled) setError(err.message);
      }
    })();
    return () => { cancelled = true; };
  }, [recruiter.id]);

  const link = code ? `https://makeplacement.com/?ref=${code}` : "";

  const copyLink = async () => {
    if (!link) return;
    try {
      await navigator.clipboard.writeText(link);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (_err) {
      // Clipboard access can be blocked (e.g. insecure context, permissions) --

  return (

      </div>

      {error && <div style={{ color: T.red, fontSize: 13, marginBottom: 16 }}>{error}</div>}

      <div style={sectionLabelStyle}>Your referral link</div>

        <PrimaryButton onClick={copyLink} style={{ flexShrink: 0 }}>{copied ? "Copied!" : "Copy link"}</PrimaryButton>

        </div>
        <div style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 18 }}>
          <div style={sectionLabelStyle}>Pending bonus</div>
          <div style={{ fontSize: 24, fontWeight: 700, color: T.sub }}>{stats ? money(stats.pending) : "—"}</div>
        </div>

          <div style={{ width: 28, height: 28, borderRadius: "50%", background: T.redBg, color: T.red, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>

// ---------- data ----------
async function getMyRecruiter(session) {
  const { data, error } = await supabaseClient.from("recruiters").select("*").eq("auth_user_id", session.user.id).maybeSingle();
  if (error) throw new Error(`Failed loading your profile: ${error.message}`);
  return data;
}

async function fetchLiveRoles() {
  const { data, error } = await supabaseClient.from("roles").select("*").eq("status", "live").order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  const roles = data || [];
  if (roles.length === 0) return roles;

  // A role isn't shown to Recruiters until its Employer has been
  // admin-approved -- otherwise an unverified/unvetted company could
  // start collecting candidates before anyone's checked them out.
  const companyIds = [...new Set(roles.map((r) => r.company_id))];
  const { data: companies, error: companyErr } = await supabaseClient
    .from("companies")
    .select("id, verified")
    .in("id", companyIds);
  if (companyErr) throw new Error(`Failed loading companies: ${companyErr.message}`);
  const verifiedIds = new Set((companies || []).filter((c) => c.verified).map((c) => c.id));
  return roles.filter((r) => verifiedIds.has(r.company_id));
}

async function fetchRolesByIds(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient.from("roles").select("*").in("id", roleIds);
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  return data || [];
}

async function fetchCompaniesByIds(companyIds) {
  if (companyIds.length === 0) return {};
  const { data, error } = await supabaseClient.from("companies").select("id, name, employee_count, city, state, contact_first_name, last_name").in("id", companyIds);
  if (error) throw new Error(`Failed loading companies: ${error.message}`);
  const map = {};
  (data || []).forEach((c) => (map[c.id] = c));
  return map;
}

function companyContactName(company) {
  if (!company) return "";
  return [company.contact_first_name, company.last_name].filter(Boolean).join(" ");
}

// "Jane Smith — Acme Inc" when we have a contact name, falling back to
// just the company name if no contact was ever collected.
function companyContactLabel(company) {
  if (!company) return "the company";
  const contact = companyContactName(company);
  if (contact && company.name) return `${contact} — ${company.name}`;
  return company.name || contact || "the company";
}

function companyLocation(company) {
  if (!company) return "";
  return [company.city, company.state].filter(Boolean).join(", ");
}

async function fetchRoleDetail(roleId) {
  const [stagesRes, qualitiesRes, traitsRes, referencesRes, questionsRes] = await Promise.all([
    supabaseClient.from("role_stages").select("*").eq("role_id", roleId).order("position"),
    supabaseClient.from("role_qualities").select("*").eq("role_id", roleId),
    supabaseClient.from("role_traits_to_avoid").select("*").eq("role_id", roleId),
    supabaseClient.from("role_candidate_references").select("*").eq("role_id", roleId),
    supabaseClient.from("role_questions").select("*").eq("role_id", roleId),
  ]);
  if (stagesRes.error) throw new Error(`Failed loading stages: ${stagesRes.error.message}`);
  if (qualitiesRes.error) throw new Error(`Failed loading qualities: ${qualitiesRes.error.message}`);
  if (traitsRes.error) throw new Error(`Failed loading traits: ${traitsRes.error.message}`);
  if (referencesRes.error) throw new Error(`Failed loading references: ${referencesRes.error.message}`);
  if (questionsRes.error) throw new Error(`Failed loading questions: ${questionsRes.error.message}`);
  return { stages: stagesRes.data || [], qualities: qualitiesRes.data || [], traits: traitsRes.data || [], references: referencesRes.data || [], questions: questionsRes.data || [] };
}

async function uploadResume(recruiterId, file) {
  const ext = (file.name.split(".").pop() || "pdf").toLowerCase();
  const path = `${recruiterId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error: uploadErr } = await supabaseClient.storage.from("resumes").upload(path, file);
  if (uploadErr) throw new Error(`Failed uploading resume: ${uploadErr.message}`);
  const { data } = supabaseClient.storage.from("resumes").getPublicUrl(path);
  return data.publicUrl;
}

async function submitCandidate(roleId, recruiterId, firstStageId, form, session) {
  const { data, error } = await supabaseClient.from("candidates").insert([
    { role_id: roleId, recruiter_id: recruiterId, name: form.name, email: form.email, linkedin: form.linkedin || null, resume_url: form.resumeUrl, notes: form.notes, stage_id: firstStageId || null, status: "pending_confirmation" },
  ]).select().single();
  if (error) throw new Error(`Failed submitting candidate: ${error.message}`);

  // The submission still exists even if this fails -- surface the error so
  // the recruiter knows to follow up rather than assuming the candidate
  // was emailed when they weren't.
  const res = await fetch(`${SUPABASE_URL}/functions/v1/send-candidate-confirmation`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`,
      apikey: SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ candidateId: data.id }),
  });
  const body = await res.json();
  if (!res.ok || !body.ok) {
    throw new Error(`Candidate was submitted, but the confirmation email failed to send: ${body.error || "unknown error"}. Contact support.`);
  }
}

// ---------- refer & earn ----------
// Same generator index.html uses for a brand-new signup -- kept here too
// so recruiters who signed up before this feature shipped can still get a
// code lazily, the first time they open this tab.
function makeReferralCode(firstName) {
  const base = (firstName || "recruiter").toLowerCase().replace(/[^a-z0-9]/g, "") || "recruiter";
  const suffix = Math.random().toString(36).slice(2, 6);
  return `${base}-${suffix}`;
}

async function fetchReferralStats(recruiterId, referralCode) {
  const [{ count: referredCount }, { data: bonuses, error: bonusErr }] = await Promise.all([
    supabaseClient.from("recruiters").select("id", { count: "exact", head: true }).eq("referred_by_code", referralCode),
    supabaseClient.from("referral_bonuses").select("amount, status").eq("referrer_id", recruiterId),
  ]);
  if (bonusErr) throw new Error(`Failed loading referral bonuses: ${bonusErr.message}`);
  const pending = (bonuses || []).filter((b) => b.status === "pending").reduce((sum, b) => sum + Number(b.amount), 0);
  const paid = (bonuses || []).filter((b) => b.status === "paid").reduce((sum, b) => sum + Number(b.amount), 0);
  return { referredCount: referredCount || 0, pending, paid };
}

      try {

      } catch (_err) {
        // Candidate requirements are a nice-to-have on this view -- a

            </div>

          {(location || (company && company.employee_count)) && (

// ---------- submit candidate form ----------
function SubmitCandidateForm({ role, firstStageId, recruiterId, onSubmitted, session }) {
  const [form, setForm] = useState({ name: "", email: "", linkedin: "", notes: "" });
  const [resumeFile, setResumeFile] = useState(null);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const set = (patch) => setForm((f) => ({ ...f, ...patch }));

  const validate = () => {
    const next = {};
    if (!form.name.trim()) next.name = "Required";
    if (!form.email.trim()) next.email = "Required";
    if (!resumeFile) next.resume = "Required";
    if (!form.notes.trim()) next.notes = "Required";
    setErrors(next);
    return Object.keys(next).length === 0;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!validate()) return;
    setSubmitting(true);
    setError("");
    try {
      const resumeUrl = await uploadResume(recruiterId, resumeFile);
      await submitCandidate(role.id, recruiterId, firstStageId, { ...form, resumeUrl }, session);
      setDone(true);
      onSubmitted && onSubmitted();
    } catch (err) {
      setError(err.message || "Something went wrong submitting this candidate.");
    } finally {
      setSubmitting(false);
    }
  };

  const fieldStyle = (key) => ({ ...inputStyle, ...(errors[key] ? { borderColor: T.red, marginBottom: 4 } : {}) });

  if (done) {
    return (
      <div style={{ padding: "4px 0" }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>Confirmation email sent</div>
        <div style={{ fontSize: 13, color: T.sub, marginBottom: 12 }}>We emailed {form.name} to confirm they're interested in {role.name}. Once they confirm, they'll be added to the pipeline.</div>
        <button onClick={() => { setForm({ name: "", email: "", linkedin: "", notes: "" }); setResumeFile(null); setErrors({}); setDone(false); }} style={{ fontSize: 13, color: T.ink, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", padding: 0, fontFamily: T.sans }}>
          Submit another candidate
        </button>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit} noValidate>
      <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Submit a candidate</div>

      <input style={fieldStyle("name")} placeholder="Candidate full name *" value={form.name} onChange={(e) => set({ name: e.target.value })} />
      {errors.name && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>Candidate name is required.</div>}

      <input style={fieldStyle("email")} placeholder="Email *" value={form.email} onChange={(e) => set({ email: e.target.value })} />
      {errors.email && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>Email is required.</div>}

      <input style={inputStyle} placeholder="linkedin.com/in/... (optional)" value={form.linkedin} onChange={(e) => set({ linkedin: e.target.value })} />

      <div style={{ marginBottom: errors.resume ? 4 : 12 }}>
        <label style={{ display: "flex", alignItems: "center", gap: 8, border: `1px dashed ${errors.resume ? T.red : T.line}`, borderRadius: 10, padding: "10px 13px", cursor: "pointer", fontSize: 13, color: resumeFile ? T.ink : T.faint, background: "#fff" }}>
          <Icon name="briefcase" size={14} />
          {resumeFile ? resumeFile.name : "Upload resume *"}
          <input type="file" accept=".pdf,.doc,.docx" style={{ display: "none" }} onChange={(e) => setResumeFile(e.target.files[0] || null)} />
        </label>
      </div>
      {errors.resume && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>A resume file is required.</div>}

      <textarea style={{ ...fieldStyle("notes"), minHeight: 70, resize: "vertical" }} placeholder="Why this candidate is a fit *" value={form.notes} onChange={(e) => set({ notes: e.target.value })} />
      {errors.notes && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>Tell the company why this candidate is a fit.</div>}

      {error && <div style={{ color: T.red, fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
      <PrimaryButton type="submit" disabled={submitting} style={{ width: "100%" }}>{submitting ? "Submitting\u2026" : "Submit candidate"}</PrimaryButton>
    </form>
  );
}

// ---------- browse roles ----------
function BrowseRoles({ recruiterId, session, appliedRoleIds, onApplied, readOnly }) {
  const [roles, setRoles] = useState([]);
  const [companyMap, setCompanyMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [detailRoleId, setDetailRoleId] = useState(null);
  const [savedSet, setSavedSet] = useState(() => new Set());

  const [query, setQuery] = useState("");
  const [minSalary, setMinSalary] = useState("");
  const [activeFilters, setActiveFilters] = useState(() => new Set());

  useEffect(() => {
    (async () => {
      try {
        const r = await fetchLiveRoles();
        setRoles(r);
        setCompanyMap(await fetchCompaniesByIds([...new Set(r.map((x) => x.company_id))]));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const toggleFilter = (key) => setActiveFilters((prev) => { const next = new Set(prev); next.has(key) ? next.delete(key) : next.add(key); return next; });
  const toggleSave = (roleId) => setSavedSet((prev) => { const next = new Set(prev); next.has(roleId) ? next.delete(roleId) : next.add(roleId); return next; });
  const clearAll = () => { setQuery(""); setMinSalary(""); setActiveFilters(new Set()); };
  const hasActiveFilters = query !== "" || minSalary !== "" || activeFilters.size > 0;

  let visible = roles.filter((r) => {
    if (appliedRoleIds.has(r.id)) return false;
    if (query) {
      const q = query.toLowerCase();
      const hay = `${r.name} ${r.description || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (minSalary && Number(r.max_salary || 0) < Number(minSalary)) return false;
    if (activeFilters.has("new") && !isRecent(r.created_at)) return false;
    // "responsive" has no dedicated signal yet -- pre-application, a
    // recruiter can't see a company's messaging history with anyone else,
    // so there's nothing real to filter on. Clickable, not a fake filter.
    return true;
  });
  if (activeFilters.has("highestPaying")) visible = [...visible].sort((a, b) => (b.max_salary || 0) - (a.max_salary || 0));

  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"loading roles\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  const detailRole = detailRoleId ? roles.find((r) => r.id === detailRoleId) : null;

  return (
    <div>
      <FilterPillsRow active={activeFilters} onToggle={toggleFilter} />
      <SearchFilterBar query={query} setQuery={setQuery} count={visible.length} minSalary={minSalary} setMinSalary={setMinSalary} onClear={clearAll} hasActiveFilters={hasActiveFilters} />

      <div style={{ marginTop: 22, marginBottom: 16 }}>
        <div style={{ fontSize: 20, fontWeight: 700, color: T.ink }}>Live roles</div>
        <div style={{ fontSize: 13.5, color: T.sub, marginTop: 2 }}>Open roles from companies hiring on makeplacement.</div>
      </div>

      {visible.length === 0 ? (
        <EmptyState
          icon="briefcase"
          title={roles.length === 0 ? "No live roles right now" : "No roles match your filters"}
          body={roles.length === 0 ? "Check back soon \u2014 new roles show up here as clients post them." : "Try a different search term or clear your filters."}
          actions={hasActiveFilters ? <SecondaryButton onClick={clearAll}>Clear filters</SecondaryButton> : null}
        />
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(255px, 1fr))", gap: 16 }}>
          {visible.map((role) => (
            <RoleCard
              key={role.id}
              role={role}
              company={companyMap[role.company_id]}
              onOpen={() => setDetailRoleId(role.id)}
              saved={savedSet.has(role.id)}
              onToggleSave={() => toggleSave(role.id)}
              applied={appliedRoleIds.has(role.id)}
              readOnly={readOnly}
            />
          ))}
        </div>
      )}

      {detailRole && (
        <RoleDetailModal
          role={detailRole}
          company={companyMap[detailRole.company_id]}
          applied={appliedRoleIds.has(detailRole.id)}
          onApply={async () => { await applyToRole(recruiterId, detailRole.id); onApplied(detailRole, companyMap[detailRole.company_id]); setDetailRoleId(null); }}
          onClose={() => setDetailRoleId(null)}
          readOnly={readOnly}
        />
      )}
    </div>
  );
}

        </div>
      ))}
    </div>

function MessageComposer({ onSend, placeholder, buttonLabel = "Send" }) {
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [justSent, setJustSent] = useState(false);
  const [error, setError] = useState("");
  const handleSend = async () => {
    if (!text.trim()) return;
    setSending(true);
    setError("");
    try {
      await onSend(text.trim());
      setText("");
      setJustSent(true);
      setTimeout(() => setJustSent(false), 2200);
    } catch (err) {
      setError(err.message || "Failed to send.");
    } finally {
      setSending(false);
    }
  };
  return (
    <div>
      <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder={placeholder} style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} />
      {error && <div style={{ color: T.red, fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <PrimaryButton onClick={handleSend} disabled={sending || !text.trim()}>{sending ? "Sending\u2026" : buttonLabel}</PrimaryButton>
        {justSent && (
          <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12.5, fontWeight: 600, color: T.green }}>
            <Icon name="check" size={13} /> Sent
          </span>
        )}
      </div>
    </div>
  );
}

const isPendingConfirmation = (c) => (c.status || "").toLowerCase() === "pending_confirmation";

function CandidatePillTone(c) {
  if (isPlaced(c)) return "placed";
  if (isRejected(c)) return "rejected";
  if (isPendingConfirmation(c)) return "gold";
  return "live";
}

function RoleWorkspace({ role, company, recruiterId, session, onBack, onOpenWelcome, readOnly }) {
  const companyName = (company && company.name) || "Company";
  const contactName = companyContactName(company);
  const location = companyLocation(company);
  const earnings = estimateEarnings(role.min_salary, role.max_salary, role.commission_pct);
  const [detail, setDetail] = useState(null);
  const [candidates, setCandidates] = useState([]);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  const load = async () => {
    try {
      const [d, cands, roleMsgs] = await Promise.all([
        fetchRoleDetail(role.id),
        fetchMyCandidatesForRole(role.id, recruiterId),
        fetchMessagesForRoles([role.id]),
      ]);
      setDetail(d);
      setCandidates(cands);
      const myCandidateIds = new Set(cands.map((c) => c.id));
      setMessages(roleMsgs.filter((m) => (
        (m.recruiter_id === recruiterId && !m.candidate_id) ||
        (m.candidate_id && myCandidateIds.has(m.candidate_id)) ||
        (!m.candidate_id && !m.recruiter_id)
      )));
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { setLoading(true); load(); }, [role.id]);

  useEffect(() => {
    const channel = supabaseClient
      .channel(`role-workspace-${role.id}-${recruiterId}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "candidates", filter: `role_id=eq.${role.id}` }, (payload) => {
        const row = payload.new || payload.old;
        if (row && row.recruiter_id === recruiterId) load();
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "messages", filter: `role_id=eq.${role.id}` }, () => load())
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [role.id, recruiterId]);

  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"Loading role\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  const stageMap = {};
  (detail.stages || []).forEach((s) => (stageMap[s.id] = s.name));
  const broadcasts = messages.filter((m) => !m.candidate_id && !m.recruiter_id);
  const directMessages = messages.filter((m) => m.recruiter_id === recruiterId && !m.candidate_id);

function MyRoles({ recruiterId, session, appliedRoleIds, onBrowse, focusRoleId, onFocusRole, onOpenWelcome, readOnly }) {
  const [roles, setRoles] = useState([]);
  const [companyMap, setCompanyMap] = useState({});
  const [candidates, setCandidates] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [view, setView] = useState("list");

  const roleIds = [...appliedRoleIds];

  const loadAll = async () => {
    setLoading(true);
    try {
      const [r, cands] = await Promise.all([fetchRolesByIds(roleIds), fetchMyCandidates(recruiterId)]);
      setRoles(r);
      setCompanyMap(await fetchCompaniesByIds([...new Set(r.map((x) => x.company_id))]));
      setCandidates(cands);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadAll(); }, [appliedRoleIds.size]);

  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"loading your roles\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  const focusedRole = roles.find((r) => r.id === focusRoleId);
  if (focusedRole) {
    return <RoleWorkspace role={focusedRole} company={companyMap[focusedRole.company_id]} recruiterId={recruiterId} session={session} onBack={() => onFocusRole(null)} onOpenWelcome={onOpenWelcome} readOnly={readOnly} />;

  const candidatesByRole = {};
  candidates.forEach((c) => { (candidatesByRole[c.role_id] = candidatesByRole[c.role_id] || []).push(c); });

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>

          <div style={{ fontSize: 20, fontWeight: 700, color: T.ink }}>My roles</div>

// ---------- all candidates ----------
function CandidatesTab({ recruiterId, session, readOnly }) {
  const [candidates, setCandidates] = useState([]);
  const [roleMap, setRoleMap] = useState({});
  const [companyMap, setCompanyMap] = useState({});
  const [stageMap, setStageMap] = useState({});
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");

  const load = async () => {
    try {
      const cands = await fetchMyCandidates(recruiterId);
      setCandidates(cands);
      const roleIds = [...new Set(cands.map((c) => c.role_id))];
      const [roles, msgs, stages] = await Promise.all([
        fetchRolesByIds(roleIds),
        fetchMessagesForRoles(roleIds),
        fetchStagesForRoles(roleIds),
      ]);
      const rMap = {}; roles.forEach((r) => (rMap[r.id] = r));
      setRoleMap(rMap);
      setCompanyMap(await fetchCompaniesByIds([...new Set(roles.map((r) => r.company_id))]));
      const sMap = {}; stages.forEach((s) => (sMap[s.id] = s.name));
      setStageMap(sMap);
      const myCandidateIds = new Set(cands.map((c) => c.id));
      setMessages(msgs.filter((m) => m.candidate_id && myCandidateIds.has(m.candidate_id)));
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { load(); }, [recruiterId]);

  useEffect(() => {
    const channel = supabaseClient
      .channel(`all-candidates-${recruiterId}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "candidates", filter: `recruiter_id=eq.${recruiterId}` }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => load())
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [recruiterId]);

  const messagesForCandidate = (candidateId) => messages.filter((m) => m.candidate_id === candidateId);

  const STATUS_FILTERS = [
    { key: "all", label: "All" },
    { key: "active", label: "Interviewing", test: isActive },
    { key: "placed", label: "Placed", test: isPlaced },
    { key: "rejected", label: "Rejected", test: isRejected },
  ];

  let visible = candidates;
  if (statusFilter !== "all") {
    const f = STATUS_FILTERS.find((s) => s.key === statusFilter);
    visible = visible.filter(f.test);
  }
  if (query) {
    const q = query.toLowerCase();
    visible = visible.filter((c) => {
      const role = roleMap[c.role_id];
      const company = role ? companyMap[role.company_id] : null;
      const hay = `${c.name} ${role ? role.name : ""} ${company ? company.name : ""}`.toLowerCase();
      return hay.includes(q);
    });
  }
  visible = [...visible].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"Loading your candidates…"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  return (
    <div>
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 20, fontWeight: 700, color: T.ink }}>Candidates</div>
        <div style={{ fontSize: 13.5, color: T.sub, marginTop: 2 }}>Every candidate you've submitted, across every role, with all notes and updates in one place.</div>
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        {STATUS_FILTERS.map((f) => (
          <Pill key={f.key} active={statusFilter === f.key} style={{ cursor: "pointer" }} onClick={() => setStatusFilter(f.key)}>
            {f.label}
          </Pill>
        ))}
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 8, background: T.pillBg, borderRadius: 10, padding: "8px 12px", marginBottom: 20, maxWidth: 360 }}>
        <Icon name="search" size={14} />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search by candidate, role, or company" style={{ border: "none", outline: "none", background: "none", fontSize: 13.5, flex: 1, fontFamily: T.sans, color: T.ink }} />
      </div>

      {visible.length === 0 ? (
        <EmptyState
          icon="briefcase"
          title={candidates.length === 0 ? "No candidates submitted yet" : "No candidates match"}
          body={candidates.length === 0 ? "Once you submit candidates to roles, they'll all show up here." : "Try a different search or filter."}
        />
      ) : (
        visible.map((c) => {
          const role = roleMap[c.role_id];
          const company = role ? companyMap[role.company_id] : null;
          return (
            <MyCandidateCard
              key={c.id}
              candidate={c}
              roleName={role ? `${role.name} · ${(company && company.name) || ""}` : ""}
              stageName={stageMap[c.stage_id]}
              feedbackMessages={messagesForCandidate(c.id)}
              onSendFeedback={readOnly ? null : async (body) => { await sendRecruiterMessage(session, recruiterId, c.role_id, c.id, null, body); await load(); }}
              companyLabel={companyContactLabel(company)}
            />
          );
        })
      )}
    </div>
  );
}

// ---------- messages inbox ----------
function RecruiterInbox({ session, recruiterId, appliedRoleIds, readOnly }) {
  const [roles, setRoles] = useState([]);
  const [companyMap, setCompanyMap] = useState({});
  const [candidates, setCandidates] = useState([]);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [expandedKey, setExpandedKey] = useState(null);

  const roleIds = [...appliedRoleIds];

  const loadAll = async () => {
    if (roleIds.length === 0) { setLoading(false); return; }
    try {
      const [r, cands, allMsgs] = await Promise.all([fetchRolesByIds(roleIds), fetchMyCandidates(recruiterId), fetchMessagesForRoles(roleIds)]);
      setRoles(r);
      setCompanyMap(await fetchCompaniesByIds([...new Set(r.map((x) => x.company_id))]));
      setCandidates(cands);
      const myCandidateIds = new Set(cands.map((c) => c.id));
      const relevant = allMsgs.filter((m) => (
        m.recruiter_id === recruiterId ||
        (m.candidate_id && myCandidateIds.has(m.candidate_id)) ||
        (!m.candidate_id && !m.recruiter_id)
      ));
      setMessages(relevant);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadAll(); }, [appliedRoleIds.size]);

  useEffect(() => {
    if (roleIds.length === 0) return;
    const channel = supabaseClient
      .channel(`recruiter-inbox-${recruiterId}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, (payload) => {
        const row = payload.new || payload.old;
        if (row && roleIds.includes(row.role_id)) loadAll();
      })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [appliedRoleIds.size, recruiterId]);

  const roleById = {};
  roles.forEach((r) => (roleById[r.id] = r));
  const candidateById = {};
  candidates.forEach((c) => (candidateById[c.id] = c));

  const threads = {};
  messages.forEach((m) => {
    const key = `${m.role_id}:${m.candidate_id || ""}:${m.recruiter_id || ""}`;
    if (!threads[key]) threads[key] = { key, role_id: m.role_id, candidate_id: m.candidate_id, recruiter_id: m.recruiter_id, messages: [] };
    threads[key].messages.push(m);
  });
  const threadList = Object.values(threads).sort((a, b) => new Date(b.messages[b.messages.length - 1].created_at) - new Date(a.messages[a.messages.length - 1].created_at));

  const threadLabel = (t) => {
    const role = roleById[t.role_id];
    const companyName = (role && companyMap[role.company_id] && companyMap[role.company_id].name) || "the company";
    if (t.candidate_id) {
      const c = candidateById[t.candidate_id];
      return c ? `${c.name} \u2014 notes from ${companyName}` : `Candidate notes from ${companyName}`;
    }
    if (t.recruiter_id) return `Direct from ${companyName}`;
    return `Bench update from ${companyName}`;
  };

  const send = async (roleId, candidateId, recruiterTargetId, body) => {
    await sendRecruiterMessage(session, recruiterId, roleId, candidateId, recruiterTargetId, body);
    await loadAll();
  };

  if (roleIds.length === 0) {
    return <EmptyState icon="mail" title="No messages yet" body="Apply to a role to start hearing from the companies you're working with." />;
  }
  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"Loading messages\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  return (
    <div>
      <div style={{ fontSize: 20, fontWeight: 700, color: T.ink, marginBottom: 4 }}>Messages</div>
      <div style={{ fontSize: 13.5, color: T.sub, marginBottom: 22 }}>Everything sent to you about your candidates and roles, updating live.</div>

      {threadList.length === 0 ? (
        <EmptyState icon="mail" title="No messages yet" body="When a company sends feedback or an update, it'll show up here right away." />
      ) : (
        threadList.map((t) => {
          const role = roleById[t.role_id];
          const open = expandedKey === t.key;
          const last = t.messages[t.messages.length - 1];
          return (
            <div key={t.key} style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 16, marginBottom: 12 }}>
              <div onClick={() => setExpandedKey(open ? null : t.key)} style={{ cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: T.ink }}>{threadLabel(t)}</div>
                  <div style={{ fontSize: 12, color: T.sub, marginTop: 2 }}>{role ? `${role.name} \u00b7 ${(companyMap[role.company_id] && companyMap[role.company_id].name) || ""}` : "Role"}</div>
                  {!open && <div style={{ fontSize: 12.5, color: T.sub, marginTop: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{last.body}</div>}
                </div>
                <div style={{ fontSize: 11, color: T.faint, whiteSpace: "nowrap" }}>{formatWhen(last.created_at)}</div>
              </div>
              {open && (
                <div style={{ marginTop: 14, borderTop: `1px solid ${T.lineSoft}`, paddingTop: 14 }}>
                  <MessageFeed messages={t.messages} emptyLabel="" companyLabel={companyContactLabel(role && companyMap[role.company_id])} />
                  {!readOnly && (
                    <div style={{ marginTop: 10 }}>
                      <MessageComposer onSend={(body) => send(t.role_id, t.candidate_id, t.recruiter_id, body)} placeholder="Reply\u2026" buttonLabel="Reply" />
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

function SetPasswordModal({ onCancel, onSaved }) {
  const [value, setValue] = useState("");
  const [confirm, setConfirm] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (value.length < 8) { setError("Must be at least 8 characters."); return; }
    if (value !== confirm) { setError("Passwords don't match."); return; }
    setSaving(true);
    setError("");
    try {
      const { error: err } = await supabaseClient.auth.updateUser({ password: value, data: { password_set: true } });
      if (err) throw err;
      onSaved();
    } catch (err) {
      setError(err.message || "Something went wrong saving your password.");
      setSaving(false);
    }
  };

  return (
    <Modal onClose={onCancel} width={420}>
      <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 6, color: T.ink }}>Set a password</div>
      <div style={{ fontSize: 13.5, color: T.sub, marginBottom: 18, lineHeight: 1.5 }}>
        You're signed in with an email link. Add a password so you can log in that way too — your saved profile and data stay exactly as they are either way.
      </div>
      <input type="password" autoFocus value={value} onChange={(e) => setValue(e.target.value)} placeholder="New password" style={{ ...inputStyle, marginBottom: 10 }} />
      <input type="password" value={confirm} onChange={(e) => setConfirm(e.target.value)} placeholder="Confirm password" style={inputStyle} />
      {error && <div style={{ color: T.red, fontSize: 12.5, marginTop: 10 }}>{error}</div>}
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 18 }}>
        <SecondaryButton onClick={onCancel} disabled={saving}>Not now</SecondaryButton>
        <PrimaryButton onClick={submit} disabled={saving}>{saving ? "Saving…" : "Save password"}</PrimaryButton>
      </div>
    </Modal>
  );
}

function RecruiterDashboard() {
  const [session, setSession] = useState(undefined);
  const [recruiter, setRecruiter] = useState(null);
  const [tab, setTab] = useState("browse");
  const [appliedRoleIds, setAppliedRoleIds] = useState(() => new Set());
  const [focusRoleId, setFocusRoleId] = useState(null);
  const [welcomeModal, setWelcomeModal] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [adminViewMode, setAdminViewMode] = useState(false);
  const [hasPassword, setHasPassword] = useState(true);
  const [pwBannerDismissed, setPwBannerDismissed] = useState(true);
  const [showPasswordModal, setShowPasswordModal] = useState(false);

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { window.location.href = LOGIN_URL; return; }
      setSession(session);
      setHasPassword(!!(session.user.user_metadata && session.user.user_metadata.password_set));
      setPwBannerDismissed(localStorage.getItem(`mp_pw_banner_dismissed_${session.user.id}`) === "1");
      try {
        const params = new URLSearchParams(window.location.search);
        const viewRecruiterId = params.get("admin_view_recruiter");

        let r = null;
        if (viewRecruiterId) {
          const { data: adminRow } = await supabaseClient.from("admins").select("id").ilike("email", session.user.email).maybeSingle();
          if (adminRow) {
            const { data: viewedRecruiter, error: viewErr } = await supabaseClient.from("recruiters").select("*").eq("id", viewRecruiterId).maybeSingle();
            if (viewErr || !viewedRecruiter) { setError("Could not load that recruiter."); setLoading(false); return; }
            r = viewedRecruiter;
            setAdminViewMode(true);
          }
        }
        if (!r) r = await getMyRecruiter(session);
        if (!r) { window.location.href = LOGIN_URL; return; }
        setRecruiter(r);
        const apps = await fetchMyApplications(r.id);
        setAppliedRoleIds(new Set(apps.map((a) => a.role_id)));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    });
  }, []);

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    window.location.href = LOGIN_URL;
  };

  const dismissPwBanner = () => {
    if (session) localStorage.setItem(`mp_pw_banner_dismissed_${session.user.id}`, "1");
    setPwBannerDismissed(true);
  };

  const handleApplied = (role, company) => {
    setAppliedRoleIds((prev) => new Set([...prev, role.id]));
    setFocusRoleId(role.id);
    setTab("myroles");
    setWelcomeModal({ role, company });
  };

  const [notifItems, setNotifItems] = useState([]);
  const [notifSeenAt, setNotifSeenAt] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [bellPulse, setBellPulse] = useState(false);
  const notifKey = recruiter ? `mp_notif_seen_recruiter_${recruiter.id}` : null;

  const dismissToast = (id) => setToasts((prev) => prev.filter((t) => t.id !== id));

  const pushToast = (text) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((prev) => [...prev, { id, text }]);
    setBellPulse(true);
    setTimeout(() => setBellPulse(false), 900);
    setTimeout(() => dismissToast(id), 8000);
  };

  useEffect(() => {
    if (!notifKey) return;
    const stored = localStorage.getItem(notifKey);
    if (stored) {
      setNotifSeenAt(stored);
    } else {
      const now = new Date().toISOString();
      localStorage.setItem(notifKey, now);
      setNotifSeenAt(now);
    }
  }, [notifKey]);

  const loadNotifications = async () => {
    if (!recruiter || appliedRoleIds.size === 0) { setNotifItems([]); return; }
    const roleIds = [...appliedRoleIds];
    try {
      const [roleList, allMsgs, myCandidates] = await Promise.all([
        fetchRolesByIds(roleIds),
        fetchMessagesForRoles(roleIds),
        fetchMyCandidates(recruiter.id),
      ]);
      const roleById = {};
      roleList.forEach((r) => (roleById[r.id] = r));
      const myCandidateIds = new Set(myCandidates.map((c) => c.id));
      const relevantMsgs = allMsgs.filter((m) => (
        m.sender_type !== "recruiter" && (
          m.recruiter_id === recruiter.id ||
          (m.candidate_id && myCandidateIds.has(m.candidate_id)) ||
          (!m.candidate_id && !m.recruiter_id)
        )
      ));
      const updatedCandidates = myCandidates.filter((c) => c.updated_at && new Date(c.updated_at) - new Date(c.created_at) > 1000);

      const items = [
        ...relevantMsgs.map((m) => ({
          key: `msg-${m.id}`,
          time: m.created_at,
          text: m.candidate_id ? `New note on a candidate for ${roleById[m.role_id] ? roleById[m.role_id].name : "a role"}` : `New message on ${roleById[m.role_id] ? roleById[m.role_id].name : "a role"}`,
          roleId: m.role_id,
          kind: "message",
        })),
        ...updatedCandidates.map((c) => ({
          key: `cand-${c.id}`,
          time: c.updated_at,
          text: `Update on ${c.name} \u2014 ${roleById[c.role_id] ? roleById[c.role_id].name : "your submission"}`,
          roleId: c.role_id,
          kind: "candidate",
        })),
      ].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 25);
      setNotifItems(items);
    } catch (err) {
      // best-effort
    }
  };

  useEffect(() => {
    if (!recruiter || appliedRoleIds.size === 0) return;
    loadNotifications();
    const roleIds = [...appliedRoleIds];
    const channel = supabaseClient
      .channel(`recruiter-notifications-${recruiter.id}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
        const row = payload.new;
        if (row && appliedRoleIds.has(row.role_id) && row.sender_type !== "recruiter") {
          loadNotifications();
          pushToast(row.sender_type === "admin" ? "New message from Akash (admin)" : "New message from a company");
        }
      })
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "candidates", filter: `recruiter_id=eq.${recruiter.id}` }, (payload) => {
        loadNotifications();
        if (payload.new) pushToast(`Update on ${payload.new.name}`);
      })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [recruiter && recruiter.id, appliedRoleIds.size]);

  const markNotifsRead = () => {
    if (!notifKey) return;
    const now = new Date().toISOString();
    localStorage.setItem(notifKey, now);
    setNotifSeenAt(now);
  };

  const notifUnreadCount = notifSeenAt ? notifItems.filter((n) => new Date(n.time) > new Date(notifSeenAt)).length : notifItems.length;

  const goToNotification = (item) => {
    if (item.kind === "message") { setTab("messages"); return; }
    setTab("myroles");
    setFocusRoleId(item.roleId);
  };

  if (session === undefined || loading) return <div style={pageWrap}><div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.sub, fontSize: 13 }}>{"loading\u2026"}</div></div>;
  if (error) return <div style={pageWrap}><div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.red }}>{error}</div></div>;
  if (!recruiter.verified && !adminViewMode) {
    return (
      <div style={pageWrap}>
        <div style={{ maxWidth: 440, margin: "160px auto", textAlign: "center", padding: "0 24px" }}>
          <div style={{ fontSize: 34, marginBottom: 16 }}>{"\u23f3"}</div>
          <div style={{ fontSize: 19, fontWeight: 700, color: T.ink, marginBottom: 10 }}>You'll be reviewed by an admin shortly</div>
          <div style={{ fontSize: 14, color: T.sub, lineHeight: 1.6, marginBottom: 24 }}>
            Your account is pending approval. We'll email you the moment you're approved, and you'll be able to access your dashboard then.
          </div>
          <GhostButton onClick={handleLogout}>Log out</GhostButton>
        </div>
      </div>
    );
  }

  return (
    <div style={pageWrap}>
      {adminViewMode && (
        <div style={{ background: T.ink, color: "#fff", padding: "10px 20px", fontSize: 13, display: "flex", justifyContent: "center", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <span>Admin view — viewing as {recruiter.firm_name || [recruiter.contact_first_name, recruiter.last_name].filter(Boolean).join(" ") || "this recruiter"} (read-only)</span>
          <a href="admin.html" style={{ color: "#fff", textDecoration: "underline" }}>Exit to admin</a>
        </div>
      )}
      {!recruiter.verified && (
        <div style={{ background: "#faf1e0", color: "#a06a1d", padding: "10px 20px", fontSize: 13, fontWeight: 600, textAlign: "center" }}>
          This profile is pending admin review — the recruiter themselves can't access this dashboard until you approve them.
        </div>
      )}
      {!hasPassword && !pwBannerDismissed && (
        <div style={{ background: "#faf1e0", color: T.ink, padding: "10px 20px", fontSize: 13, display: "flex", justifyContent: "center", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
          <span>You're signed in with an email link and don't have a password yet.</span>
          <a onClick={() => setShowPasswordModal(true)} style={{ cursor: "pointer", textDecoration: "underline", fontWeight: 600, color: "inherit" }}>Set a password</a>
          <a onClick={dismissPwBanner} style={{ cursor: "pointer", textDecoration: "underline", color: "inherit" }}>Dismiss</a>
        </div>
      )}
      <StripeConnectBanner recruiter={recruiter} session={session} />
      <TopNav
        tab={tab}
        onTabChange={(t) => { setTab(t); if (t !== "myroles") setFocusRoleId(null); }}
        recruiter={recruiter}
        onLogout={handleLogout}
        notifications={notifItems}
        notifUnread={notifUnreadCount}
        onMarkNotifsRead={markNotifsRead}
        onSelectNotification={goToNotification}
        bellPulse={bellPulse}
      />
      <div style={{ maxWidth: 1320, margin: "0 auto", padding: "32px 28px 100px" }}>
        {tab === "browse" && <BrowseRoles recruiterId={recruiter.id} session={session} appliedRoleIds={appliedRoleIds} onApplied={handleApplied} readOnly={adminViewMode} />}
        {tab === "myroles" && <MyRoles recruiterId={recruiter.id} session={session} appliedRoleIds={appliedRoleIds} onBrowse={() => setTab("browse")} focusRoleId={focusRoleId} onFocusRole={setFocusRoleId} onOpenWelcome={(role, company) => setWelcomeModal({ role, company })} readOnly={adminViewMode} />}
        {tab === "candidates" && <CandidatesTab recruiterId={recruiter.id} session={session} readOnly={adminViewMode} />}
        {tab === "messages" && <RecruiterInbox session={session} recruiterId={recruiter.id} appliedRoleIds={appliedRoleIds} readOnly={adminViewMode} />}
        {tab === "refer" && <ReferAndEarn recruiter={recruiter} session={session} />}
      </div>
      <ToastStack toasts={toasts} onDismiss={dismissToast} />
      {welcomeModal && <WelcomeModal role={welcomeModal.role} company={welcomeModal.company} onClose={() => setWelcomeModal(null)} />}
      {showPasswordModal && (
        <SetPasswordModal
          onCancel={() => setShowPasswordModal(false)}
          onSaved={() => { setHasPassword(true); setShowPasswordModal(false); }}
        />
      )}
    </div>
  );
}

const pageWrap = { minHeight: "100vh", background: "#fff", fontFamily: T.sans, color: T.ink };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RecruiterDashboard />);
  </script>
</body>
</html>
