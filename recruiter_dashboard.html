<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | MakePlacement</title>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    ::selection { background: #111214; color: #fff; }
    button, input, textarea, select { font-family: inherit; }

    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid #3b6fe0;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    @media (max-width: 900px) {
      .mp-nav-secondary { display: none; }
      .mp-nav-search { display: none; }
    }
    @media (max-width: 640px) {
      .mp-filter-pills { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .mp-filter-chips { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }

    @keyframes mpBellPulse { 0% { transform: scale(1); } 30% { transform: scale(1.3); } 60% { transform: scale(0.92); } 100% { transform: scale(1); } }
    .mp-bell-pulse { animation: mpBellPulse 0.6s ease; }

    #boot-error {
      display: none;
      max-width: 760px;
      margin: 48px auto;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      color: #111;
    }
    #boot-error pre {
      white-space: pre-wrap;
      background: #f7f7f7;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error">
    <h2>We couldn't load the dashboard.</h2>
    <p>Please refresh the page. If the problem continues, contact support.</p>
    <pre id="boot-error-detail"></pre>
  </div>

  <script>
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) window.location.reload();
    });
    window.addEventListener("error", function (event) {
      const box = document.getElementById("boot-error");
      const detail = document.getElementById("boot-error-detail");
      if (box && detail && !document.getElementById("root").hasChildNodes()) {
        box.style.display = "block";
        detail.textContent = event.error ? (event.error.stack || event.error.message) : event.message;
      }
    });
  </script>

const PLATFORM_FEE_PCT = 0.25;
const RECRUITER_SHARE_PCT = 0.70;
const COMMISSION_PCT = PLATFORM_FEE_PCT * RECRUITER_SHARE_PCT; // 0.175

const isRejected = (c) => (c.status || "").toLowerCase() === "rejected";
const isPlaced = (c) => (c.status || "").toLowerCase() === "placed";
const isActive = (c) => !isRejected(c) && !isPlaced(c);

function money(v) {
  return v == null || v === "" ? "\u2014" : `$${Number(v).toLocaleString()}`;
}

function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function isRecent(iso, days = 7) {
  if (!iso) return false;
  return Date.now() - new Date(iso).getTime() < days * 24 * 60 * 60 * 1000;
}

function estimateEarnings(minSalary, maxSalary) {
  if (minSalary == null || maxSalary == null) return null;
  const low = Number(minSalary) * COMMISSION_PCT;
  const high = Number(maxSalary) * COMMISSION_PCT;
  if (!isFinite(low) || !isFinite(high)) return null;
  return { low, high };
}

const COVER_GRADIENTS = [
  ["#cfeaf6", "#e8dcf7"],
  ["#ffe4d2", "#ffd3dd"],
  ["#d8f3e0", "#d3e9ff"],
  ["#fdecb2", "#f8cdd3"],
  ["#dde3ff", "#f2dbff"],
  ["#d4f1ea", "#eef8d2"],
];

function gradientFor(name) {
  const s = String(name || "?");
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return COVER_GRADIENTS[hash % COVER_GRADIENTS.length];
}

    case "heart":

    case "briefcase":

    case "chevronDown":

    case "shield":

    case "logout":

    case "dollar":

// ---------- small building blocks ----------
function Pill({ children, active, muted, tone, style, ...rest }) {
  const tones = {
    default: { bg: active ? T.ink : T.pillBg, fg: active ? "#fff" : T.ink },
    live: { bg: T.blueBg, fg: T.blue },
    rejected: { bg: T.redBg, fg: T.red },
    placed: { bg: T.greenBg, fg: T.green },
  };
  const t = tones[tone] || tones.default;
  return (
    <span {...rest} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12.5, fontWeight: 600, padding: "5px 11px", borderRadius: 999, background: t.bg, color: muted ? T.faint : t.fg, whiteSpace: "nowrap", ...style }}>
      {children}
    </span>
  );
}

// ---------- data ----------
async function getMyRecruiter(session) {
  const { data, error } = await supabaseClient.from("recruiters").select("*").eq("auth_user_id", session.user.id).maybeSingle();
  if (error) throw new Error(`Failed loading your profile: ${error.message}`);
  return data;
}

async function fetchLiveRoles() {
  const { data, error } = await supabaseClient.from("roles").select("*").eq("status", "live").order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  return data || [];
}

async function fetchRolesByIds(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient.from("roles").select("*").in("id", roleIds);
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  return data || [];
}

async function fetchCompaniesByIds(companyIds) {
  if (companyIds.length === 0) return {};
  const { data, error } = await supabaseClient.from("companies").select("id, name").in("id", companyIds);
  if (error) throw new Error(`Failed loading companies: ${error.message}`);
  const map = {};
  (data || []).forEach((c) => (map[c.id] = c.name));
  return map;
}

async function fetchInterviewingCounts(roleIds) {
  if (roleIds.length === 0) return {};
  const { data, error } = await supabaseClient.from("candidates").select("role_id, status").in("role_id", roleIds);
  if (error) throw new Error(`Failed loading candidate counts: ${error.message}`);
  const counts = {};
  roleIds.forEach((id) => (counts[id] = 0));
  (data || []).forEach((c) => { if (isActive(c)) counts[c.role_id] = (counts[c.role_id] || 0) + 1; });
  return counts;
}

async function fetchRoleDetail(roleId) {
  const [stagesRes, qualitiesRes, traitsRes, referencesRes] = await Promise.all([
    supabaseClient.from("role_stages").select("*").eq("role_id", roleId).order("position"),
    supabaseClient.from("role_qualities").select("*").eq("role_id", roleId),
    supabaseClient.from("role_traits_to_avoid").select("*").eq("role_id", roleId),
    supabaseClient.from("role_candidate_references").select("*").eq("role_id", roleId),
  ]);
  if (stagesRes.error) throw new Error(`Failed loading stages: ${stagesRes.error.message}`);
  if (qualitiesRes.error) throw new Error(`Failed loading qualities: ${qualitiesRes.error.message}`);
  if (traitsRes.error) throw new Error(`Failed loading traits: ${traitsRes.error.message}`);
  if (referencesRes.error) throw new Error(`Failed loading references: ${referencesRes.error.message}`);
  return { stages: stagesRes.data || [], qualities: qualitiesRes.data || [], traits: traitsRes.data || [], references: referencesRes.data || [] };
}

async function fetchMyApplications(recruiterId) {
  const { data, error } = await supabaseClient.from("role_applications").select("*").eq("recruiter_id", recruiterId);
  if (error) throw new Error(`Failed loading your applications: ${error.message}`);
  return data || [];
}

async function applyToRole(recruiterId, roleId) {
  const { error } = await supabaseClient.from("role_applications").insert([{ recruiter_id: recruiterId, role_id: roleId, status: "approved" }]);
  if (error) throw new Error(`Failed to apply: ${error.message}`);
}

async function uploadResume(recruiterId, file) {
  const ext = (file.name.split(".").pop() || "pdf").toLowerCase();
  const path = `${recruiterId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error: uploadErr } = await supabaseClient.storage.from("resumes").upload(path, file);
  if (uploadErr) throw new Error(`Failed uploading resume: ${uploadErr.message}`);
  const { data } = supabaseClient.storage.from("resumes").getPublicUrl(path);
  return data.publicUrl;
}

async function submitCandidate(roleId, recruiterId, firstStageId, form) {
  const { error } = await supabaseClient.from("candidates").insert([
    { role_id: roleId, recruiter_id: recruiterId, name: form.name, email: form.email, linkedin: form.linkedin || null, resume_url: form.resumeUrl, notes: form.notes, stage_id: firstStageId || null, status: "active" },
  ]);
  if (error) throw new Error(`Failed submitting candidate: ${error.message}`);
}

async function fetchMyCandidates(recruiterId) {
  const { data, error } = await supabaseClient.from("candidates").select("*").eq("recruiter_id", recruiterId).order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading your candidates: ${error.message}`);
  return data || [];
}

async function fetchMyCandidatesForRole(roleId, recruiterId) {
  const { data, error } = await supabaseClient.from("candidates").select("*").eq("role_id", roleId).eq("recruiter_id", recruiterId).order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading your candidates: ${error.message}`);
  return data || [];
}

async function fetchMessagesForRoles(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient.from("messages").select("*").in("role_id", roleIds).order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading messages: ${error.message}`);
  return data || [];
}

async function sendRecruiterMessage(session, recruiterId, roleId, candidateId, recruiterTargetId, body) {
  const { error } = await supabaseClient.from("messages").insert([
    { role_id: roleId, candidate_id: candidateId || null, recruiter_id: recruiterTargetId || recruiterId, sender_id: session.user.id, sender_type: "recruiter", body },
  ]);
  if (error) throw new Error(`Failed sending message: ${error.message}`);
}

// ---------- submit candidate form ----------
function SubmitCandidateForm({ role, firstStageId, recruiterId, onSubmitted }) {
  const [form, setForm] = useState({ name: "", email: "", linkedin: "", notes: "" });
  const [resumeFile, setResumeFile] = useState(null);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const set = (patch) => setForm((f) => ({ ...f, ...patch }));

  const validate = () => {
    const next = {};
    if (!form.name.trim()) next.name = "Required";
    if (!form.email.trim()) next.email = "Required";
    if (!resumeFile) next.resume = "Required";
    if (!form.notes.trim()) next.notes = "Required";
    setErrors(next);
    return Object.keys(next).length === 0;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!validate()) return;
    setSubmitting(true);
    setError("");
    try {
      const resumeUrl = await uploadResume(recruiterId, resumeFile);
      await submitCandidate(role.id, recruiterId, firstStageId, { ...form, resumeUrl });
      setDone(true);
      onSubmitted && onSubmitted();
    } catch (err) {
      setError(err.message || "Something went wrong submitting this candidate.");
    } finally {
      setSubmitting(false);
    }
  };

  const fieldStyle = (key) => ({ ...inputStyle, ...(errors[key] ? { borderColor: T.red, marginBottom: 4 } : {}) });

  if (done) {
    return (
      <div style={{ padding: "4px 0" }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>Candidate submitted</div>
        <div style={{ fontSize: 13, color: T.sub, marginBottom: 12 }}>{form.name} has been added to {role.name}'s pipeline.</div>
        <button onClick={() => { setForm({ name: "", email: "", linkedin: "", notes: "" }); setResumeFile(null); setErrors({}); setDone(false); }} style={{ fontSize: 13, color: T.ink, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", padding: 0, fontFamily: T.sans }}>
          Submit another candidate
        </button>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit} noValidate>
      <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Submit a candidate</div>

      <input style={fieldStyle("name")} placeholder="Candidate full name *" value={form.name} onChange={(e) => set({ name: e.target.value })} />
      {errors.name && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>Candidate name is required.</div>}

      <input style={fieldStyle("email")} placeholder="Email *" value={form.email} onChange={(e) => set({ email: e.target.value })} />
      {errors.email && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>Email is required.</div>}

      <input style={inputStyle} placeholder="linkedin.com/in/... (optional)" value={form.linkedin} onChange={(e) => set({ linkedin: e.target.value })} />

      <div style={{ marginBottom: errors.resume ? 4 : 12 }}>
        <label style={{ display: "flex", alignItems: "center", gap: 8, border: `1px dashed ${errors.resume ? T.red : T.line}`, borderRadius: 10, padding: "10px 13px", cursor: "pointer", fontSize: 13, color: resumeFile ? T.ink : T.faint, background: "#fff" }}>
          <Icon name="briefcase" size={14} />
          {resumeFile ? resumeFile.name : "Upload resume *"}
          <input type="file" accept=".pdf,.doc,.docx" style={{ display: "none" }} onChange={(e) => setResumeFile(e.target.files[0] || null)} />
        </label>
      </div>
      {errors.resume && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>A resume file is required.</div>}

      <textarea style={{ ...fieldStyle("notes"), minHeight: 70, resize: "vertical" }} placeholder="Why this candidate is a fit *" value={form.notes} onChange={(e) => set({ notes: e.target.value })} />
      {errors.notes && <div style={{ color: T.red, fontSize: 11.5, marginBottom: 8 }}>Tell the company why this candidate is a fit.</div>}

      {error && <div style={{ color: T.red, fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
      <PrimaryButton type="submit" disabled={submitting} style={{ width: "100%" }}>{submitting ? "Submitting\u2026" : "Submit candidate"}</PrimaryButton>
    </form>
  );
}

// ---------- browse roles ----------
function BrowseRoles({ recruiterId, session, appliedRoleIds, onApplied, readOnly }) {
  const [roles, setRoles] = useState([]);
  const [companyMap, setCompanyMap] = useState({});
  const [counts, setCounts] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  const [savedSet, setSavedSet] = useState(() => new Set());

  const [query, setQuery] = useState("");
  const [minSalary, setMinSalary] = useState("");
  const [activeFilters, setActiveFilters] = useState(() => new Set());

  useEffect(() => {
    (async () => {
      try {
        const r = await fetchLiveRoles();
        setRoles(r);
        const ids = r.map((x) => x.id);
        setCompanyMap(await fetchCompaniesByIds([...new Set(r.map((x) => x.company_id))]));
        setCounts(await fetchInterviewingCounts(ids));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const toggle = (roleId) => setExpandedId((prev) => (prev === roleId ? null : roleId));

  const toggleFilter = (key) => setActiveFilters((prev) => { const next = new Set(prev); next.has(key) ? next.delete(key) : next.add(key); return next; });
  const toggleSave = (roleId) => setSavedSet((prev) => { const next = new Set(prev); next.has(roleId) ? next.delete(roleId) : next.add(roleId); return next; });
  const clearAll = () => { setQuery(""); setMinSalary(""); setActiveFilters(new Set()); };
  const hasActiveFilters = query !== "" || minSalary !== "" || activeFilters.size > 0;

  let visible = roles.filter((r) => {
    if (appliedRoleIds.has(r.id)) return false;
    const company = companyMap[r.company_id] || "";
    if (query) {
      const q = query.toLowerCase();
      const hay = `${r.name} ${company} ${r.description || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (minSalary && Number(r.max_salary || 0) < Number(minSalary)) return false;
    if (activeFilters.has("new") && !isRecent(r.created_at)) return false;
    if (activeFilters.has("noInterviews") && (counts[r.id] || 0) !== 0) return false;
    return true;
  });
  if (activeFilters.has("highestPaying")) visible = [...visible].sort((a, b) => (b.max_salary || 0) - (a.max_salary || 0));

  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"loading roles\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  return (
    <div>
      <FilterPillsRow active={activeFilters} onToggle={toggleFilter} />
      <SearchFilterBar query={query} setQuery={setQuery} count={visible.length} minSalary={minSalary} setMinSalary={setMinSalary} onClear={clearAll} hasActiveFilters={hasActiveFilters} />

      <div style={{ marginTop: 22, marginBottom: 16 }}>
        <div style={{ fontSize: 20, fontWeight: 700, color: T.ink }}>Live roles</div>
        <div style={{ fontSize: 13.5, color: T.sub, marginTop: 2 }}>Open roles from companies hiring on MakePlacement.</div>
      </div>

      {visible.length === 0 ? (
        <EmptyState
          icon="briefcase"
          title={roles.length === 0 ? "No live roles right now" : "No roles match your filters"}
          body={roles.length === 0 ? "Check back soon \u2014 new roles show up here as clients post them." : "Try a different search term or clear your filters."}
          actions={hasActiveFilters ? <SecondaryButton onClick={clearAll}>Clear filters</SecondaryButton> : null}
        />
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(255px, 1fr))", gap: 16 }}>
          {visible.map((role) => (
            <RoleCard
              key={role.id}
              role={role}
              companyName={companyMap[role.company_id]}
              expanded={expandedId === role.id}
              onToggle={() => toggle(role.id)}
              interviewingCount={counts[role.id] || 0}
              saved={savedSet.has(role.id)}
              onToggleSave={() => toggleSave(role.id)}
              applied={appliedRoleIds.has(role.id)}
              onApply={async () => { await applyToRole(recruiterId, role.id); onApplied(role.id); }}
              readOnly={readOnly}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function MessageFeed({ messages, emptyLabel }) {

  return (
    <div>
      {messages.map((m) => (
        <div key={m.id} style={{ padding: "7px 0", borderBottom: `1px solid ${T.lineSoft}` }}>
          <div style={{ fontSize: 12.5, color: "#333", whiteSpace: "pre-wrap" }}>{m.body}</div>
          <div style={{ fontSize: 11, color: T.faint, marginTop: 2 }}>{m.sender_type === "recruiter" ? "you" : m.sender_type === "admin" ? "Akash (admin)" : "company"} {"\u00b7"} {formatWhen(m.created_at)}</div>
        </div>
      ))}
    </div>
  );
}

function MessageComposer({ onSend, placeholder, buttonLabel = "Send" }) {
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const handleSend = async () => {
    if (!text.trim()) return;
    setSending(true);
    setError("");
    try { await onSend(text.trim()); setText(""); } catch (err) { setError(err.message || "Failed to send."); } finally { setSending(false); }
  };
  return (
    <div>
      <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder={placeholder} style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} />
      {error && <div style={{ color: T.red, fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <PrimaryButton onClick={handleSend} disabled={sending || !text.trim()}>{sending ? "Sending\u2026" : buttonLabel}</PrimaryButton>
    </div>
  );
}

function KanbanBoard({ candidates, roleMap, companyMap }) {
  const columns = [
    { key: "active", label: "Interviewing", test: isActive },
    { key: "rejected", label: "Rejected", test: isRejected },
    { key: "placed", label: "Placed", test: isPlaced },

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
      {columns.map((col) => {
        const items = candidates.filter(col.test);
        return (
          <div key={col.key}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", paddingBottom: 8, borderBottom: `2px solid ${T.ink}`, marginBottom: 12 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: T.ink, textTransform: "uppercase", letterSpacing: "0.03em" }}>{col.label}</div>
              <div style={{ fontSize: 12, color: T.sub }}>{items.length}</div>

            {items.length === 0 && <div style={{ fontSize: 12.5, color: T.faint, fontStyle: "italic" }}>None yet</div>}

  );
}

function RoleWorkspace({ role, companyName, recruiterId, session, onBack, readOnly }) {
  const [detail, setDetail] = useState(null);
  const [candidates, setCandidates] = useState([]);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  const load = async () => {
    try {
      const [d, cands, roleMsgs] = await Promise.all([
        fetchRoleDetail(role.id),
        fetchMyCandidatesForRole(role.id, recruiterId),
        fetchMessagesForRoles([role.id]),
      ]);
      setDetail(d);
      setCandidates(cands);
      const myCandidateIds = new Set(cands.map((c) => c.id));
      setMessages(roleMsgs.filter((m) => (
        (m.recruiter_id === recruiterId && !m.candidate_id) ||
        (m.candidate_id && myCandidateIds.has(m.candidate_id)) ||
        (!m.candidate_id && !m.recruiter_id)
      )));
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { setLoading(true); load(); }, [role.id]);

  useEffect(() => {
    const channel = supabaseClient
      .channel(`role-workspace-${role.id}-${recruiterId}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "candidates", filter: `role_id=eq.${role.id}` }, (payload) => {
        const row = payload.new || payload.old;
        if (row && row.recruiter_id === recruiterId) load();
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "messages", filter: `role_id=eq.${role.id}` }, () => load())
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [role.id, recruiterId]);

  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"Loading role\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  const stageMap = {};
  (detail.stages || []).forEach((s) => (stageMap[s.id] = s.name));
  const broadcasts = messages.filter((m) => !m.candidate_id && !m.recruiter_id);
  const directMessages = messages.filter((m) => m.recruiter_id === recruiterId && !m.candidate_id);
  const messagesForCandidate = (candidateId) => messages.filter((m) => m.candidate_id === candidateId);

  return (
    <div>
      <button onClick={onBack} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "none", border: "none", color: T.sub, fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 18, fontFamily: T.sans }}>
        <Icon name="chevronDown" size={13} style={{ transform: "rotate(90deg)" }} /> All my roles
      </button>

      <div style={{ fontSize: 24, fontWeight: 700, color: T.ink, marginBottom: 4 }}>{role.name}</div>
      <div style={{ fontSize: 13.5, color: T.sub, marginBottom: 4 }}>{companyName}</div>
      <div style={{ fontSize: 13, color: T.sub, marginBottom: 24 }}>{money(role.min_salary)} {"\u2013"} {money(role.max_salary)}</div>

      <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 28 }}>
        <div>
          <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, marginBottom: 14 }}>Your candidates ({candidates.length})</div>
          {candidates.length === 0 ? (
            <div style={{ fontSize: 12.5, color: T.faint, fontStyle: "italic", marginBottom: 20 }}>{"No candidates submitted yet \u2014 use the form to submit your first one."}</div>
          ) : (
            candidates.map((c) => (
              <MyCandidateCard
                key={c.id}
                candidate={c}
                stageName={stageMap[c.stage_id]}
                feedbackMessages={messagesForCandidate(c.id)}
                onSendFeedback={readOnly ? null : async (body) => { await sendRecruiterMessage(session, recruiterId, role.id, c.id, null, body); await load(); }}
              />
            ))
          )}

          <RoleInfoPanel role={role} detail={detail} />
        </div>

        <div>
          {!readOnly && (
            <div style={{ background: T.paperDim, border: `1px solid ${T.line}`, borderRadius: 12, padding: 16, marginBottom: 20 }}>
              <SubmitCandidateForm role={role} firstStageId={detail.stages[0] ? detail.stages[0].id : null} recruiterId={recruiterId} onSubmitted={load} />
            </div>
          )}

          <div style={{ border: `1px solid ${T.line}`, borderLeft: `3px solid ${T.blue}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 8 }}>Updates from {companyName || "the company"}</div>
            <MessageFeed messages={broadcasts} emptyLabel="No updates sent yet." />
          </div>

          <div style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 8 }}>Message {companyName || "the company"} directly</div>
            <MessageFeed messages={directMessages} emptyLabel="No messages yet." />
            {!readOnly && (
              <div style={{ marginTop: directMessages.length ? 10 : 0 }}>
                <MessageComposer onSend={(body) => sendRecruiterMessage(session, recruiterId, role.id, null, null, body).then(load)} placeholder="Write a message\u2026" buttonLabel="Send" />
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- messages inbox ----------
function RecruiterInbox({ session, recruiterId, appliedRoleIds, readOnly }) {
  const [roles, setRoles] = useState([]);
  const [companyMap, setCompanyMap] = useState({});
  const [candidates, setCandidates] = useState([]);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [expandedKey, setExpandedKey] = useState(null);

  const roleIds = [...appliedRoleIds];

  const loadAll = async () => {
    if (roleIds.length === 0) { setLoading(false); return; }
    try {
      const [r, cands, allMsgs] = await Promise.all([fetchRolesByIds(roleIds), fetchMyCandidates(recruiterId), fetchMessagesForRoles(roleIds)]);
      setRoles(r);
      setCompanyMap(await fetchCompaniesByIds([...new Set(r.map((x) => x.company_id))]));
      setCandidates(cands);
      const myCandidateIds = new Set(cands.map((c) => c.id));
      const relevant = allMsgs.filter((m) => (
        m.recruiter_id === recruiterId ||
        (m.candidate_id && myCandidateIds.has(m.candidate_id)) ||
        (!m.candidate_id && !m.recruiter_id)
      ));
      setMessages(relevant);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadAll(); }, [appliedRoleIds.size]);

  useEffect(() => {
    if (roleIds.length === 0) return;
    const channel = supabaseClient
      .channel(`recruiter-inbox-${recruiterId}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, (payload) => {
        const row = payload.new || payload.old;
        if (row && roleIds.includes(row.role_id)) loadAll();
      })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [appliedRoleIds.size, recruiterId]);

  const roleById = {};
  roles.forEach((r) => (roleById[r.id] = r));
  const candidateById = {};
  candidates.forEach((c) => (candidateById[c.id] = c));

  const threads = {};
  messages.forEach((m) => {
    const key = `${m.role_id}:${m.candidate_id || ""}:${m.recruiter_id || ""}`;
    if (!threads[key]) threads[key] = { key, role_id: m.role_id, candidate_id: m.candidate_id, recruiter_id: m.recruiter_id, messages: [] };
    threads[key].messages.push(m);
  });
  const threadList = Object.values(threads).sort((a, b) => new Date(b.messages[b.messages.length - 1].created_at) - new Date(a.messages[a.messages.length - 1].created_at));

  const threadLabel = (t) => {
    if (t.candidate_id) {
      const c = candidateById[t.candidate_id];
      return c ? `${c.name} \u2014 notes from company` : "Candidate notes";
    }
    if (t.recruiter_id) return "Direct from company";
    return "Bench update";
  };

  const send = async (roleId, candidateId, recruiterTargetId, body) => {
    await sendRecruiterMessage(session, recruiterId, roleId, candidateId, recruiterTargetId, body);
    await loadAll();
  };

  if (roleIds.length === 0) {
    return <EmptyState icon="mail" title="No messages yet" body="Apply to a role to start hearing from the companies you're working with." />;
  }
  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"Loading messages\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  return (
    <div>
      <div style={{ fontSize: 20, fontWeight: 700, color: T.ink, marginBottom: 4 }}>Messages</div>
      <div style={{ fontSize: 13.5, color: T.sub, marginBottom: 22 }}>Everything sent to you about your candidates and roles, updating live.</div>

      {threadList.length === 0 ? (
        <EmptyState icon="mail" title="No messages yet" body="When a company sends feedback or an update, it'll show up here right away." />
      ) : (
        threadList.map((t) => {
          const role = roleById[t.role_id];
          const open = expandedKey === t.key;
          const last = t.messages[t.messages.length - 1];
          return (
            <div key={t.key} style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 16, marginBottom: 12 }}>
              <div onClick={() => setExpandedKey(open ? null : t.key)} style={{ cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: T.ink }}>{threadLabel(t)}</div>
                  <div style={{ fontSize: 12, color: T.sub, marginTop: 2 }}>{role ? `${role.name} \u00b7 ${companyMap[role.company_id] || ""}` : "Role"}</div>
                  {!open && <div style={{ fontSize: 12.5, color: T.sub, marginTop: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{last.body}</div>}
                </div>
                <div style={{ fontSize: 11, color: T.faint, whiteSpace: "nowrap" }}>{formatWhen(last.created_at)}</div>
              </div>
              {open && (
                <div style={{ marginTop: 14, borderTop: `1px solid ${T.lineSoft}`, paddingTop: 14 }}>
                  <MessageFeed messages={t.messages} emptyLabel="" />
                  {!readOnly && (
                    <div style={{ marginTop: 10 }}>
                      <MessageComposer onSend={(body) => send(t.role_id, t.candidate_id, t.recruiter_id, body)} placeholder="Reply\u2026" buttonLabel="Reply" />
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

// ---------- main ----------
function RecruiterDashboard() {
  const [session, setSession] = useState(undefined);
  const [recruiter, setRecruiter] = useState(null);
  const [tab, setTab] = useState("browse");
  const [appliedRoleIds, setAppliedRoleIds] = useState(() => new Set());
  const [focusRoleId, setFocusRoleId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [adminViewMode, setAdminViewMode] = useState(false);

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { window.location.href = LOGIN_URL; return; }
      setSession(session);
      try {
        const params = new URLSearchParams(window.location.search);
        const viewRecruiterId = params.get("admin_view_recruiter");

        let r = null;
        if (viewRecruiterId) {
          const { data: adminRow } = await supabaseClient.from("admins").select("id").ilike("email", session.user.email).maybeSingle();
          if (adminRow) {
            const { data: viewedRecruiter, error: viewErr } = await supabaseClient.from("recruiters").select("*").eq("id", viewRecruiterId).maybeSingle();
            if (viewErr || !viewedRecruiter) { setError("Could not load that recruiter."); setLoading(false); return; }
            r = viewedRecruiter;
            setAdminViewMode(true);
          }
        }
        if (!r) r = await getMyRecruiter(session);
        if (!r) { window.location.href = LOGIN_URL; return; }
        setRecruiter(r);
        const apps = await fetchMyApplications(r.id);
        setAppliedRoleIds(new Set(apps.map((a) => a.role_id)));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    });
  }, []);

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    window.location.href = LOGIN_URL;
  };

  const handleApplied = (roleId) => {
    setAppliedRoleIds((prev) => new Set([...prev, roleId]));
    setFocusRoleId(roleId);
    setTab("myroles");
  };

  const [notifItems, setNotifItems] = useState([]);
  const [notifSeenAt, setNotifSeenAt] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [bellPulse, setBellPulse] = useState(false);
  const notifKey = recruiter ? `mp_notif_seen_recruiter_${recruiter.id}` : null;

  const pushToast = (text) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((prev) => [...prev, { id, text }]);
    setBellPulse(true);
    setTimeout(() => setBellPulse(false), 650);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 5000);
  };

  useEffect(() => {
    if (!notifKey) return;
    const stored = localStorage.getItem(notifKey);
    if (stored) {
      setNotifSeenAt(stored);
    } else {
      const now = new Date().toISOString();
      localStorage.setItem(notifKey, now);
      setNotifSeenAt(now);
    }
  }, [notifKey]);

  const loadNotifications = async () => {
    if (!recruiter || appliedRoleIds.size === 0) { setNotifItems([]); return; }
    const roleIds = [...appliedRoleIds];
    try {
      const [roleList, allMsgs, myCandidates] = await Promise.all([
        fetchRolesByIds(roleIds),
        fetchMessagesForRoles(roleIds),
        fetchMyCandidates(recruiter.id),
      ]);
      const roleById = {};
      roleList.forEach((r) => (roleById[r.id] = r));
      const myCandidateIds = new Set(myCandidates.map((c) => c.id));
      const relevantMsgs = allMsgs.filter((m) => (
        m.sender_type !== "recruiter" && (
          m.recruiter_id === recruiter.id ||
          (m.candidate_id && myCandidateIds.has(m.candidate_id)) ||
          (!m.candidate_id && !m.recruiter_id)
        )
      ));
      const updatedCandidates = myCandidates.filter((c) => c.updated_at && new Date(c.updated_at) - new Date(c.created_at) > 1000);

      const items = [
        ...relevantMsgs.map((m) => ({
          key: `msg-${m.id}`,
          time: m.created_at,
          text: m.candidate_id ? `New note on a candidate for ${roleById[m.role_id] ? roleById[m.role_id].name : "a role"}` : `New message on ${roleById[m.role_id] ? roleById[m.role_id].name : "a role"}`,
          roleId: m.role_id,
          kind: "message",
        })),
        ...updatedCandidates.map((c) => ({
          key: `cand-${c.id}`,
          time: c.updated_at,
          text: `Update on ${c.name} \u2014 ${roleById[c.role_id] ? roleById[c.role_id].name : "your submission"}`,
          roleId: c.role_id,
          kind: "candidate",
        })),
      ].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 25);
      setNotifItems(items);
    } catch (err) {
      // best-effort
    }
  };

  useEffect(() => {
    if (!recruiter || appliedRoleIds.size === 0) return;
    loadNotifications();
    const roleIds = [...appliedRoleIds];
    const channel = supabaseClient
      .channel(`recruiter-notifications-${recruiter.id}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
        const row = payload.new;
        if (row && appliedRoleIds.has(row.role_id) && row.sender_type !== "recruiter") {
          loadNotifications();
          pushToast(row.sender_type === "admin" ? "New message from Akash (admin)" : "New message from a company");
        }
      })
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "candidates", filter: `recruiter_id=eq.${recruiter.id}` }, (payload) => {
        loadNotifications();
        if (payload.new) pushToast(`Update on ${payload.new.name}`);
      })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [recruiter && recruiter.id, appliedRoleIds.size]);

  const markNotifsRead = () => {
    if (!notifKey) return;
    const now = new Date().toISOString();
    localStorage.setItem(notifKey, now);
    setNotifSeenAt(now);
  };

  const notifUnreadCount = notifSeenAt ? notifItems.filter((n) => new Date(n.time) > new Date(notifSeenAt)).length : notifItems.length;

  const goToNotification = (item) => {
    if (item.kind === "message") { setTab("messages"); return; }
    setTab("myroles");
    setFocusRoleId(item.roleId);
  };

  if (session === undefined || loading) return <div style={pageWrap}><div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.sub, fontSize: 13 }}>{"loading\u2026"}</div></div>;
  if (error) return <div style={pageWrap}><div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.red }}>{error}</div></div>;

  return (
    <div style={pageWrap}>
      {adminViewMode && (
        <div style={{ background: T.ink, color: "#fff", padding: "10px 20px", fontSize: 13, display: "flex", justifyContent: "center", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <span>Admin view \u2014 viewing as {recruiter.firm_name || [recruiter.contact_first_name, recruiter.last_name].filter(Boolean).join(" ") || "this recruiter"} (read-only)</span>
          <a href="admin.html" style={{ color: "#fff", textDecoration: "underline" }}>Exit to admin</a>
        </div>
      )}
      <TopNav
        tab={tab}
        onTabChange={(t) => { setTab(t); if (t !== "myroles") setFocusRoleId(null); }}
        recruiter={recruiter}
        onLogout={handleLogout}
        notifications={notifItems}
        notifUnread={notifUnreadCount}
        onMarkNotifsRead={markNotifsRead}
        onSelectNotification={goToNotification}
        bellPulse={bellPulse}
      />
      <div style={{ maxWidth: 1320, margin: "0 auto", padding: "32px 28px 100px" }}>
        {tab === "browse" && <BrowseRoles recruiterId={recruiter.id} session={session} appliedRoleIds={appliedRoleIds} onApplied={handleApplied} readOnly={adminViewMode} />}
        {tab === "myroles" && <MyRoles recruiterId={recruiter.id} session={session} appliedRoleIds={appliedRoleIds} onBrowse={() => setTab("browse")} focusRoleId={focusRoleId} onFocusRole={setFocusRoleId} readOnly={adminViewMode} />}
        {tab === "messages" && <RecruiterInbox session={session} recruiterId={recruiter.id} appliedRoleIds={appliedRoleIds} readOnly={adminViewMode} />}
      </div>
      <ToastStack toasts={toasts} />
    </div>
  );
}

const pageWrap = { minHeight: "100vh", background: "#fff", fontFamily: T.sans, color: T.ink };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RecruiterDashboard />);
  </script>
</body>
</html>
