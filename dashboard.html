<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | MakePlacement</title>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.10/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    ::selection { background: #111214; color: #fff; }
    button, input, textarea, select { font-family: inherit; }

    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid #3b6fe0;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    @media (max-width: 900px) {
      .mp-nav-secondary { display: none; }
      .mp-nav-search { display: none; }
    }
    @media (max-width: 760px) {
      .mp-other-roles { grid-template-columns: 1fr !important; }
      .mp-pipeline-grid { grid-template-columns: 1fr !important; overflow-x: visible !important; }
    }

    #boot-error {
      display: none;
      max-width: 760px;
      margin: 48px auto;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      color: #111;
    }
    #boot-error pre {
      white-space: pre-wrap;
      background: #f7f7f7;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error">
    <h2>We couldn't load the dashboard.</h2>
    <p>Please refresh the page. If the problem continues, contact support.</p>
    <pre id="boot-error-detail"></pre>
  </div>

  <script>
    window.addEventListener("error", function (event) {
      const box = document.getElementById("boot-error");
      const detail = document.getElementById("boot-error-detail");
      if (box && detail && !document.getElementById("root").hasChildNodes()) {
        box.style.display = "block";
        detail.textContent = event.error ? (event.error.stack || event.error.message) : event.message;
      }
    });
  </script>

  <script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ---------- Supabase config ----------
const SUPABASE_URL = "https://cnayvrtkxgqpejhrlakm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOGIN_URL = "index.html";
const NEW_ROLE_URL = "onboarding.html";

// ---------- design tokens (shared with the recruiter dashboard) ----------
const T = {
  ink: "#111214",
  sub: "#6b7075",
  faint: "#9a9ea3",
  line: "#e7e7e9",
  lineSoft: "#f0f0f1",
  paper: "#ffffff",
  paperDim: "#fafafa",
  pillBg: "#f2f2f3",
  pillBgHover: "#eaeaeb",
  blue: "#3b6fe0",
  blueBg: "#eaf1ff",
  green: "#1a8a4a",
  greenBg: "#e8f6ec",
  red: "#c0392b",
  redBg: "#fbeceb",
  gold: "#a06a1d",
  goldBg: "#faf1e0",
  sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
};

const isRejected = (c) => (c.status || "").toLowerCase() === "rejected";
const isPlaced = (c) => (c.status || "").toLowerCase() === "placed";
const isActive = (c) => !isRejected(c) && !isPlaced(c);

function money(v) {
  return v == null || v === "" ? "\u2014" : `$${Number(v).toLocaleString()}`;
}

function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

// ---------- icons ----------
function Icon({ name, size = 18, style }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "search":
      return <svg {...common}><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>;
    case "bell":
      return <svg {...common}><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>;
    case "briefcase":
      return <svg {...common}><rect x="2" y="7" width="20" height="14" rx="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></svg>;
    case "chevronDown":
      return <svg {...common}><polyline points="6 9 12 15 18 9" /></svg>;
    case "chevronRight":
      return <svg {...common}><polyline points="9 6 15 12 9 18" /></svg>;
    case "arrowLeft":
      return <svg {...common}><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>;
    case "x":
      return <svg {...common}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "check":
      return <svg {...common}><polyline points="20 6 9 17 4 12" /></svg>;
    case "checkCircle":
      return <svg {...common}><circle cx="12" cy="12" r="9" /><polyline points="8 12 11 15 16 9" /></svg>;
    case "pause":
      return <svg {...common}><rect x="7" y="5" width="3.5" height="14" rx="1" /><rect x="13.5" y="5" width="3.5" height="14" rx="1" /></svg>;
    case "play":
      return <svg {...common} fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20" /></svg>;
    case "shield":
      return <svg {...common}><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z" /><polyline points="9 12 11 14 15 10" /></svg>;
    case "logout":
      return <svg {...common}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>;
    case "dollar":
      return <svg {...common}><line x1="12" y1="1" x2="12" y2="23" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></svg>;
    case "plus":
      return <svg {...common}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    case "megaphone":
      return <svg {...common}><path d="M3 11v2a1 1 0 0 0 1 1h1l2 6h2l-1-6h4l6 4V6l-6 4H5a1 1 0 0 0-1 1Z" /></svg>;
    case "users":
      return <svg {...common}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>;
    case "mail":
      return <svg {...common}><rect x="2" y="4" width="20" height="16" rx="2" /><polyline points="22 6 12 13 2 6" /></svg>;
    default:
      return null;
  }
}

// ---------- small building blocks ----------
function Pill({ children, tone, style, ...rest }) {
  const tones = {
    default: { bg: T.pillBg, fg: T.ink },
    live: { bg: T.blueBg, fg: T.blue },
    paused: { bg: T.goldBg, fg: T.gold },
    filled: { bg: T.greenBg, fg: T.green },
    rejected: { bg: T.redBg, fg: T.red },
    placed: { bg: T.greenBg, fg: T.green },
  };
  const t = tones[tone] || tones.default;
  return (
    <span {...rest} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12.5, fontWeight: 600, padding: "5px 11px", borderRadius: 999, background: t.bg, color: t.fg, whiteSpace: "nowrap", ...style }}>
      {children}
    </span>
  );
}

function GhostButton({ children, active, decorative, style, ...rest }) {
  return (
    <button
      {...rest}
      title={decorative ? "Coming soon" : rest.title}
      style={{
        display: "inline-flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 500, padding: "8px 14px", borderRadius: 999,
        border: `1px solid ${active ? T.ink : T.line}`, background: active ? T.ink : "#fff", color: active ? "#fff" : decorative ? T.faint : T.ink,
        cursor: decorative ? "default" : "pointer", opacity: decorative ? 0.7 : 1, fontFamily: T.sans, ...style,
      }}
    >
      {children}
    </button>
  );
}

function PrimaryButton(props) {
  return (
    <button
      {...props}
      style={{ background: T.ink, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontSize: 13.5, fontWeight: 600, cursor: props.disabled ? "default" : "pointer", opacity: props.disabled ? 0.55 : 1, fontFamily: T.sans, ...props.style }}
    />
  );
}

function SecondaryButton(props) {
  return (
    <button
      {...props}
      style={{ background: T.pillBg, color: T.ink, border: "none", borderRadius: 10, padding: "10px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: T.sans, ...props.style }}
    />
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "10px 13px", fontSize: 13.5, borderRadius: 10,
  border: `1px solid ${T.line}`, outline: "none", color: T.ink, background: "#fff", fontFamily: T.sans, marginBottom: 12,
};

const sectionLabelStyle = {
  fontSize: 11, fontWeight: 700, letterSpacing: "0.05em", color: T.sub, textTransform: "uppercase", marginBottom: 8,
};

function EmptyState({ icon, title, body, actions }) {
  return (
    <div style={{ border: `1.5px dashed ${T.line}`, borderRadius: 14, padding: "64px 24px", textAlign: "center" }}>
      <div style={{ width: 44, height: 44, borderRadius: 10, background: T.blueBg, color: T.blue, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 20px" }}>
        <Icon name={icon} size={20} />
      </div>
      <div style={{ fontSize: 17, fontWeight: 700, color: T.ink, marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 13.5, color: T.sub, maxWidth: 380, margin: "6px auto 0" }}>{body}</div>
      {actions && <div style={{ display: "flex", gap: 10, justifyContent: "center", marginTop: 20 }}>{actions}</div>}
    </div>
  );
}

// A centered overlay dialog -- used for anything that changes state in a
// way that's hard to undo (marking a role filled) or that should always
// carry an explanation (rejecting a candidate).
function Modal({ onClose, children, width = 460 }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(17,18,20,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 14, padding: 24, width: "100%", maxWidth: width, boxShadow: "0 20px 60px rgba(0,0,0,0.25)" }}>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({ title, body, confirmLabel, onCancel, onConfirm, danger }) {
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const go = async () => {
    setSubmitting(true);
    setError("");
    try {
      await onConfirm();
    } catch (err) {
      setError(err.message || "Something went wrong.");
      setSubmitting(false);
    }
  };
  return (
    <Modal onClose={onCancel}>
      <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 6, color: T.ink }}>{title}</div>
      <div style={{ fontSize: 13.5, color: T.sub, marginBottom: 18, lineHeight: 1.5 }}>{body}</div>
      {error && <div style={{ color: T.red, fontSize: 12.5, marginBottom: 12 }}>{error}</div>}
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
        <SecondaryButton onClick={onCancel} disabled={submitting}>Cancel</SecondaryButton>
        <PrimaryButton onClick={go} disabled={submitting} style={danger ? { background: T.red } : {}}>
          {submitting ? "Working\u2026" : confirmLabel}
        </PrimaryButton>
      </div>
    </Modal>
  );
}

function RejectModal({ candidate, onCancel, onConfirm }) {
  const [reason, setReason] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (!reason.trim()) {
      setError("Add a reason \u2014 it goes straight to the recruiter who submitted them.");
      return;
    }
    setSubmitting(true);
    setError("");
    try {
      await onConfirm(reason.trim());
    } catch (err) {
      setError(err.message || "Something went wrong.");
      setSubmitting(false);
    }
  };

  return (
    <Modal onClose={onCancel}>
      <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 6, color: T.ink }}>Reject {candidate.name}?</div>
      <div style={{ fontSize: 13.5, color: T.sub, marginBottom: 14, lineHeight: 1.5 }}>
        This note is sent directly to the recruiter who submitted them, so keep it specific and constructive.
      </div>
      <textarea
        autoFocus
        value={reason}
        onChange={(e) => setReason(e.target.value)}
        placeholder="e.g. Strong background, but we need more hands-on infra experience for this role."
        style={{ ...inputStyle, minHeight: 90, resize: "vertical" }}
      />
      {error && <div style={{ color: T.red, fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
        <SecondaryButton onClick={onCancel} disabled={submitting}>Cancel</SecondaryButton>
        <PrimaryButton onClick={submit} disabled={submitting} style={{ background: T.red }}>
          {submitting ? "Rejecting\u2026" : "Reject & send feedback"}
        </PrimaryButton>
      </div>
    </Modal>
  );
}

// ---------- data ----------
async function getMyCompany(session) {
  const { data, error } = await supabaseClient.from("companies").select("*").eq("auth_user_id", session.user.id).maybeSingle();
  if (error) throw new Error(`Failed loading company: ${error.message}`);
  return data;
}

async function fetchRoles(companyId) {
  const { data, error } = await supabaseClient.from("roles").select("*").eq("company_id", companyId).order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  return data || [];
}

async function fetchRoleCandidateCounts(roleIds) {
  if (roleIds.length === 0) return {};
  const { data, error } = await supabaseClient.from("candidates").select("role_id, status").in("role_id", roleIds);
  if (error) throw new Error(`Failed loading candidate counts: ${error.message}`);
  const counts = {};
  roleIds.forEach((id) => (counts[id] = { active: 0, rejected: 0, placed: 0 }));
  (data || []).forEach((c) => {
    const bucket = isPlaced(c) ? "placed" : isRejected(c) ? "rejected" : "active";
    if (!counts[c.role_id]) counts[c.role_id] = { active: 0, rejected: 0, placed: 0 };
    counts[c.role_id][bucket] += 1;
  });
  return counts;
}

async function fetchStages(roleId) {
  const { data, error } = await supabaseClient.from("role_stages").select("*").eq("role_id", roleId).order("position", { ascending: true });
  if (error) throw new Error(`Failed loading stages: ${error.message}`);
  return data || [];
}

async function fetchCandidates(roleId) {
  const { data, error } = await supabaseClient.from("candidates").select("*").eq("role_id", roleId).order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading candidates: ${error.message}`);
  return data || [];
}

async function fetchCandidatesForRoles(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient.from("candidates").select("*").in("role_id", roleIds);
  if (error) throw new Error(`Failed loading candidates: ${error.message}`);
  return data || [];
}

async function fetchRecruiters(recruiterIds) {
  if (recruiterIds.length === 0) return {};
  const { data, error } = await supabaseClient.from("recruiters").select("id, firm_name").in("id", recruiterIds);
  if (error) throw new Error(`Failed loading recruiters: ${error.message}`);
  const map = {};
  (data || []).forEach((r) => (map[r.id] = r.firm_name));
  return map;
}

async function fetchRoleApplications(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient.from("role_applications").select("*").in("role_id", roleIds);
  if (error) throw new Error(`Failed loading recruiter applications: ${error.message}`);
  return data || [];
}

async function updateCandidate(id, patch) {
  const { error } = await supabaseClient.from("candidates").update(patch).eq("id", id);
  if (error) throw new Error(`Failed updating candidate: ${error.message}`);
}

async function updateRoleStatus(id, status) {
  const { error } = await supabaseClient.from("roles").update({ status }).eq("id", id);
  if (error) throw new Error(`Failed updating role: ${error.message}`);
}

async function fetchRoleMessages(roleId) {
  const { data, error } = await supabaseClient.from("messages").select("*").eq("role_id", roleId).order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading messages: ${error.message}`);
  return data || [];
}

async function fetchAllMessages(roleIds) {
  if (roleIds.length === 0) return [];
  const { data, error } = await supabaseClient.from("messages").select("*").in("role_id", roleIds).order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading messages: ${error.message}`);
  return data || [];
}

async function sendMessage(session, roleId, candidateId, recruiterId, body) {
  const { error } = await supabaseClient.from("messages").insert([
    { role_id: roleId, candidate_id: candidateId || null, recruiter_id: recruiterId || null, sender_id: session.user.id, sender_type: "company", body },
  ]);
  if (error) throw new Error(`Failed sending message: ${error.message}`);
}

// ---------- top navigation ----------

  return (

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round">
        <line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="14" y2="17" />
      </svg>
    </div>

}

const NAV_ITEMS = [
  { key: "roles", label: "Roles", live: true },
  { key: "messages", label: "Messages", live: true },
  { key: "calls", label: "Calls", live: false },

function TopNav({ tab, onTabChange, companyName, onLogout, unreadHint }) {

  return (
    <div style={{ borderBottom: `1px solid ${T.line}`, background: "#fff" }}>

        <div style={{ display: "flex", alignItems: "center", gap: 30 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Logomark />
            <span style={{ fontSize: 16.5, fontWeight: 700, color: T.ink, letterSpacing: "-0.01em" }}>MakePlacement</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 22 }}>
            {NAV_ITEMS.map((item) => {
              const isActiveTab = item.live && tab === item.key;
              return (
                <button
                  key={item.key}
                  className={item.live ? "" : "mp-nav-secondary"}
                  onClick={item.live ? () => onTabChange(item.key) : undefined}
                  title={item.live ? undefined : "Coming soon"}

                    background: "none", border: "none", padding: "4px 0", fontSize: 13.5, fontWeight: isActiveTab ? 700 : 500,
                    color: item.live ? (isActiveTab ? T.ink : T.sub) : T.faint, cursor: item.live ? "pointer" : "default",
                    borderBottom: isActiveTab ? `2px solid ${T.ink}` : "2px solid transparent", fontFamily: T.sans,
                    display: "inline-flex", alignItems: "center", gap: 6,
                  }}
                >
                  {item.label}
                  {item.key === "messages" && unreadHint > 0 && (
                    <span style={{ background: T.red, color: "#fff", fontSize: 10.5, fontWeight: 700, borderRadius: 999, padding: "1px 6px" }}>{unreadHint}</span>

              );
            })}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div className="mp-nav-search" title="Coming soon" style={{ display: "flex", alignItems: "center", gap: 8, background: T.pillBg, borderRadius: 10, padding: "8px 12px", width: 200, color: T.faint }}>
            <Icon name="search" size={15} />
            <input disabled placeholder="Search" style={{ border: "none", background: "none", outline: "none", fontSize: 13, color: T.faint, flex: 1, fontFamily: T.sans }} />
          </div>

          <button title="Notifications \u2014 coming soon" style={{ background: "none", border: "none", color: T.sub, cursor: "default", padding: 6, display: "flex" }}>
            <Icon name="bell" size={18} />
          </button>

          <div style={{ position: "relative" }}>
            <button onClick={() => setMenuOpen((o) => !o)} style={{ width: 32, height: 32, borderRadius: "50%", background: T.ink, color: "#fff", border: "none", fontSize: 13, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {initial}
            </button>
            {menuOpen && (
              <div style={{ position: "absolute", right: 0, top: 40, background: "#fff", border: `1px solid ${T.line}`, borderRadius: 10, boxShadow: "0 8px 24px rgba(0,0,0,0.08)", minWidth: 170, overflow: "hidden", zIndex: 20 }}>
                <a href={NEW_ROLE_URL} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", fontSize: 13, color: T.ink, textDecoration: "none" }}>
                  <Icon name="plus" size={14} /> Post a role
                </a>
                <button onClick={onLogout} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left", padding: "10px 14px", fontSize: 13, color: T.ink, background: "none", border: "none", borderTop: `1px solid ${T.lineSoft}`, cursor: "pointer", fontFamily: T.sans }}>
                  <Icon name="logout" size={14} /> Log out
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- messages ----------
function MessageFeed({ messages, emptyLabel }) {
  if (messages.length === 0) return <div style={{ fontSize: 12.5, color: T.faint, fontStyle: "italic" }}>{emptyLabel}</div>;
  return (
    <div>
      {messages.map((m) => (

}

function MessageComposer({ onSend, placeholder, buttonLabel = "Send" }) {
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");

  const handleSend = async () => {
    if (!text.trim()) return;
    setSending(true);
    setError("");
    try {
      await onSend(text.trim());
      setText("");
    } catch (err) {
      setError(err.message || "Failed to send.");
    } finally {
      setSending(false);
    }
  };

  return (
    <div>
      <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder={placeholder} style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} />
      {error && <div style={{ color: T.red, fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <PrimaryButton onClick={handleSend} disabled={sending || !text.trim()}>{sending ? "Sending\u2026" : buttonLabel}</PrimaryButton>
    </div>
  );
}

// ---------- pipeline (kanban by stage) ----------
function PipelineView({ role, stages, candidates, recruiterMap, roleRecruiters, messages, session, refresh, refreshMessages }) {
  const [rejectingCandidate, setRejectingCandidate] = useState(null);

  const stageById = {};
  stages.forEach((s) => (stageById[s.id] = s));

  const nextStage = (candidate) => {
    const stage = stageById[candidate.stage_id];
    const currentPos = stage ? stage.position : -1;
    return stages.find((s) => s.position > currentPos) || null;
  };

  const act = async (fn) => {
    try {
      await fn();
      await refresh();
    } catch (err) {
      alert(err.message || "Something went wrong.");
    }
  };

  const active = candidates.filter(isActive);
  const rejected = candidates.filter(isRejected);
  const placed = candidates.filter(isPlaced);
  const columns = stages.length > 0 ? stages : [{ id: "__none__", name: "Unassigned", position: 0 }];
  const messagesForCandidate = (candidateId) => messages.filter((m) => m.candidate_id === candidateId);

  const renderCandidateCard = (c) => (
    <CandidateCard
      key={c.id}
      candidate={c}
      recruiterLabel={recruiterMap[c.recruiter_id]}
      nextStageName={nextStage(c) ? nextStage(c).name : null}
      onAdvance={() => act(async () => {
        const ns = nextStage(c);
        if (ns) await updateCandidate(c.id, { stage_id: ns.id });
        else await updateCandidate(c.id, { status: "placed" });
      })}
      onPlace={() => act(async () => updateCandidate(c.id, { status: "placed" }))}
      onRequestReject={() => setRejectingCandidate(c)}
      onRestore={() => act(async () => updateCandidate(c.id, { status: "active" }))}
      feedbackMessages={messagesForCandidate(c.id)}
      onSendFeedback={async (body) => {
        await sendMessage(session, role.id, c.id, c.recruiter_id, body);
        await refreshMessages();
      }}
    />
  );

  return (
    <div>
      <BenchUpdatesPanel messages={messages} onSend={async (body) => { await sendMessage(session, role.id, null, null, body); await refreshMessages(); }} />
      <RecruitersPanel recruiters={roleRecruiters} onMessage={async (recruiterId, body) => { await sendMessage(session, role.id, null, recruiterId, body); await refreshMessages(); }} />

      <div className="mp-pipeline-grid" style={{ display: "grid", gridTemplateColumns: `repeat(${columns.length}, minmax(220px, 1fr))`, gap: 18, overflowX: "auto", paddingBottom: 8 }}>
        {columns.map((stage) => {
          const inStage = active.filter((c) => (stage.id === "__none__" ? !c.stage_id : c.stage_id === stage.id));
          return (
            <div key={stage.id}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", paddingBottom: 8, borderBottom: `2px solid ${T.ink}`, marginBottom: 12 }}>
                <div style={{ fontSize: 12.5, fontWeight: 700, letterSpacing: "0.02em", color: T.ink }}>{stage.name}</div>
                <div style={{ fontSize: 12, color: T.sub }}>{inStage.length}</div>
              </div>
              {inStage.map(renderCandidateCard)}
              {inStage.length === 0 && <div style={{ fontSize: 12.5, color: T.faint, fontStyle: "italic" }}>No candidates</div>}
            </div>
          );
        })}
      </div>

      {(rejected.length > 0 || placed.length > 0) && (
        <div style={{ marginTop: 40, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: T.sub, marginBottom: 10, borderBottom: `2px solid ${T.red}`, paddingBottom: 8 }}>Rejected ({rejected.length})</div>
            {rejected.map(renderCandidateCard)}
          </div>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: T.sub, marginBottom: 10, borderBottom: `2px solid ${T.green}`, paddingBottom: 8 }}>Placed ({placed.length})</div>
            {placed.map(renderCandidateCard)}
          </div>
        </div>
      )}

      {rejectingCandidate && (
        <RejectModal
          candidate={rejectingCandidate}
          onCancel={() => setRejectingCandidate(null)}
          onConfirm={async (reason) => {
            await updateCandidate(rejectingCandidate.id, { status: "rejected" });
            await sendMessage(session, role.id, rejectingCandidate.id, rejectingCandidate.recruiter_id, reason);
            setRejectingCandidate(null);
            await refresh();
            await refreshMessages();
          }}
        />
      )}
    </div>
  );
}

// ---------- messages inbox ----------
function EmployerInbox({ session, roles }) {
  const [messages, setMessages] = useState([]);
  const [candidates, setCandidates] = useState([]);
  const [applications, setApplications] = useState([]);
  const [recruiterMap, setRecruiterMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [expandedKey, setExpandedKey] = useState(null);
  const [newMsgRole, setNewMsgRole] = useState("");
  const [newMsgRecruiter, setNewMsgRecruiter] = useState("");

  const roleIds = roles.map((r) => r.id);

  const loadAll = async () => {
    if (roleIds.length === 0) { setLoading(false); return; }
    try {
      const [msgs, cands, apps] = await Promise.all([
        fetchAllMessages(roleIds),
        fetchCandidatesForRoles(roleIds),
        fetchRoleApplications(roleIds),
      ]);
      setMessages(msgs);
      setCandidates(cands);
      setApplications(apps);
      const recruiterIds = [...new Set([...cands.map((c) => c.recruiter_id), ...apps.map((a) => a.recruiter_id)].filter(Boolean))];
      setRecruiterMap(await fetchRecruiters(recruiterIds));
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadAll(); }, [roles.length]);

  useEffect(() => {
    if (roleIds.length === 0) return;
    const channel = supabaseClient
      .channel("employer-inbox")
      .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, (payload) => {
        const row = payload.new || payload.old;
        if (row && roleIds.includes(row.role_id)) loadAll();
      })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [roles.length]);

  const roleById = {};
  roles.forEach((r) => (roleById[r.id] = r));
  const candidateById = {};
  candidates.forEach((c) => (candidateById[c.id] = c));

  const threads = {};
  messages.forEach((m) => {
    const key = `${m.role_id}:${m.candidate_id || ""}:${m.recruiter_id || ""}`;
    if (!threads[key]) threads[key] = { key, role_id: m.role_id, candidate_id: m.candidate_id, recruiter_id: m.recruiter_id, messages: [] };
    threads[key].messages.push(m);
  });
  const threadList = Object.values(threads).sort((a, b) => {
    const at = a.messages[a.messages.length - 1].created_at;
    const bt = b.messages[b.messages.length - 1].created_at;
    return new Date(bt) - new Date(at);
  });

  const threadLabel = (t) => {
    if (t.candidate_id) {
      const c = candidateById[t.candidate_id];
      return c ? `${c.name} \u2014 feedback` : "Candidate feedback";
    }
    if (t.recruiter_id) return `Direct: ${recruiterMap[t.recruiter_id] || "Recruiter"}`;
    return "Bench update";
  };

  const send = async (roleId, candidateId, recruiterId, body) => {
    await sendMessage(session, roleId, candidateId, recruiterId, body);
    await loadAll();
  };

  const applicationsForRole = (roleId) => applications.filter((a) => a.role_id === roleId);

  if (loading) return <div style={{ color: T.sub, fontSize: 13 }}>{"Loading messages\u2026"}</div>;
  if (error) return <div style={{ color: T.red, fontSize: 14 }}>{error}</div>;

  return (
    <div>
      <div style={{ fontSize: 20, fontWeight: 700, color: T.ink, marginBottom: 4 }}>Messages</div>
      <div style={{ fontSize: 13.5, color: T.sub, marginBottom: 22 }}>Every conversation with recruiters across your roles, updating live.</div>

      {roles.length > 0 && (
        <div style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 16, marginBottom: 24 }}>
          <div style={sectionLabelStyle}>New message</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: newMsgRole && newMsgRecruiter ? 10 : 0 }}>
            <select value={newMsgRole} onChange={(e) => { setNewMsgRole(e.target.value); setNewMsgRecruiter(""); }} style={{ ...inputStyle, marginBottom: 0, width: 220 }}>
              <option value="">{"Select a role\u2026"}</option>
              {roles.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
            <select value={newMsgRecruiter} onChange={(e) => setNewMsgRecruiter(e.target.value)} disabled={!newMsgRole} style={{ ...inputStyle, marginBottom: 0, width: 220 }}>
              <option value="">{"Select a recruiter\u2026"}</option>
              {applicationsForRole(newMsgRole).map((a) => (
                <option key={a.recruiter_id} value={a.recruiter_id}>{recruiterMap[a.recruiter_id] || "Recruiter"}</option>
              ))}
            </select>
          </div>
          {newMsgRole && newMsgRecruiter && (
            <MessageComposer onSend={(body) => send(newMsgRole, null, newMsgRecruiter, body)} placeholder="Write a message\u2026" buttonLabel="Send" />
          )}
        </div>
      )}

      {threadList.length === 0 ? (
        <EmptyState icon="mail" title="No messages yet" body="Conversations with recruiters about your roles and candidates will show up here as soon as they start." />
      ) : (
        threadList.map((t) => {
          const role = roleById[t.role_id];
          const open = expandedKey === t.key;
          const last = t.messages[t.messages.length - 1];
          return (
            <div key={t.key} style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 16, marginBottom: 12 }}>
              <div onClick={() => setExpandedKey(open ? null : t.key)} style={{ cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: T.ink }}>{threadLabel(t)}</div>
                  <div style={{ fontSize: 12, color: T.sub, marginTop: 2 }}>{role ? role.name : "Role"}</div>
                  {!open && <div style={{ fontSize: 12.5, color: T.sub, marginTop: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{last.body}</div>}
                </div>
                <div style={{ fontSize: 11, color: T.faint, whiteSpace: "nowrap" }}>{formatWhen(last.created_at)}</div>
              </div>
              {open && (
                <div style={{ marginTop: 14, borderTop: `1px solid ${T.lineSoft}`, paddingTop: 14 }}>
                  <MessageFeed messages={t.messages} emptyLabel="" />
                  <div style={{ marginTop: 10 }}>
                    <MessageComposer onSend={(body) => send(t.role_id, t.candidate_id, t.recruiter_id, body)} placeholder="Reply\u2026" buttonLabel="Reply" />
                  </div>
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

function ClientDashboard() {
  const [session, setSession] = useState(undefined);
  const [company, setCompany] = useState(null);
  const [tab, setTab] = useState("roles");
  const [roles, setRoles] = useState([]);
  const [counts, setCounts] = useState({});
  const [focusedId, setFocusedId] = useState(null);

  const [stages, setStages] = useState([]);
  const [candidates, setCandidates] = useState([]);
  const [recruiterMap, setRecruiterMap] = useState({});
  const [roleRecruiters, setRoleRecruiters] = useState([]);
  const [messages, setMessages] = useState([]);
  const [pipelineLoading, setPipelineLoading] = useState(false);
  const [confirmFilledRole, setConfirmFilledRole] = useState(null);

  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { window.location.href = LOGIN_URL; return; }
      setSession(session);
      try {
        const c = await getMyCompany(session);
        if (!c) { window.location.href = LOGIN_URL; return; }
        setCompany(c);
        const r = await fetchRoles(c.id);
        setRoles(r);
        setCounts(await fetchRoleCandidateCounts(r.map((x) => x.id)));
        const live = r.find((x) => (x.status || "live").toLowerCase() === "live");
        setFocusedId((live || r[0] || {}).id || null);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    });
  }, []);

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    window.location.href = LOGIN_URL;
  };

  const refreshRoleCounts = async () => setCounts(await fetchRoleCandidateCounts(roles.map((r) => r.id)));

  const loadPipeline = async (roleId) => {
    setPipelineLoading(true);
    try {
      const [s, c, m, apps] = await Promise.all([fetchStages(roleId), fetchCandidates(roleId), fetchRoleMessages(roleId), fetchRoleApplications([roleId])]);
      setStages(s);
      setCandidates(c);
      setMessages(m);
      const recruiterIds = [...new Set([...c.map((x) => x.recruiter_id), ...apps.map((a) => a.recruiter_id)].filter(Boolean))];
      const map = await fetchRecruiters(recruiterIds);
      setRecruiterMap(map);
      setRoleRecruiters(apps.map((a) => ({ id: a.recruiter_id, firm_name: map[a.recruiter_id] })));
    } catch (err) {
      setError(err.message);
    } finally {
      setPipelineLoading(false);
    }
  };

  const toggleExpand = async () => {
    const next = !expanded;
    setExpanded(next);
    if (next && focusedId) await loadPipeline(focusedId);
  };

  const focusRole = (roleId) => {
    setFocusedId(roleId);
    setExpanded(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const refreshPipeline = async () => {
    if (!focusedId) return;
    setCandidates(await fetchCandidates(focusedId));
    await refreshRoleCounts();
  };

  const refreshMessages = async () => {
    if (!focusedId) return;
    setMessages(await fetchRoleMessages(focusedId));
  };

  // Live updates while a pipeline is open, so status changes and new
  // messages show up without the employer needing to refresh.
  useEffect(() => {
    if (!focusedId || !expanded) return;
    const channel = supabaseClient
      .channel(`pipeline-${focusedId}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "candidates", filter: `role_id=eq.${focusedId}` }, () => { refreshPipeline(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "messages", filter: `role_id=eq.${focusedId}` }, () => { refreshMessages(); })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [focusedId, expanded]);

  const toggleRoleStatus = async (role, status) => {
    await updateRoleStatus(role.id, status);
    setRoles((prev) => prev.map((r) => (r.id === role.id ? { ...r, status } : r)));
  };

  if (session === undefined || loading) {
    return <div style={pageWrap}><div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.sub, fontSize: 13 }}>{"loading\u2026"}</div></div>;
  }
  if (error) {
    return <div style={pageWrap}><div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.red }}>{error}</div></div>;
  }

  const focusedRole = roles.find((r) => r.id === focusedId);
  const otherRoles = roles.filter((r) => r.id !== focusedId);
  const liveCount = roles.filter((r) => (r.status || "live").toLowerCase() === "live").length;
  const totalInterviewing = Object.values(counts).reduce((sum, c) => sum + (c ? c.active : 0), 0);
  const totalPlaced = Object.values(counts).reduce((sum, c) => sum + (c ? c.placed : 0), 0);
  const firstName = (company.contact_first_name || company.name || "there").split(" ")[0];

  return (
    <div style={pageWrap}>
      <TopNav tab={tab} onTabChange={setTab} companyName={company.name} onLogout={handleLogout} unreadHint={0} />
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "40px 28px 100px" }}>

        {tab === "roles" && (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 16, marginBottom: 10 }}>
              <div>
                <div style={{ fontSize: 28, fontWeight: 700, color: T.ink, letterSpacing: "-0.01em" }}>Welcome back, {firstName}!</div>
                <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
                  <Pill>{liveCount} live role{liveCount === 1 ? "" : "s"}</Pill>
                  <Pill tone="live">{totalInterviewing} interviewing</Pill>
                  <Pill tone="placed">{totalPlaced} placed</Pill>
                </div>
              </div>
              <PrimaryButton onClick={() => (window.location.href = NEW_ROLE_URL)}>
                <span style={{ display: "flex", alignItems: "center", gap: 6 }}><Icon name="plus" size={14} /> Post new role</span>
              </PrimaryButton>
            </div>

            <div style={{ height: 1, background: T.line, margin: "26px 0 28px" }} />

            {roles.length === 0 ? (
              <EmptyState
                icon="briefcase"
                title="No roles posted yet"
                body="Post your first role to start getting candidates from recruiters on MakePlacement."
                actions={<PrimaryButton onClick={() => (window.location.href = NEW_ROLE_URL)}>Post a role</PrimaryButton>}
              />
            ) : (
              <>
                {focusedRole && (
                  <HeroRoleCard
                    role={focusedRole}
                    counts={counts[focusedRole.id] || { active: 0, rejected: 0, placed: 0 }}
                    expanded={expanded}
                    onToggleExpand={toggleExpand}
                    onPause={(r) => toggleRoleStatus(r, "paused")}
                    onReopen={(r) => toggleRoleStatus(r, "live")}
                    onRequestFilled={(r) => setConfirmFilledRole(r)}
                  >
                    {pipelineLoading ? (
                      <div style={{ fontSize: 13, color: T.sub }}>{"Loading pipeline\u2026"}</div>
                    ) : (
                      <PipelineView
                        role={focusedRole}
                        stages={stages}
                        candidates={candidates}
                        recruiterMap={recruiterMap}
                        roleRecruiters={roleRecruiters}
                        messages={messages}
                        session={session}
                        refresh={refreshPipeline}
                        refreshMessages={refreshMessages}
                      />
                    )}
                  </HeroRoleCard>
                )}

                {otherRoles.length > 0 && (
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 14 }}>
                      Other roles ({otherRoles.length})
                    </div>
                    <div className="mp-other-roles" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 14 }}>
                      {otherRoles.map((role) => (
                        <CompactRoleCard key={role.id} role={role} counts={counts[role.id] || { active: 0, rejected: 0, placed: 0 }} onFocus={() => focusRole(role.id)} />
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
          </>
        )}

        {tab === "messages" && <EmployerInbox session={session} roles={roles} />}
      </div>

      {confirmFilledRole && (
        <ConfirmModal
          title={`Mark "${confirmFilledRole.name}" as filled?`}
          body="This tells recruiters the role is no longer open for new candidates. Double-check with your hiring team that someone has actually been placed before confirming \u2014 you can always reopen it later if that changes."
          confirmLabel="Mark as filled"
          danger
          onCancel={() => setConfirmFilledRole(null)}
          onConfirm={async () => { await toggleRoleStatus(confirmFilledRole, "filled"); setConfirmFilledRole(null); }}
        />
      )}
    </div>
  );
}

const pageWrap = { minHeight: "100vh", background: "#fff", fontFamily: T.sans, color: T.ink };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ClientDashboard />);
  </script>
</body>
</html>
