<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | MakePlacement</title>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.10/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --ink: #14181c;
      --paper: #fafbf9;
      --paper-dim: #f1f3f1;
      --steel: #dbdfe0;
      --steel-dim: #868d91;
      --blueprint: #1f3a5f;
      --blueprint-bg: #e8eef3;
      --earn: #2b6e4f;
      --earn-bg: #e7f1eb;
      --alert: #a23b2e;
      --alert-bg: #f8eae8;
      --gold: #9c7a3f;
      --gold-bg: #f4eee0;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    html, body, #root { margin: 0; min-height: 100%; }
    body { background: var(--paper); }
    ::selection { background: var(--blueprint); color: var(--paper); }

    #boot-error {
      display: none;
      max-width: 760px;
      margin: 48px auto;
      padding: 20px;
      font-family: var(--font-sans);
      color: var(--ink);
    }
    #boot-error pre {
      white-space: pre-wrap;
      background: #f7f7f7;
      padding: 12px;
      border-radius: 4px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error">
    <h2>We couldn't load the dashboard.</h2>
    <p>Please refresh the page. If the problem continues, contact support.</p>
    <pre id="boot-error-detail"></pre>
  </div>

  <script>
    window.addEventListener("error", function (event) {
      const box = document.getElementById("boot-error");
      const detail = document.getElementById("boot-error-detail");
      if (box && detail && !document.getElementById("root").hasChildNodes()) {
        box.style.display = "block";
        detail.textContent = event.error ? (event.error.stack || event.error.message) : event.message;
      }
    });
  </script>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Supabase config ----------
const SUPABASE_URL = "https://cnayvrtkxgqpejhrlakm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HM9zyIedXScyxXhT2qpV5g_-rUlXyGT";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOGIN_URL = "index.html";
const NEW_ROLE_URL = "onboarding.html";

// ---------- design tokens (mirrors the :root CSS vars above) ----------
const T = {
  ink: "#14181c",
  paper: "#fafbf9",
  paperDim: "#f1f3f1",
  steel: "#dbdfe0",
  steelDim: "#868d91",
  blueprint: "#1f3a5f",
  blueprintBg: "#e8eef3",
  earn: "#2b6e4f",
  earnBg: "#e7f1eb",
  alert: "#a23b2e",
  alertBg: "#f8eae8",
  gold: "#9c7a3f",
  goldBg: "#f4eee0",
  serif: "'Newsreader', Georgia, serif",
  sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
  mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
};

const isRejected = (s) => (s.status || "").toLowerCase() === "rejected";
const isPlaced = (s) => (s.status || "").toLowerCase() === "placed";
const isActive = (s) => !isRejected(s) && !isPlaced(s);

async function getMyCompany(session) {
  const { data, error } = await supabaseClient
    .from("companies")
    .select("*")
    .eq("auth_user_id", session.user.id)
    .maybeSingle();
  if (error) throw new Error(`Failed loading company: ${error.message}`);
  return data;
}

async function fetchRoles(companyId) {
  const { data, error } = await supabaseClient
    .from("roles")
    .select("*")
    .eq("company_id", companyId)
    .order("created_at", { ascending: false });
  if (error) throw new Error(`Failed loading roles: ${error.message}`);
  return data || [];
}

async function fetchRoleCandidateCounts(roleIds) {
  if (roleIds.length === 0) return {};
  const { data, error } = await supabaseClient
    .from("candidates")
    .select("role_id, status")
    .in("role_id", roleIds);
  if (error) throw new Error(`Failed loading candidate counts: ${error.message}`);
  const counts = {};
  roleIds.forEach((id) => (counts[id] = { active: 0, rejected: 0, placed: 0 }));
  (data || []).forEach((c) => {
    const bucket = isPlaced(c) ? "placed" : isRejected(c) ? "rejected" : "active";
    if (!counts[c.role_id]) counts[c.role_id] = { active: 0, rejected: 0, placed: 0 };
    counts[c.role_id][bucket] += 1;
  });
  return counts;
}

async function fetchStages(roleId) {
  const { data, error } = await supabaseClient
    .from("role_stages")
    .select("*")
    .eq("role_id", roleId)
    .order("position", { ascending: true });
  if (error) throw new Error(`Failed loading stages: ${error.message}`);
  return data || [];
}

async function fetchCandidates(roleId) {
  const { data, error } = await supabaseClient
    .from("candidates")
    .select("*")
    .eq("role_id", roleId)
    .order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading candidates: ${error.message}`);
  return data || [];
}

async function fetchRecruiters(recruiterIds) {
  if (recruiterIds.length === 0) return {};
  const { data, error } = await supabaseClient
    .from("recruiters")
    .select("id, firm_name")
    .in("id", recruiterIds);
  if (error) throw new Error(`Failed loading recruiters: ${error.message}`);
  const map = {};
  (data || []).forEach((r) => (map[r.id] = r.firm_name));
  return map;
}

async function updateCandidate(id, patch) {
  const { error } = await supabaseClient.from("candidates").update(patch).eq("id", id);
  if (error) throw new Error(`Failed updating candidate: ${error.message}`);
}

async function updateRoleStatus(id, status) {
  const { error } = await supabaseClient.from("roles").update({ status }).eq("id", id);
  if (error) throw new Error(`Failed updating role: ${error.message}`);
}

// ---------- messages ----------
async function fetchRoleMessages(roleId) {
  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .eq("role_id", roleId)
    .order("created_at", { ascending: true });
  if (error) throw new Error(`Failed loading messages: ${error.message}`);
  return data || [];
}

async function sendMessage(session, roleId, candidateId, body) {
  const { error } = await supabaseClient.from("messages").insert([
    {
      role_id: roleId,
      candidate_id: candidateId || null,
      sender_id: session.user.id,
      sender_type: "company",
      body,
    },
  ]);
  if (error) throw new Error(`Failed sending message: ${error.message}`);
}

// ---------- formatting ----------
function money(v) {
  return v == null || v === "" ? "—" : `$${Number(v).toLocaleString()}`;
}

function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function Mono({ children, style }) {
  return <span style={{ fontFamily: T.mono, ...style }}>{children}</span>;
}

// ---------- structural chrome ----------
function TopBar({ companyName, onLogout }) {
  return (
    <div style={{ background: T.ink, color: T.paper }}>
      <div
        style={{
          maxWidth: 1100,
          margin: "0 auto",
          padding: "16px 28px",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
        }}
      >
        <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
          <a href={LOGIN_URL} style={{ fontFamily: T.serif, fontSize: 19, fontWeight: 500, color: T.paper, textDecoration: "none", letterSpacing: "-0.01em" }}>
            MakePlacement
          </a>
          <span
            style={{
              fontFamily: T.mono,
              fontSize: 10.5,
              letterSpacing: "0.08em",
              color: "#8fa6bd",
              border: "1px solid #33445a",
              padding: "2px 7px",
              borderRadius: 3,
              textTransform: "uppercase",
            }}
          >
            Client
          </span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          {companyName && <div style={{ fontSize: 13, color: "#a8afb5" }}>{companyName}</div>}
          <button
            onClick={onLogout}
            style={{ background: "none", border: "none", fontSize: 13, color: T.paper, textDecoration: "underline", cursor: "pointer", fontFamily: T.sans, padding: 0 }}
          >
            Log out
          </button>
        </div>
      </div>
    </div>
  );
}

function Eyebrow({ children }) {
  return (
    <div
      style={{
        fontFamily: T.mono,
        fontSize: 11,
        fontWeight: 600,
        letterSpacing: "0.09em",
        textTransform: "uppercase",
        color: T.blueprint,
        marginBottom: 8,
      }}
    >
      {children}
    </div>
  );
}

function SectionHeader({ eyebrow, title, action }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 26, flexWrap: "wrap", gap: 14 }}>
      <div>
        <Eyebrow>{eyebrow}</Eyebrow>
        <div style={{ fontFamily: T.serif, fontSize: 30, fontWeight: 500, letterSpacing: "-0.015em", color: T.ink }}>{title}</div>
      </div>
      {action}
    </div>
  );
}

function PrimaryButton(props) {
  return (
    <button
      {...props}
      style={{
        fontSize: 13,
        fontWeight: 600,
        color: T.paper,
        background: T.ink,
        border: "none",
        padding: "10px 18px",
        borderRadius: 3,
        cursor: props.disabled ? "default" : "pointer",
        opacity: props.disabled ? 0.55 : 1,
        fontFamily: T.sans,
        ...props.style,
      }}
    />
  );
}

// ---------- small UI bits ----------
function Tag({ children, tone = "default" }) {
  const tones = {
    default: { fg: T.steelDim, border: T.steel, bg: "transparent" },
    live: { fg: T.blueprint, border: T.blueprint, bg: T.blueprintBg },
    paused: { fg: T.gold, border: T.gold, bg: T.goldBg },
    filled: { fg: T.earn, border: T.earn, bg: T.earnBg },
    rejected: { fg: T.alert, border: T.alert, bg: T.alertBg },
    placed: { fg: T.earn, border: T.earn, bg: T.earnBg },
  };
  const t = tones[tone] || tones.default;
  return (
    <span
      style={{
        fontFamily: T.mono,
        fontSize: 10.5,
        fontWeight: 600,
        letterSpacing: "0.05em",
        textTransform: "uppercase",
        padding: "3px 8px",
        borderRadius: 3,
        border: `1px solid ${t.border}`,
        background: t.bg,
        color: t.fg,
        whiteSpace: "nowrap",
      }}
    >
      {children}
    </span>
  );
}

function IconButton({ children, onClick, tone = "default", disabled }) {
  const tones = {
    default: { border: T.steel, fg: T.ink, bg: "#fff" },
    danger: { border: "#e3bab3", fg: T.alert, bg: "#fff" },
    primary: { border: T.ink, fg: "#fff", bg: T.ink },
  };
  const t = tones[tone];
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        fontSize: 12.5,
        fontWeight: 600,
        padding: "6px 11px",
        borderRadius: 3,
        border: `1px solid ${t.border}`,
        background: t.bg,
        color: t.fg,
        cursor: disabled ? "default" : "pointer",
        opacity: disabled ? 0.5 : 1,
        fontFamily: T.sans,
      }}
    >
      {children}
    </button>
  );
}

// A left accent bar carries status color across every card in the app --
// the one repeated device that ties roles, candidates, and messages together.
function LedgerCard({ accent = T.steel, children, style, onClick }) {
  return (
    <div
      onClick={onClick}
      style={{
        display: "flex",
        border: `1px solid ${T.steel}`,
        borderLeft: `4px solid ${accent}`,
        borderRadius: 3,
        background: "#fff",
        cursor: onClick ? "pointer" : "default",
        ...style,
      }}
    >
      <div style={{ flex: 1, minWidth: 0 }}>{children}</div>
    </div>
  );
}

function EmptyFrame({ title, body, action }) {
  return (
    <div
      style={{
        border: `1.5px dashed ${T.steel}`,
        borderRadius: 4,
        padding: "56px 24px",
        textAlign: "center",
        maxWidth: 420,
        margin: "40px auto",
      }}
    >
      <div style={{ fontFamily: T.serif, fontSize: 20, color: T.ink, marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 13.5, color: T.steelDim, marginBottom: action ? 20 : 0 }}>{body}</div>
      {action}
    </div>
  );
}

// ---------- message composer + feed ----------
function MessageComposer({ onSend, placeholder, buttonLabel = "Send" }) {
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");

  const handleSend = async () => {
    if (!text.trim()) return;
    setSending(true);
    setError("");
    try {
      await onSend(text.trim());
      setText("");
    } catch (err) {
      setError(err.message || "Failed to send.");
    } finally {
      setSending(false);
    }
  };

  return (
    <div>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder={placeholder}
        style={{
          width: "100%",
          boxSizing: "border-box",
          minHeight: 60,
          padding: 10,
          fontSize: 13,
          borderRadius: 3,
          border: `1px solid ${T.steel}`,
          outline: "none",
          resize: "vertical",
          fontFamily: T.sans,
          marginBottom: 8,
        }}
      />
      {error && <div style={{ color: T.alert, fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <IconButton tone="primary" onClick={handleSend} disabled={sending || !text.trim()}>
        {sending ? "Sending…" : buttonLabel}
      </IconButton>
    </div>
  );
}

function MessageFeed({ messages, emptyLabel }) {
  if (messages.length === 0) {
    return <div style={{ fontSize: 12.5, color: T.steelDim, fontStyle: "italic", marginBottom: 10 }}>{emptyLabel}</div>;
  }
  return (
    <div style={{ marginBottom: 12 }}>
      {messages.map((m) => (
        <div key={m.id} style={{ padding: "8px 0", borderBottom: `1px solid ${T.paperDim}` }}>
          <div style={{ fontSize: 13, color: "#333", whiteSpace: "pre-wrap" }}>{m.body}</div>
          <div style={{ fontFamily: T.mono, fontSize: 10.5, color: T.steelDim, marginTop: 3 }}>
            {m.sender_type === "company" ? "you" : "recruiter"} · {formatWhen(m.created_at)}
          </div>
        </div>
      ))}
    </div>
  );
}

function BenchUpdatesPanel({ messages, onSend }) {
  const [open, setOpen] = useState(false);
  const broadcasts = messages.filter((m) => !m.candidate_id);

  return (
    <LedgerCard accent={T.blueprint} style={{ padding: 18, marginBottom: 24 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: open ? 14 : 0 }}>
        <div style={{ fontSize: 14, fontWeight: 600 }}>Updates to the bench</div>
        <button
          onClick={() => setOpen((o) => !o)}
          style={{ background: "none", border: "none", fontSize: 12.5, color: T.ink, textDecoration: "underline", cursor: "pointer", fontFamily: T.sans }}
        >
          {open ? "Hide" : broadcasts.length > 0 ? `View (${broadcasts.length})` : "Send an update"}
        </button>
      </div>
      {open && (
        <div>
          <div style={{ fontSize: 12, color: T.steelDim, marginBottom: 10 }}>
            Visible to every recruiter with a candidate currently in this role's pipeline.
          </div>
          <MessageFeed messages={broadcasts} emptyLabel="No updates sent yet." />
          <MessageComposer
            onSend={onSend}
            placeholder="e.g. We're prioritizing candidates with security clearance this week."
            buttonLabel="Send to bench"
          />
        </div>
      )}
    </LedgerCard>
  );
}

function CandidateFeedbackThread({ messages, onSend }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ marginTop: 10 }}>
      <button
        onClick={() => setOpen((o) => !o)}
        style={{ background: "none", border: "none", fontSize: 12, color: T.ink, textDecoration: "underline", cursor: "pointer", padding: 0, fontFamily: T.sans }}
      >
        {open ? "Hide feedback" : messages.length > 0 ? `Feedback (${messages.length})` : "Add feedback"}
      </button>
      {open && (
        <div style={{ marginTop: 10, borderTop: `1px solid ${T.paperDim}`, paddingTop: 10 }}>
          <MessageFeed messages={messages} emptyLabel="No feedback sent yet." />
          <MessageComposer
            onSend={onSend}
            placeholder="e.g. Not enough hands-on infra experience for this role."
            buttonLabel="Send to recruiter"
          />
        </div>
      )}
    </div>
  );
}

// ---------- Roles overview ----------
function RolesOverview({ roles, counts, onOpenRole, onToggleRoleStatus }) {
  const liveCount = roles.filter((r) => (r.status || "live").toLowerCase() === "live").length;

  return (
    <div>
      <SectionHeader
        eyebrow={`${roles.length} role${roles.length === 1 ? "" : "s"} on file · ${liveCount} live`}
        title="Your roles"
        action={<PrimaryButton onClick={() => (window.location.href = NEW_ROLE_URL)}>+ Post new role</PrimaryButton>}
      />

      {roles.length === 0 && (
        <EmptyFrame
          title="No roles posted yet"
          body='Use "Post new role" above to get your first role in front of recruiters.'
        />
      )}

      <div style={{ display: "grid", gap: 12 }}>
        {roles.map((role) => {
          const c = counts[role.id] || { active: 0, rejected: 0, placed: 0 };
          const status = (role.status || "live").toLowerCase();
          const accent = status === "live" ? T.blueprint : status === "filled" ? T.earn : T.gold;
          return (
            <LedgerCard key={role.id} accent={accent}>
              <div
                style={{
                  padding: "18px 20px",
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: 16,
                  flexWrap: "wrap",
                }}
              >
                <div style={{ cursor: "pointer", flex: 1, minWidth: 220 }} onClick={() => onOpenRole(role.id)}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 5 }}>
                    <div style={{ fontFamily: T.serif, fontSize: 18, fontWeight: 500 }}>{role.name}</div>
                    <Tag tone={status}>{status}</Tag>
                  </div>
                  <div style={{ fontSize: 13, color: T.steelDim }}>
                    <Mono>{money(role.min_salary)} – {money(role.max_salary)}</Mono>
                  </div>
                </div>

                <div style={{ display: "flex", gap: 6 }} onClick={() => onOpenRole(role.id)}>
                  <Tag>{c.active} active</Tag>
                  <Tag tone="rejected">{c.rejected} rejected</Tag>
                  <Tag tone="placed">{c.placed} placed</Tag>
                </div>

                <div style={{ display: "flex", gap: 8 }}>
                  <IconButton onClick={() => onOpenRole(role.id)}>View pipeline</IconButton>
                  {status === "live" && (
                    <IconButton onClick={() => onToggleRoleStatus(role, "paused")}>Pause</IconButton>
                  )}
                  {status === "paused" && (
                    <IconButton onClick={() => onToggleRoleStatus(role, "live")}>Reopen</IconButton>
                  )}
                  {status !== "filled" && (
                    <IconButton onClick={() => onToggleRoleStatus(role, "filled")}>Mark filled</IconButton>
                  )}
                </div>
              </div>
            </LedgerCard>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Candidate card ----------
function CandidateCard({ candidate, recruiterLabel, nextStageName, onAdvance, onReject, onPlace, onRestore, feedbackMessages, onSendFeedback }) {
  const rejected = isRejected(candidate);
  const placed = isPlaced(candidate);
  const accent = placed ? T.earn : rejected ? T.alert : T.steel;

  return (
    <LedgerCard accent={accent} style={{ padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div>
          <div style={{ fontSize: 14.5, fontWeight: 600 }}>{candidate.name}</div>
          {recruiterLabel && (
            <div style={{ fontSize: 12, color: T.steelDim, marginTop: 2 }}>via {recruiterLabel}</div>
          )}
        </div>
        {rejected && <Tag tone="rejected">Rejected</Tag>}
        {placed && <Tag tone="placed">Placed</Tag>}
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
        {candidate.linkedin && (
          <a href={candidate.linkedin} target="_blank" rel="noreferrer" style={{ fontSize: 12.5, color: T.blueprint }}>
            LinkedIn
          </a>
        )}
        {candidate.resume_url && (
          <a href={candidate.resume_url} target="_blank" rel="noreferrer" style={{ fontSize: 12.5, color: T.blueprint }}>
            Resume
          </a>
        )}
        {candidate.email && <span style={{ fontSize: 12.5, color: T.steelDim }}>{candidate.email}</span>}
      </div>

      {candidate.notes && (
        <div style={{ fontSize: 13, color: "#444", marginTop: 8, whiteSpace: "pre-wrap" }}>{candidate.notes}</div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        {isActive(candidate) && (
          <>
            <IconButton tone="primary" onClick={onAdvance}>
              {nextStageName ? `Advance → ${nextStageName}` : "Mark placed"}
            </IconButton>
            <IconButton tone="danger" onClick={onReject}>
              Reject
            </IconButton>
            {nextStageName && <IconButton onClick={onPlace}>Mark placed</IconButton>}
          </>
        )}
        {!isActive(candidate) && <IconButton onClick={onRestore}>Restore to active</IconButton>}
      </div>

      <CandidateFeedbackThread messages={feedbackMessages} onSend={onSendFeedback} />
    </LedgerCard>
  );
}

// ---------- Pipeline view ----------
function PipelineView({ role, stages, candidates, recruiterMap, messages, session, onBack, refresh, refreshMessages }) {
  const stageById = useMemo(() => {
    const m = {};
    stages.forEach((s) => (m[s.id] = s));
    return m;
  }, [stages]);

  const nextStage = (candidate) => {
    const stage = stageById[candidate.stage_id];
    const currentPos = stage ? stage.position : -1;
    return stages.find((s) => s.position > currentPos) || null;
  };

  const act = async (fn) => {
    try {
      await fn();
      await refresh();
    } catch (err) {
      alert(err.message || "Something went wrong.");
    }
  };

  const active = candidates.filter(isActive);
  const rejected = candidates.filter(isRejected);
  const placed = candidates.filter(isPlaced);

  const columns = stages.length > 0 ? stages : [{ id: "__none__", name: "Unassigned", position: 0 }];

  const messagesForCandidate = (candidateId) => messages.filter((m) => m.candidate_id === candidateId);

  const renderCandidateCard = (c) => (
    <CandidateCard
      key={c.id}
      candidate={c}
      recruiterLabel={recruiterMap[c.recruiter_id]}
      nextStageName={nextStage(c) ? nextStage(c).name : null}
      onAdvance={() =>
        act(async () => {
          const ns = nextStage(c);
          if (ns) await updateCandidate(c.id, { stage_id: ns.id });
          else await updateCandidate(c.id, { status: "placed" });
        })
      }
      onPlace={() => act(async () => updateCandidate(c.id, { status: "placed" }))}
      onReject={() => act(async () => updateCandidate(c.id, { status: "rejected" }))}
      onRestore={() => act(async () => updateCandidate(c.id, { status: "active" }))}
      feedbackMessages={messagesForCandidate(c.id)}
      onSendFeedback={async (body) => {
        await sendMessage(session, role.id, c.id, body);
        await refreshMessages();
      }}
    />
  );

  return (
    <div>
      <div style={{ marginBottom: 22 }}>
        <button
          onClick={onBack}
          style={{ background: "none", border: "none", color: T.steelDim, fontSize: 13, cursor: "pointer", padding: 0, fontFamily: T.mono }}
        >
          ← all roles
        </button>
        <div style={{ fontFamily: T.serif, fontSize: 28, fontWeight: 500, marginTop: 10, letterSpacing: "-0.01em" }}>{role.name}</div>
        <div style={{ fontSize: 13.5, color: T.steelDim }}>
          <Mono>{money(role.min_salary)} – {money(role.max_salary)}</Mono>
        </div>
      </div>

      <BenchUpdatesPanel
        messages={messages}
        onSend={async (body) => {
          await sendMessage(session, role.id, null, body);
          await refreshMessages();
        }}
      />

      <div
        style={{
          display: "grid",
          gridTemplateColumns: `repeat(${columns.length}, minmax(220px, 1fr))`,
          gap: 18,
          overflowX: "auto",
          paddingBottom: 8,
        }}
      >
        {columns.map((stage) => {
          const inStage = active.filter((c) =>
            stage.id === "__none__" ? !c.stage_id : c.stage_id === stage.id
          );
          return (
            <div key={stage.id}>
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "baseline",
                  paddingBottom: 8,
                  borderBottom: `2px solid ${T.blueprint}`,
                  marginBottom: 12,
                }}
              >
                <div style={{ fontFamily: T.mono, fontSize: 11.5, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: T.ink }}>
                  {stage.name}
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 11.5, color: T.steelDim }}>[{inStage.length}]</div>
              </div>
              {inStage.map(renderCandidateCard)}
              {inStage.length === 0 && (
                <div style={{ fontSize: 12.5, color: "#c4c4c4", fontStyle: "italic" }}>No candidates</div>
              )}
            </div>
          );
        })}
      </div>

      {(rejected.length > 0 || placed.length > 0) && (
        <div style={{ marginTop: 44, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
          <div>
            <div style={{ fontFamily: T.mono, fontSize: 11.5, fontWeight: 600, letterSpacing: "0.04em", color: T.steelDim, textTransform: "uppercase", marginBottom: 10, borderBottom: `2px solid ${T.alert}`, paddingBottom: 8 }}>
              Rejected [{rejected.length}]
            </div>
            {rejected.map(renderCandidateCard)}
          </div>
          <div>
            <div style={{ fontFamily: T.mono, fontSize: 11.5, fontWeight: 600, letterSpacing: "0.04em", color: T.steelDim, textTransform: "uppercase", marginBottom: 10, borderBottom: `2px solid ${T.earn}`, paddingBottom: 8 }}>
              Placed [{placed.length}]
            </div>
            {placed.map(renderCandidateCard)}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- main ----------
function ClientDashboard() {
  const [session, setSession] = useState(undefined);
  const [company, setCompany] = useState(null);
  const [roles, setRoles] = useState([]);
  const [counts, setCounts] = useState({});
  const [selectedRoleId, setSelectedRoleId] = useState(null);
  const [stages, setStages] = useState([]);
  const [candidates, setCandidates] = useState([]);
  const [recruiterMap, setRecruiterMap] = useState({});
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) {
        window.location.href = LOGIN_URL;
        return;
      }
      setSession(session);
      try {
        const c = await getMyCompany(session);
        if (!c) {
          window.location.href = LOGIN_URL;
          return;
        }
        setCompany(c);
        const r = await fetchRoles(c.id);
        setRoles(r);
        setCounts(await fetchRoleCandidateCounts(r.map((x) => x.id)));
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    });
  }, []);

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    window.location.href = LOGIN_URL;
  };

  const refreshRoleCounts = async (roleIds) => setCounts(await fetchRoleCandidateCounts(roleIds));

  const openRole = async (roleId) => {
    setSelectedRoleId(roleId);
    setLoading(true);
    try {
      const [s, c, m] = await Promise.all([fetchStages(roleId), fetchCandidates(roleId), fetchRoleMessages(roleId)]);
      setStages(s);
      setCandidates(c);
      setMessages(m);
      const recruiterIds = [...new Set(c.map((x) => x.recruiter_id).filter(Boolean))];
      setRecruiterMap(await fetchRecruiters(recruiterIds));
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  const refreshPipeline = async () => {
    if (!selectedRoleId) return;
    const c = await fetchCandidates(selectedRoleId);
    setCandidates(c);
    await refreshRoleCounts(roles.map((r) => r.id));
  };

  const refreshMessages = async () => {
    if (!selectedRoleId) return;
    setMessages(await fetchRoleMessages(selectedRoleId));
  };

  const toggleRoleStatus = async (role, status) => {
    try {
      await updateRoleStatus(role.id, status);
      setRoles((prev) => prev.map((r) => (r.id === role.id ? { ...r, status } : r)));
    } catch (err) {
      alert(err.message || "Couldn't update role status.");
    }
  };

  if (session === undefined || loading) {
    return (
      <div style={pageWrap}>
        <TopBar companyName={company ? company.name : ""} onLogout={handleLogout} />
        <div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.steelDim, fontFamily: T.mono, fontSize: 13 }}>loading…</div>
      </div>
    );
  }

  if (error) {
    return (
      <div style={pageWrap}>
        <TopBar companyName={company ? company.name : ""} onLogout={handleLogout} />
        <div style={{ maxWidth: 520, margin: "160px auto", textAlign: "center", color: T.alert }}>{error}</div>
      </div>
    );
  }

  const selectedRole = roles.find((r) => r.id === selectedRoleId);

  return (
    <div style={pageWrap}>
      <TopBar companyName={company ? company.name : ""} onLogout={handleLogout} />
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "44px 28px 100px" }}>
        {!selectedRole && (
          <RolesOverview
            roles={roles}
            counts={counts}
            onOpenRole={openRole}
            onToggleRoleStatus={toggleRoleStatus}
          />
        )}
        {selectedRole && (
          <PipelineView
            role={selectedRole}
            stages={stages}
            candidates={candidates}
            recruiterMap={recruiterMap}
            messages={messages}
            session={session}
            onBack={() => setSelectedRoleId(null)}
            refresh={refreshPipeline}
            refreshMessages={refreshMessages}
          />
        )}
      </div>
    </div>
  );
}

const pageWrap = {
  minHeight: "100vh",
  background: T.paper,
  fontFamily: T.sans,
  color: T.ink,
};

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ClientDashboard />);
  </script>
</body>
</html>
