<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>makeplacement</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="site.webmanifest">
<meta http-equiv="refresh" content="0; url=index.html">
</head>
<body>
<script>
  // Cold email links and old bookmarks land here -- forward straight to
  // the homepage with the signup modal auto-opened, preserving whatever
  // email/mode this link was carrying so it still lands prefilled.
  // replace() (and the meta refresh above as a no-JS fallback) so this
  // stub never sits in browser history for Back to land on.
  var params = new URLSearchParams(window.location.search);
  params.set('signup', '1');
  window.location.replace('index.html?' + params.toString());
</script>
</body>
</html>
